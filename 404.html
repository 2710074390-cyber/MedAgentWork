<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfaf8">
<title>404 · 页面或文件不存在 · MedAgentWork</title>
<script>
/* 与首页同源的主题定档：避免首帧闪变 */
try{
  var _t=localStorage.getItem('maw-theme');
  var _d=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  if(_t==='dark'||_t==='light'){document.documentElement.setAttribute('data-theme',_t);}
  else if(_d){document.documentElement.setAttribute('data-theme','dark');}
}catch(e){}
</script>
<style>
:root{
  color-scheme:light;
  --bg:#fbfaf8; --fg:#0e1f2a; --fg-muted:#4d5a63; --fg-subtle:#7a868e;
  --border:rgba(14,31,42,0.12); --brand:#1f5fa8; --brand-soft:rgba(31,95,168,0.08);
  --card:#ffffff; --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1116; --fg:#e9eff3; --fg-muted:#a9b5bd; --fg-subtle:#7d8a93;
  --border:rgba(233,239,243,0.14); --brand:#7aa5f8; --brand-soft:rgba(122,165,248,0.12);
  --card:#171f27;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.75;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:28px}
main{width:100%;max-width:620px}
.eyebrow{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--fg-subtle);margin-bottom:18px}
.code{font-family:var(--mono);font-size:clamp(64px,16vw,104px);line-height:1;font-weight:700;
  letter-spacing:-.04em;color:var(--brand);margin:0 0 8px}
h1{font-size:clamp(20px,4.6vw,27px);line-height:1.45;margin:0 0 12px;letter-spacing:-.01em}
p{margin:0 0 14px;color:var(--fg-muted);font-size:15px}
.card{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:16px 18px;margin:22px 0}
.card b{color:var(--fg);font-weight:600}
.card p:last-child{margin-bottom:0}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;
  padding:10px 18px;border-radius:999px;border:1px solid var(--border);color:var(--fg);
  transition:background .16s ease,border-color .16s ease}
a.btn:hover{background:var(--brand-soft);border-color:var(--brand)}
a.btn-pri{background:var(--brand);border-color:var(--brand);color:#fff}
a.btn-pri:hover{filter:brightness(1.06)}
.foot{margin-top:26px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--fg-subtle)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <span class="eyebrow">MedAgentWork · 医学复习资料库</span>
  <p class="code" aria-hidden="true">404</p>
  <h1>这个页面或文件不在了</h1>
  <p>链接可能已过期：资料改版后文件会改名或下架，分享时也可能被截断。</p>

  <div class="card">
    <p><b>如果你刚下载了一个 PDF，却打不开——</b>多半是拿到了这个页面，而不是文件本身。</p>
    <p>请从资料库列表重新进入并下载；若列表里的文件下载后仍提示「文件损坏」，对照卡片标注的大小，明显偏小说明网络中断没下完，重新下载即可。</p>
  </div>

  <div class="acts">
    <a class="btn btn-pri" href="/">回首页</a>
    <a class="btn" href="/#/s2">大三下资料库</a>
    <a class="btn" href="/#/s1">大四上资料库</a>
  </div>
  <p class="foot">MEDAGENTWORK · 仅供学习交流</p>
</main>
</body>
</html>
