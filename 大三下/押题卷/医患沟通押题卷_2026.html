<!-- ==================== 模板逻辑（迁移时保持不变） ==================== -->
<script>
(function () {
  var STORAGE_KEY = 'maw-theme';        // 与 index.html 共享主题记忆
  var RECORD_KEY = 'maw-quiz-record-' + (PAPER_META.title || 'default');

  // ---- 主题（三态循环：深海 → 亮 → 暗；默认深海，与 index.html 新站统一） ----
  var html = document.documentElement;
  var ORDER = ['deep', 'light', 'dark'];
  var NEXT = { deep: 'light', light: 'dark', dark: 'deep' };
  var ICON = { deep: '🌊', light: '☀️', dark: '🌙' };   // 图标 = 点击后切换到的主题
  function applyTheme(t) {
    html.setAttribute('data-theme', t);
    document.getElementById('theme-toggle').textContent = ICON[NEXT[t]];
    try { localStorage.setItem(STORAGE_KEY, t); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  applyTheme(ORDER.indexOf(saved) >= 0 ? saved : 'deep');
  document.getElementById('theme-toggle').addEventListener('click', function () {
    applyTheme(NEXT[html.getAttribute('data-theme')]);
  });

  // ---- 作答记录 ----
  var records = {};
  try { records = JSON.parse(localStorage.getItem(RECORD_KEY) || '{}'); } catch (e) { records = {}; }
  function saveRecords() {
    try { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); } catch (e) {}
  }

  // ---- 状态 ----
  var state = { filterSystem: null, wrongOnly: false };

  // ---- 渲染 ----
  var quizEl = document.getElementById('quiz');
  function visibleQuestions() {
    return QUESTIONS.filter(function (q) {
      if (state.wrongOnly) {
        var r = records[q.qid];
        return r && !r.correct;
      }
      if (state.filterSystem && q.system && q.system !== state.filterSystem) return false;
      return true;
    });
  }
  function render() {
    var list = visibleQuestions();
    quizEl.innerHTML = '';
    list.forEach(function (q, i) {
      quizEl.appendChild(buildCard(q, i + 1));
    });
    updateScore();
  }
  function buildCard(q, n) {
    var rec = records[q.qid] || null;
    var card = document.createElement('div');
    card.className = 'question';
    card.dataset.qid = q.qid;

    var meta = document.createElement('div');
    meta.className = 'q-meta';
    var verdict = '';
    if (rec) {
      card.classList.add(rec.correct ? 'is-correct' : 'is-wrong');
      verdict = '<span class="q-verdict ' + (rec.correct ? 'ok' : 'no') + '">' +
        (rec.correct ? '✓ 已答对' : '✗ 答错') + '</span>';
    }
    meta.innerHTML =
      '<span class="q-num">第 ' + n + ' 题</span>' +
      '<span class="q-type">' + q.type + (q.type === 'X' ? ' ·多选' : '') + '</span>' +
      (q.bloom ? '<span class="q-bloom">' + q.bloom + '</span>' : '') + verdict;
    card.appendChild(meta);

    var stem = document.createElement('div');
    stem.className = 'q-stem';
    stem.innerHTML = q.stem;
    card.appendChild(stem);

    var multi = q.type === 'X';
    var multiPicks = [];
    q.options.forEach(function (opt, idx) {
      var letter = String.fromCharCode(65 + idx);
      var el = document.createElement('div');
      el.className = 'option';
      el.innerHTML = '<span class="opt-label">' + letter + '.</span><span>' + opt + '</span><span class="opt-mark"></span>';
      // 恢复已答状态
      if (rec) {
        var pickedNow = multi ? rec.picked.indexOf(letter) >= 0 : rec.picked === letter;
        var isAnswer = q.answer.indexOf(letter) >= 0;
        if (pickedNow) el.classList.add(multi && !isAnswer ? 'wrong-pick' : 'picked');
        if (isAnswer) { el.classList.add('correct-show'); el.querySelector('.opt-mark').textContent = '✓'; }
        if (pickedNow && !isAnswer) el.querySelector('.opt-mark').textContent = '✗';
      } else {
        el.addEventListener('click', (function (letter) {
          return function () { handlePick(q, card, letter, el, multi, multiPicks); };
        })(letter));
      }
      card.appendChild(el);
    });

    // 解析面板
    var box = document.createElement('div');
    box.className = 'answer-box';
    if (rec) {
      box.classList.add(rec.correct ? 'ok' : 'no');
      box.classList.add('show');
    }
    box.innerHTML =
      '<div class="ans-head">' + (rec ? (rec.correct ? '✓ 回答正确' : '✗ 回答错误') : '') + '　正确答案：' + q.answer + '</div>' +
      '<div class="exp">' + q.explanation + '</div>' +
      (q.source ? '<div class="src">来源：' + q.source + '　用时：' + ((rec && rec.seconds) || '-') + 's</div>' : '');
    card.appendChild(box);

    // X 型多选确认按钮（2026-08-21 补全：已选≥1 显示，点击判分）
    if (multi) {
      var bar = document.createElement('div');
      bar.className = 'multi-confirm';
      var cbtn = document.createElement('button');
      cbtn.className = 'btn-confirm';
      cbtn.textContent = '确认作答';
      cbtn.disabled = true;
      cbtn.addEventListener('click', function () { judgeMulti(q, card, multiPicks); });
      bar.appendChild(cbtn);
      var hint = document.createElement('span');
      hint.className = 'q-bloom';
      hint.textContent = '已选 0 项';
      bar.appendChild(hint);
      bar.style.display = 'none';
      card.appendChild(bar);
    }
    return card;
  }

  var startTime = Date.now();
  function handlePick(q, card, letter, el, multi, multiPicks) {
    if (multi) {
      var pos = multiPicks.indexOf(letter);
      if (pos >= 0) { multiPicks.splice(pos, 1); el.classList.remove('picked'); }
      else { multiPicks.push(letter); el.classList.add('picked'); }
      // 更新确认按钮状态
      var bar = card.querySelector('.multi-confirm');
      if (bar) {
        bar.style.display = 'block';
        bar.querySelector('.btn-confirm').disabled = multiPicks.length === 0;
        bar.querySelector('span').textContent = '已选 ' + multiPicks.length + ' 项';
      }
      return;
    }
    // 单选：立即判分
    var correct = q.answer === letter;
    var seconds = Math.round((Date.now() - startTime) / 1000);
    startTime = Date.now();
    records[q.qid] = {
      qid: q.qid, picked: letter, correct: correct,
      seconds: seconds, ts: new Date().toISOString()
    };
    saveRecords();
    render(); // 重渲染以显示三通道反馈 + 解析
  }

  // X 型多选判分（2026-08-21 补全）：所选集合与答案字母集合一致即对（顺序无关）
  function judgeMulti(q, card, multiPicks) {
    if (multiPicks.length === 0) return;
    var picked = multiPicks.slice().sort().join('');
    var ans = (q.answer || '').split('').sort().join('');
    var correct = picked === ans;
    var seconds = Math.round((Date.now() - startTime) / 1000);
    startTime = Date.now();
    records[q.qid] = {
      qid: q.qid, picked: picked, correct: correct,
      seconds: seconds, ts: new Date().toISOString()
    };
    saveRecords();
    render();
  }

  // 多选确认：X 型题点击第3个选项后自动判分（简化约定，迁移时可改为确认按钮）
  var _origHandlePick = handlePick;

  // ---- 计分 ----
  function updateScore() {
    var answered = 0, right = 0;
    QUESTIONS.forEach(function (q) {
      var r = records[q.qid];
      if (r) { answered++; if (r.correct) right++; }
    });
    var rate = answered ? Math.round(right * 100 / answered) + '%' : '--';
    document.getElementById('score').textContent =
      '已答 ' + answered + '/' + QUESTIONS.length + ' · 正确 ' + right + ' · 正确率 ' + rate;
    document.getElementById('progress-fill').style.width =
      (answered * 100 / Math.max(QUESTIONS.length, 1)) + '%';
  }

  // ---- 系统筛选标签（可选功能） ----
  var systems = [];
  QUESTIONS.forEach(function (q) { if (q.system && systems.indexOf(q.system) < 0) systems.push(q.system); });
  if (systems.length > 1) {
    var tagBox = document.getElementById('system-tags');
    tagBox.classList.add('show');
    systems.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'system-tag';
      b.textContent = s;
      b.addEventListener('click', function () {
        state.filterSystem = (state.filterSystem === s) ? null : s;
        state.wrongOnly = false;
        render();
        document.querySelectorAll('.system-tag').forEach(function (t) {
          t.classList.toggle('active', t.textContent === state.filterSystem);
        });
      });
      tagBox.appendChild(b);
    });
  }

  // ---- 工具栏 ----
  document.getElementById('btn-wrong').addEventListener('click', function () {
    state.wrongOnly = !state.wrongOnly;
    this.classList.toggle('active', state.wrongOnly);
    render();
  });
  document.getElementById('btn-all').addEventListener('click', function () {
    state.wrongOnly = false; state.filterSystem = null;
    document.getElementById('btn-wrong').classList.remove('active');
    document.querySelectorAll('.system-tag').forEach(function (t) { t.classList.remove('active'); });
    render();
  });
  document.getElementById('btn-reset').addEventListener('click', function () {
    if (!confirm('确认清空本卷作答记录？')) return;
    records = {};
    saveRecords();
    render();
  });
  document.getElementById('btn-export').addEventListener('click', function () {
    var payload = {
      paper: PAPER_META.title,
      exported_at: new Date().toISOString(),
      stats: (function () {
        var a = 0, r = 0;
        Object.keys(records).forEach(function (k) { a++; if (records[k].correct) r++; });
        return { answered: a, correct: r };
      })(),
      records: records
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (PAPER_META.title || 'quiz') + '_作答记录.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ---- 标题 ----
  document.getElementById('paper-title').textContent = PAPER_META.title;
  document.getElementById('paper-sub').textContent = PAPER_META.sub;

  render();
})();
</script>
