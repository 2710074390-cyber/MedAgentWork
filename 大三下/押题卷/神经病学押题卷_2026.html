{"t": "q", "n": 2, "tp": "A1", "s": "神经系统疾病诊断中，定位诊断主要依据的是：", "o": [{"l": "A", "x": "起病急缓和病程演变特点"}, {"l": "B", "x": "神经系统症状体征的解剖学分布规律"}, {"l": "C", "x": "脑脊液检查结果"}, {"l": "D", "x": "既往病史和家族史"}, {"l": "E", "x": "影像学检查的异常信号"}], "c": ["B"], "ex": "定位诊断的核心依据是利用神经系统解剖生理知识，根据症状体征推断病变的解剖部位。起病方式和病程演变属于定性诊断范畴。", "sr": "教材P2", "bl": "记忆"},

{"t": "q", "n": 4, "tp": "A1", "s": "中枢神经系统由以下哪两部分组成？", "o": [{"l": "A", "x": "大脑和小脑"}, {"l": "B", "x": "脑和脑神经"}, {"l": "C", "x": "脊髓和脊神经"}, {"l": "D", "x": "脑和脊髓"}, {"l": "E", "x": "脑干和脊髓"}], "c": ["D"], "ex": "中枢神经系统包括脑（大脑、间脑、脑干、小脑）和脊髓。脑神经和脊神经属周围神经系统。", "sr": "教材P10", "bl": "记忆"},
{"t": "q", "n": 5, "tp": "A1", "s": "上运动神经元性瘫痪与下运动神经元性瘫痪的鉴别中，上运动神经元性瘫痪的特征是：", "o": [{"l": "A", "x": "肌张力减低，腱反射减弱"}, {"l": "B", "x": "无病理反射"}, {"l": "C", "x": "明显肌萎缩"}, {"l": "D", "x": "肌束震颤明显"}, {"l": "E", "x": "肌张力增高，腱反射亢进"}], "c": ["E"], "ex": "上运动神经元损害→痉挛性瘫痪：肌张力增高（折刀样）、腱反射亢进、病理征阳性、无明显肌萎缩。下运动神经元损害→弛缓性瘫痪：肌张力减低、腱反射减弱、明显肌萎缩。", "sr": "教材P25-27", "bl": "理解"},

{"t": "q", "n": 10, "tp": "A1", "s": "唯一完全由对侧皮质脑干束支配的脑神经运动核是：", "o": [{"l": "A", "x": "动眼神经核"}, {"l": "B", "x": "三叉神经运动核"}, {"l": "C", "x": "副神经核"}, {"l": "D", "x": "疑核"}, {"l": "E", "x": "面神经核下部"}], "c": ["E"], "ex": "面神经核上部（额肌、眼轮匝肌）接受双侧支配；面神经核下部和舌下神经核仅接受对侧支配。这是中枢性与周围性面瘫鉴别的解剖基础。", "sr": "教材P40", "bl": "记忆"},
{"t": "q", "n": 11, "tp": "A2", "s": "患者男，60岁，突发左侧肢体无力。查体：左侧鼻唇沟浅，伸舌偏左，左侧上下肢肌力3级，左侧Babinski征(+)，左侧偏身痛觉减退。最可能的病变部位是：", "o": [{"l": "A", "x": "右侧内囊"}, {"l": "B", "x": "左侧内囊"}, {"l": "C", "x": "左侧脑干"}, {"l": "D", "x": "右侧脊髓"}, {"l": "E", "x": "左侧大脑皮质"}], "c": ["A"], "ex": "左侧中枢性面瘫+左侧肢体偏瘫+左侧偏身感觉障碍=典型的右侧内囊三偏征。", "sr": "教材P35", "bl": "应用"},
{"t": "q", "n": 12, "tp": "A2", "s": "患者女，45岁，右侧面部痛温觉丧失，左侧躯干和肢体痛温觉丧失，伴声音嘶哑、吞咽困难、右侧Horner征。最可能的病变是：", "o": [{"l": "A", "x": "右侧大脑半球病变"}, {"l": "B", "x": "右侧延髓背外侧病变"}, {"l": "C", "x": "左侧内囊病变"}, {"l": "D", "x": "右侧脑桥病变"}, {"l": "E", "x": "右侧小脑病变"}], "c": ["B"], "ex": "交叉性感觉障碍+后组脑神经麻痹+Horner征=延髓背外侧综合征（Wallenberg综合征），小脑后下动脉或椎动脉闭塞所致。", "sr": "教材P48", "bl": "应用"},
{"t": "q", "n": 13, "tp": "A2", "s": "患者男，50岁，查体：右眼外斜视，右眼向内、向上、向下运动受限，右眼睑下垂，右侧瞳孔散大、对光反射消失，左侧肢体瘫痪。病变部位在：", "o": [{"l": "A", "x": "右侧动眼神经"}, {"l": "B", "x": "右侧脑桥"}, {"l": "C", "x": "右侧中脑大脑脚"}, {"l": "D", "x": "左侧内囊"}, {"l": "E", "x": "右侧延髓"}], "c": ["C"], "ex": "同侧动眼神经麻痹+对侧偏瘫=Weber综合征（中脑大脑脚综合征），累及同侧动眼神经根和皮质脊髓束。", "sr": "教材P47", "bl": "应用"},
{"t": "q", "n": 14, "tp": "A2", "s": "患者女，35岁，双下肢无力伴麻木进行性加重3个月。查体：T10平面以下深感觉障碍，右侧下肢肌力3级肌张力增高，左侧下肢痛温觉减退。最可能的诊断是：", "o": [{"l": "A", "x": "T10完全横贯性损害"}, {"l": "B", "x": "周围神经病变"}, {"l": "C", "x": "左侧T10半切综合征"}, {"l": "D", "x": "右侧T10半切综合征"}, {"l": "E", "x": "大脑皮质病变"}], "c": ["D"], "ex": "同侧深感觉障碍+同侧痉挛性瘫+对侧痛温觉障碍=Brown-Sequard综合征，右侧下肢瘫→病变在右侧。", "sr": "教材P32", "bl": "应用"},
{"t": "b", "n": 15, "lb": "共用选项：A.折刀样肌张力增高 B.铅管样肌张力增高 C.齿轮样肌张力增高 D.肌张力减低 E.去脑强直"},
{"t": "q", "n": 15, "tp": "B1", "s": "(1) 上运动神经元损害的肌张力改变是", "o": [{"l": "A", "x": "折刀样肌张力增高"}, {"l": "B", "x": "铅管样肌张力增高"}, {"l": "C", "x": "齿轮样肌张力增高"}, {"l": "D", "x": "肌张力减低"}, {"l": "E", "x": "去脑强直"}], "c": ["E"], "ex": "(1)锥体束损害→折刀样肌张力增高；(2)帕金森病→铅管样/齿轮样肌张力增高（齿轮样为合并震颤时的特征）。", "sr": "教材P25-27/P150", "bl": "理解"},

{"t": "q", "n": 17, "tp": "A1", "s": "Babinski征属于：", "o": [{"l": "A", "x": "生理反射"}, {"l": "B", "x": "病理反射"}, {"l": "C", "x": "浅反射"}, {"l": "D", "x": "深反射"}, {"l": "E", "x": "自主神经反射"}], "c": ["B"], "ex": "Babinski征是最重要的病理反射，提示锥体束损害。正常成人足底刺激引起足趾跖屈；锥体束损害时拇趾背伸、其余四趾扇形散开。", "sr": "教材P53", "bl": "记忆"},
{"t": "q", "n": 18, "tp": "X", "s": "颈膨大（C5-T2）横贯性损害的特点包括：", "o": [{"l": "A", "x": "上肢下运动神经元性瘫痪"}, {"l": "B", "x": "下肢上运动神经元性瘫痪"}, {"l": "C", "x": "病变平面以下全部感觉丧失"}, {"l": "D", "x": "Horner综合征"}, {"l": "E", "x": "仅上肢感觉障碍"}], "c": ["A", "B", "C", "D"], "ex": "颈膨大横贯性损害：上肢下运动神经元瘫（前角细胞受损）+下肢上运动神经元瘫（皮质脊髓束受损）+病变平面以下全部感觉障碍+Horner综合征（C8-T1侧角）。", "sr": "教材P30", "bl": "理解"},
{"t": "q", "n": 19, "tp": "X", "s": "脑干损害的共同特点包括：", "o": [{"l": "A", "x": "交叉性瘫痪"}, {"l": "B", "x": "交叉性感觉障碍"}, {"l": "C", "x": "同侧偏盲"}, {"l": "D", "x": "脑神经损害症状"}, {"l": "E", "x": "共济失调"}], "c": ["A", "B", "D", "E"], "ex": "脑干损害：交叉性瘫痪+交叉性感觉障碍+脑神经损害+共济失调。同侧偏盲是内囊/视束病变表现。", "sr": "教材P46-48", "bl": "理解"},
{"t": "q", "n": 20, "tp": "A2", "s": "患者男，45岁，右上肢远端肌肉萎缩无力，呈爪形手畸形，小鱼际肌和大鱼际肌萎缩明显，感觉障碍限于前臂尺侧和手部尺侧。最可能损伤的是：", "o": [{"l": "A", "x": "正中神经"}, {"l": "B", "x": "桡神经"}, {"l": "C", "x": "尺神经"}, {"l": "D", "x": "臂丛上干"}, {"l": "E", "x": "C8-T1神经根"}], "c": ["C"], "ex": "尺神经损伤→爪形手+小鱼际肌萎缩+手部尺侧感觉障碍。正中神经→猿手+大鱼际肌萎缩。桡神经→垂腕。", "sr": "教材P60", "bl": "应用"},
{"t": "q", "n": 21, "tp": "判断", "s": "胸髓横贯性损害可引起双上肢下运动神经元性瘫痪和双下肢上运动神经元性瘫痪。", "o": [{"l": "A", "x": "正确"}, {"l": "B", "x": "错误"}], "c": ["B"], "ex": "错误。胸髓不含支配上肢的节段（C5-T1），胸髓横贯性损害仅引起双下肢上运动神经元瘫（截瘫），上肢不受影响。颈膨大损害才同时影响上肢和下肢。", "sr": "教材P30", "bl": "理解"},
{"t": "q", "n": 22, "tp": "A1", "s": "以意识内容改变为主的意识障碍是：", "o": [{"l": "A", "x": "嗜睡"}, {"l": "B", "x": "昏睡"}, {"l": "C", "x": "昏迷"}, {"l": "D", "x": "谵妄"}, {"l": "E", "x": "去皮质状态"}], "c": ["D"], "ex": "谵妄以意识内容改变为主（意识模糊+精神运动兴奋+幻觉妄想），意识水平波动。嗜睡/昏睡/昏迷以意识水平下降为主。", "sr": "教材P70-72", "bl": "记忆"},
{"t": "q", "n": 23, "tp": "A1", "s": "以下哪项描述属于Wernicke失语的特点？", "o": [{"l": "A", "x": "口语表达费力，呈电报式语言"}, {"l": "B", "x": "仅书写障碍而口语正常"}, {"l": "C", "x": "复述困难但听理解正常"}, {"l": "D", "x": "找词困难但语法正确"}, {"l": "E", "x": "听理解严重障碍，口语流利但含大量错语"}], "c": ["E"], "ex": "Wernicke失语（感觉性失语）：听理解严重障碍，口语流利但含大量错语和新词，患者对自身错语无自知力。A为Broca失语特点。病变在颞上回后部。", "sr": "教材P76", "bl": "理解"},
{"t": "q", "n": 24, "tp": "A1", "s": "Broca失语的病变部位在：", "o": [{"l": "A", "x": "优势半球额下回后部"}, {"l": "B", "x": "优势半球颞上回后部"}, {"l": "C", "x": "优势半球角回"}, {"l": "D", "x": "优势半球缘上回"}, {"l": "E", "x": "优势半球额中回后部"}], "c": ["A"], "ex": "Broca失语（运动性失语）病变在优势半球额下回后部（Broca区）。Wernicke失语在颞上回后部。", "sr": "教材P75", "bl": "理解"},
{"t": "q", "n": 25, "tp": "A2", "s": "患者男，62岁，脑梗死后出现言语障碍：能听懂别人说话，但自己说话费力、不流利，呈电报式，找词困难。该患者的失语类型是：", "o": [{"l": "A", "x": "感觉性失语（Wernicke失语）"}, {"l": "B", "x": "运动性失语（Broca失语）"}, {"l": "C", "x": "命名性失语"}, {"l": "D", "x": "传导性失语"}, {"l": "E", "x": "经皮质性失语"}], "c": ["B"], "ex": "口语表达费力、不流利、电报式语言+听理解相对保留=典型Broca失语。Wernicke失语为流利性错语+听不懂。", "sr": "教材P75", "bl": "应用"},
{"t": "q", "n": 26, "tp": "A2", "s": "患者女，45岁，突发眩晕、恶心呕吐2小时。眩晕为视物旋转感，伴耳鸣及听力下降，无肢体瘫痪。既往有类似发作史。最可能的诊断是：", "o": [{"l": "A", "x": "前庭神经元炎"}, {"l": "B", "x": "椎基底动脉TIA"}, {"l": "C", "x": "梅尼埃病"}, {"l": "D", "x": "小脑出血"}, {"l": "E", "x": "偏头痛性眩晕"}], "c": ["C"], "ex": "反复发作性眩晕+耳鸣耳聋+无脑干/小脑体征→梅尼埃病。椎基底动脉TIA常伴脑干症状（复视/构音障碍/共济失调）。", "sr": "教材P80-82", "bl": "应用"},
{"t": "q", "n": 27, "tp": "B1", "s": "(1) 闭眼时症状明显加重，Romberg征阳性", "o": [{"l": "A", "x": "小脑性共济失调"}, {"l": "B", "x": "感觉性共济失调"}, {"l": "C", "x": "前庭性共济失调"}, {"l": "D", "x": "额叶性共济失调"}, {"l": "E", "x": "癔症性共济失调"}], "c": ["D"], "ex": "(1)感觉性共济失调：深感觉障碍→视觉代偿，闭眼时加重，Romberg征阳性。(2)前庭性共济失调：眩晕+眼震+平衡障碍。", "sr": "教材P85-87", "bl": "理解"},
{"t": "q", "n": 28, "tp": "B1", "s": "(2) 睁眼和闭眼时症状相似，伴眼球震颤", "o": [{"l": "A", "x": "小脑性共济失调"}, {"l": "B", "x": "感觉性共济失调"}, {"l": "C", "x": "前庭性共济失调"}, {"l": "D", "x": "额叶性共济失调"}, {"l": "E", "x": "癔症性共济失调"}], "c": ["E"], "ex": "(1)感觉性共济失调：深感觉障碍→视觉代偿，闭眼时加重，Romberg征阳性。(2)前庭性共济失调：眩晕+眼震+平衡障碍。", "sr": "教材P85-87", "bl": "理解"},
{"t": "q", "n": 29, "tp": "X", "s": "以下哪些属于小脑性共济失调的临床表现？", "o": [{"l": "A", "x": "指鼻试验不准"}, {"l": "B", "x": "跟膝胫试验阳性"}, {"l": "C", "x": "Romberg征阳性"}, {"l": "D", "x": "意向性震颤"}, {"l": "E", "x": "吟诗样语言"}], "c": ["A", "B", "D", "E"], "ex": "小脑性共济失调：指鼻试验/跟膝胫试验阳性、意向性震颤、吟诗样语言。Romberg征阳性是感觉性共济失调的特征（闭眼视觉代偿丧失）。", "sr": "教材P85-86", "bl": "理解"},
{"t": "q", "n": 30, "tp": "A1", "s": "以下哪种步态常见于腓总神经麻痹？", "o": [{"l": "A", "x": "跨阈步态"}, {"l": "B", "x": "慌张步态"}, {"l": "C", "x": "剪刀步态"}, {"l": "D", "x": "鸭步步态"}, {"l": "E", "x": "偏瘫步态"}], "c": ["A"], "ex": "跨阈步态（足下垂步态）：腓总神经麻痹→胫前肌瘫痪→足下垂，行走时抬腿过高。慌张步态=帕金森病，剪刀步态=痉挛性截瘫，鸭步=肌营养不良。", "sr": "教材P90", "bl": "记忆"},
{"t": "q", "n": 31, "tp": "A2", "s": "患者男，30岁，感冒后3天出现行走不稳。查体：指鼻试验和跟膝胫试验欠准，意向性震颤，轮替运动笨拙，睁眼闭眼时症状无明显差异。最可能的病变部位是：", "o": [{"l": "A", "x": "脊髓后索"}, {"l": "B", "x": "小脑及其联系纤维"}, {"l": "C", "x": "前庭系统"}, {"l": "D", "x": "大脑皮质"}, {"l": "E", "x": "周围神经"}], "c": ["B"], "ex": "指鼻试验不准+意向性震颤+轮替笨拙+睁闭眼无明显差异=典型小脑性共济失调。感冒后急性起病提示急性小脑炎。", "sr": "教材P85", "bl": "应用"},
{"t": "q", "n": 32, "tp": "判断", "s": "运动性失语患者能理解别人言语但表达困难，病变位于优势半球Wernicke区。", "o": [{"l": "A", "x": "正确"}, {"l": "B", "x": "错误"}], "c": ["B"], "ex": "错误。运动性失语（Broca失语）病变在优势半球额下回后部（Broca区），而非Wernicke区。Wernicke区病变引起感觉性失语。", "sr": "教材P75-76", "bl": "理解"},
{"t": "q", "n": 33, "tp": "A1", "s": "神经系统疾病病史采集中，最核心的部分是：", "o": [{"l": "A", "x": "既往史"}, {"l": "B", "x": "个人史"}, {"l": "C", "x": "现病史"}, {"l": "D", "x": "家族史"}, {"l": "E", "x": "系统回顾"}], "c": ["C"], "ex": "现病史是病史采集的核心，应详细询问起病方式、症状演变过程、伴随症状等。神经系统疾病的时间演变模式对定性诊断至关重要。", "sr": "教材P95", "bl": "记忆"},
{"t": "q", "n": 34, "tp": "A1", "s": "脑膜刺激征不包括以下哪项？", "o": [{"l": "A", "x": "颈强直"}, {"l": "B", "x": "Kernig征"}, {"l": "C", "x": "Brudzinski征"}, {"l": "D", "x": "Lasegue征"}, {"l": "E", "x": "以上都不包括"}], "c": ["D"], "ex": "脑膜刺激征包括：颈强直、Kernig征、Brudzinski征。Lasegue征（直腿抬高试验）是坐骨神经痛的检查方法，非脑膜刺激征。", "sr": "教材P105", "bl": "记忆"},
{"t": "q", "n": 35, "tp": "A2", "s": "患者男，30岁，突发剧烈头痛伴呕吐。查体：颈强直(+)，Kernig征(+)，Brudzinski征(+)。上述体征提示：", "o": [{"l": "A", "x": "脑实质病变"}, {"l": "B", "x": "周围神经病变"}, {"l": "C", "x": "小脑病变"}, {"l": "D", "x": "脊髓病变"}, {"l": "E", "x": "脑膜受累"}], "c": ["E"], "ex": "颈强直+Kernig征+Brudzinski征阳性=脑膜刺激征三联征，提示脑膜受累，最常见于蛛网膜下腔出血和脑膜炎。", "sr": "教材P105", "bl": "应用"},
{"t": "q", "n": 36, "tp": "A2", "s": "检查患者肌力时，嘱患者抬离床面但不能对抗检查者施加的阻力，该肌力等级为：", "o": [{"l": "A", "x": "3级"}, {"l": "B", "x": "2级"}, {"l": "C", "x": "1级"}, {"l": "D", "x": "4级"}, {"l": "E", "x": "5级"}], "c": ["A"], "ex": "肌力6级分级：0级=无肌肉收缩；1级=有肌肉收缩但无关节活动；2级=可水平移动但不能抬离床面；3级=可抬离床面但不能对抗阻力；4级=可对抗部分阻力；5级=正常。", "sr": "教材P100", "bl": "应用"},
{"t": "c", "n": 37, "cs": "患者女，25岁，进行性双下肢无力2周。查体：双下肢肌力2级，肌张力减低，膝腱反射和跟腱反射消失，Babinski征(-)，T8平面以下痛觉减退。"},
{"t": "q", "n": 37, "tp": "A3", "s": "(1) 该患者肌张力减低和腱反射消失提示病变累及：", "o": [{"l": "A", "x": "上运动神经元"}, {"l": "B", "x": "下运动神经元"}, {"l": "C", "x": "小脑"}, {"l": "D", "x": "基底节"}, {"l": "E", "x": "皮质"}], "c": ["B"], "ex": "(1)肌张力减低+腱反射消失→下运动神经元损害；(2)感觉障碍平面（T8）对于脊髓病变的定位诊断具有关键意义。", "sr": "教材P100-102", "bl": "应用"},
{"t": "q", "n": 38, "tp": "A3", "s": "(2) 感觉障碍平面的确定有助于：", "o": [{"l": "A", "x": "定性诊断"}, {"l": "B", "x": "定位诊断"}, {"l": "C", "x": "鉴别诊断"}, {"l": "D", "x": "病因诊断"}, {"l": "E", "x": "预后判断"}], "c": ["B"], "ex": "(1)肌张力减低+腱反射消失→下运动神经元损害；(2)感觉障碍平面（T8）对于脊髓病变的定位诊断具有关键意义。", "sr": "教材P100-102", "bl": "应用"},
{"t": "q", "n": 39, "tp": "A1", "s": "腰椎穿刺的绝对禁忌症是：", "o": [{"l": "A", "x": "发热"}, {"l": "B", "x": "凝血功能轻度异常"}, {"l": "C", "x": "颅内压增高合并后颅窝占位"}, {"l": "D", "x": "背部皮肤感染"}, {"l": "E", "x": "腰椎骨折"}], "c": ["C"], "ex": "颅内压增高（尤其是后颅窝占位性病变）是腰椎穿刺的绝对禁忌症，因为腰穿放液后可能诱发脑疝。穿刺部位感染也是禁忌。", "sr": "教材P115", "bl": "记忆"},
{"t": "q", "n": 40, "tp": "A1", "s": "关于脑脊液的产生与吸收，以下说法正确的是：", "o": [{"l": "A", "x": "脑脊液主要由蛛网膜颗粒产生"}, {"l": "B", "x": "脑脊液经室间孔吸收"}, {"l": "C", "x": "脑脊液每日产生量约50ml"}, {"l": "D", "x": "脑脊液主要由脉络丛产生"}, {"l": "E", "x": "脑脊液总量约500ml"}], "c": ["D"], "ex": "脑脊液主要由侧脑室脉络丛产生（约500ml/日），经侧脑室→室间孔→第三脑室→中脑导水管→第四脑室→蛛网膜下腔，最终经蛛网膜颗粒吸收入静脉窦。成人脑脊液总量约130-150ml。", "sr": "教材P113", "bl": "理解"},
{"t": "q", "n": 41, "tp": "A2", "s": "患者男，28岁，四肢对称性无力进行性加重1周。腰穿示：脑脊液压力正常，白细胞5×10^6/L，蛋白质1.5g/L，糖和氯化物正常。最可能的诊断是：", "o": [{"l": "A", "x": "急性脊髓炎"}, {"l": "B", "x": "周期性瘫痪"}, {"l": "C", "x": "多发性硬化"}, {"l": "D", "x": "重症肌无力"}, {"l": "E", "x": "吉兰-巴雷综合征"}], "c": ["E"], "ex": "脑脊液蛋白-细胞分离（蛋白显著升高而细胞数正常）是吉兰-巴雷综合征的特征性脑脊液改变，尤以发病第2-3周最明显。", "sr": "教材P118", "bl": "应用"},
{"t": "q", "n": 42, "tp": "A1", "s": "磁共振弥散加权成像（DWI）在急性脑梗死中的临床价值是：", "o": [{"l": "A", "x": "可在发病数分钟内显示缺血灶"}, {"l": "B", "x": "主要用于脑出血的诊断"}, {"l": "C", "x": "对后颅窝病变不敏感"}, {"l": "D", "x": "需要注射造影剂"}, {"l": "E", "x": "仅在发病24小时后有诊断价值"}], "c": ["A"], "ex": "DWI可在缺血发生后数分钟至数小时内显示细胞毒性水肿导致的水分子弥散受限（高信号），是诊断超急性期脑梗死最敏感的影像学方法。CT通常在发病24小时后才显示低密度灶。", "sr": "教材P120", "bl": "理解"},
{"t": "q", "n": 43, "tp": "X", "s": "腰椎穿刺的适应症包括：", "o": [{"l": "A", "x": "中枢神经系统感染的诊断"}, {"l": "B", "x": "蛛网膜下腔出血的诊断（CT阴性时）"}, {"l": "C", "x": "吉兰-巴雷综合征的诊断"}, {"l": "D", "x": "颅内压增高原因不明"}, {"l": "E", "x": "鞘内注射药物"}], "c": ["A", "B", "C", "E"], "ex": "腰椎穿刺适应症：CNS感染诊断、SAH诊断（CT阴性时）、GBS等炎性脱髓鞘病诊断、鞘内给药等。颅内压增高原因不明时应慎行腰穿，需先做影像学排除后颅窝占位。", "sr": "教材P115-116", "bl": "理解"},
{"t": "q", "n": 44, "tp": "判断", "s": "腰椎穿刺后患者需去枕平卧4-6小时，主要目的是预防脑疝形成。", "o": [{"l": "A", "x": "正确"}, {"l": "B", "x": "错误"}], "c": ["B"], "ex": "错误。腰穿后去枕平卧4-6小时的目的是减少低颅压性头痛的发生（因穿刺孔持续漏脑脊液所致），而非预防脑疝。脑疝的预防应在穿刺前通过影像学评估颅内压和占位情况来实现。", "sr": "教材P115-116", "bl": "理解"},
{"t": "q", "n": 45, "tp": "A1", "s": "短暂性脑缺血发作（TIA）的症状通常在多长时间内完全恢复？", "o": [{"l": "A", "x": "1小时内"}, {"l": "B", "x": "24小时内"}, {"l": "C", "x": "6小时内"}, {"l": "D", "x": "48小时内"}, {"l": "E", "x": "72小时内"}], "c": ["B"], "ex": "TIA传统定义为神经功能缺损症状在24小时内完全恢复，且影像学上无责任梗死病灶。目前组织学定义强调无梗死证据的短暂缺血事件，但考试仍以24小时为经典标准。", "sr": "教材P130", "bl": "记忆"},
{"t": "q", "n": 46, "tp": "A1", "s": "脑血栓形成最常见的病因是：", "o": [{"l": "A", "x": "心源性栓塞"}, {"l": "B", "x": "高血压小动脉玻璃样变"}, {"l": "C", "x": "脑动脉粥样硬化"}, {"l": "D", "x": "脑血管畸形"}, {"l": "E", "x": "血液高凝状态"}], "c": ["C"], "ex": "脑血栓形成最常见的病因是脑动脉粥样硬化，导致血管狭窄和闭塞。心源性栓塞是脑栓塞最常见病因。高血压小动脉玻璃样变是腔隙性脑梗死最常见病因。", "sr": "教材P132", "bl": "理解"},
{"t": "q", "n": 47, "tp": "A1", "s": "脑栓塞最常见的栓子来源是：", "o": [{"l": "A", "x": "动脉粥样硬化斑块脱落"}, {"l": "B", "x": "空气栓子"}, {"l": "C", "x": "脂肪栓子"}, {"l": "D", "x": "心源性栓子（尤其是心房颤动）"}, {"l": "E", "x": "肿瘤栓子"}], "c": ["D"], "ex": "脑栓塞最常见的栓子来源是心源性，其中心房颤动是最重要的病因（占50%以上）。心源性栓子脱落后随血流进入脑动脉导致栓塞，起病最急（数秒至数分钟达高峰）。", "sr": "教材P135", "bl": "记忆"},
{"t": "q", "n": 48, "tp": "A1", "s": "大脑中动脉主干闭塞的特征性临床表现不包括：", "o": [{"l": "A", "x": "对侧偏瘫（上肢重于下肢）"}, {"l": "B", "x": "对侧偏身感觉障碍"}, {"l": "C", "x": "对侧同向性偏盲"}, {"l": "D", "x": "优势半球受累可出现失语"}, {"l": "E", "x": "双眼向病灶对侧凝视"}], "c": ["E"], "ex": "大脑中动脉主干闭塞→三偏征（对侧偏瘫+对侧偏身感觉障碍+对侧同向偏盲）+优势半球受累失语+Gerstmann综合征。双眼向病灶侧凝视（非对侧），因为额叶侧视中枢受损。", "sr": "教材P133-134", "bl": "记忆"},
{"t": "q", "n": 49, "tp": "A1", "s": "延髓背外侧综合征（Wallenberg综合征）最常见的病因是：", "o": [{"l": "A", "x": "椎动脉或小脑后下动脉闭塞"}, {"l": "B", "x": "大脑中动脉闭塞"}, {"l": "C", "x": "颈内动脉闭塞"}, {"l": "D", "x": "基底动脉尖闭塞"}, {"l": "E", "x": "大脑前动脉闭塞"}], "c": ["A"], "ex": "Wallenberg综合征由椎动脉或小脑后下动脉（PICA）闭塞引起，累及延髓背外侧结构。临床特征：眩晕/恶心/呕吐+同侧面部痛温觉丧失+对侧躯体痛温觉丧失+同侧Horner征+吞咽困难/构音障碍。", "sr": "教材P140", "bl": "理解"},
{"t": "q", "n": 50, "tp": "A2", "s": "患者男，68岁，高血压病史10年。晨起时发现右侧肢体完全无力，伴言语不清。查体：BP 180/100mmHg，神清，运动性失语，右侧中枢性面瘫，右侧上下肢肌力0级，右侧Babinski征(+)，右侧偏身痛觉减退，双眼向左侧凝视。最可能的诊断是：", "o": [{"l": "A", "x": "脑出血"}, {"l": "B", "x": "大脑中动脉主干闭塞"}, {"l": "C", "x": "脑干出血"}, {"l": "D", "x": "蛛网膜下腔出血"}, {"l": "E", "x": "短暂性脑缺血发作"}], "c": ["B"], "ex": "安静状态（晨起）起病+三偏征+失语+双眼向病灶侧凝视=典型的左侧大脑中动脉主干闭塞（大动脉粥样硬化型脑梗死）。脑出血通常活动中起病，伴头痛呕吐。", "sr": "教材P133-134", "bl": "应用"},
{"t": "q", "n": 51, "tp": "A1", "s": "脑出血最常见的部位是：", "o": [{"l": "A", "x": "脑叶"}, {"l": "B", "x": "脑干"}, {"l": "C", "x": "基底节区（壳核）"}, {"l": "D", "x": "小脑"}, {"l": "E", "x": "脑室"}], "c": ["C"], "ex": "脑出血最常见的部位是基底节区（尤其壳核），约占60-70%，由豆纹动脉（大脑中动脉的深穿支，直角发出，承受压力大）破裂引起。", "sr": "教材P142", "bl": "记忆"},
{"t": "q", "n": 52, "tp": "A1", "s": "高血压性脑出血最常见的责任血管是：", "o": [{"l": "A", "x": "大脑中动脉主干"}, {"l": "B", "x": "基底动脉"}, {"l": "C", "x": "大脑前动脉"}, {"l": "D", "x": "豆纹动脉"}, {"l": "E", "x": "小脑后下动脉"}], "c": ["D"], "ex": "豆纹动脉从大脑中动脉呈直角发出，承受较大血流冲击压力，长期高血压使其易发生微动脉瘤（Charcot-Bouchard动脉瘤）并破裂出血，是基底节区出血最常见的原因。", "sr": "教材P142", "bl": "理解"},
{"t": "q", "n": 53, "tp": "A2", "s": "患者男，55岁，活动中突发剧烈头痛、呕吐，继而意识不清。查体：BP 200/110mmHg，深昏迷，右侧瞳孔散大，左侧肢体瘫痪。头颅CT示右侧基底节区高密度影，量约80ml，中线结构左移。目前最紧急的处理是：", "o": [{"l": "A", "x": "立即静脉溶栓"}, {"l": "B", "x": "腰椎穿刺放脑脊液"}, {"l": "C", "x": "抗血小板治疗"}, {"l": "D", "x": "抗凝治疗"}, {"l": "E", "x": "脱水降颅压+控制血压+准备手术"}], "c": ["E"], "ex": "大量脑出血（>30ml基底节区）+脑疝征象（瞳孔散大、中线移位）=紧急脱水降颅压（甘露醇）+控制血压+手术清除血肿。溶栓/抗血小板/抗凝均为禁忌。腰穿可诱发脑疝。", "sr": "教材P144-145", "bl": "应用"},
{"t": "q", "n": 54, "tp": "A2", "s": "患者女，45岁，活动中突发剧烈头痛，呈\"爆裂样\"，伴恶心呕吐。查体：颈强直(+)，Kernig征(+)，无肢体瘫痪。头颅CT示鞍上池、环池高密度影。最可能的诊断是：", "o": [{"l": "A", "x": "蛛网膜下腔出血"}, {"l": "B", "x": "脑出血"}, {"l": "C", "x": "脑梗死"}, {"l": "D", "x": "偏头痛"}, {"l": "E", "x": "紧张性头痛"}], "c": ["A"], "ex": "活动中突发爆裂样头痛+脑膜刺激征阳性+CT示蛛网膜下腔（鞍上池、环池）高密度影=典型蛛网膜下腔出血（SAH）。最常见病因为颅内动脉瘤破裂。无偏瘫可帮助与脑出血鉴别。", "sr": "教材P148", "bl": "应用"},
{"t": "q", "n": 55, "tp": "A1", "s": "蛛网膜下腔出血最常见的病因是：", "o": [{"l": "A", "x": "高血压动脉硬化"}, {"l": "B", "x": "颅内动脉瘤破裂"}, {"l": "C", "x": "脑血管畸形"}, {"l": "D", "x": "血液病"}, {"l": "E", "x": "烟雾病"}], "c": ["B"], "ex": "颅内动脉瘤破裂是SAH最常见的病因，约占75-80%。脑血管畸形多见于青少年，烟雾病多见于儿童和青年。", "sr": "教材P147", "bl": "记忆"},
{"t": "q", "n": 56, "tp": "A1", "s": "急性缺血性脑卒中静脉溶栓（rt-PA）的标准时间窗是：", "o": [{"l": "A", "x": "发病后3小时内"}, {"l": "B", "x": "发病后6小时内"}, {"l": "C", "x": "发病后4.5小时内"}, {"l": "D", "x": "发病后12小时内"}, {"l": "E", "x": "发病后24小时内"}], "c": ["C"], "ex": "rt-PA（阿替普酶）静脉溶栓的标准时间窗为发病后4.5小时内，大量临床研究证实此时间窗内获益远高于出血风险。尿激酶溶栓时间窗为6小时内。", "sr": "教材P136", "bl": "理解"},
{"t": "q", "n": 57, "tp": "A1", "s": "脑梗死与脑出血的鉴别中，支持脑出血的诊断依据是：", "o": [{"l": "A", "x": "安静状态下起病"}, {"l": "B", "x": "起病时血压正常"}, {"l": "C", "x": "症状逐渐进展加重"}, {"l": "D", "x": "活动中起病，伴头痛呕吐和意识障碍"}, {"l": "E", "x": "CT示低密度灶"}], "c": ["D"], "ex": "脑出血通常在活动中或情绪激动时起病，数分钟至数小时达高峰，常伴剧烈头痛、呕吐和意识障碍。脑梗死多在安静/睡眠中起病，意识障碍较轻。CT高密度=出血，低密度=梗死。", "sr": "教材P143-144", "bl": "理解"},
{"t": "c", "n": 58, "cs": "患者男，72岁，高血压糖尿病史，晨起发现左侧肢体无力2小时。查体：BP 160/90mmHg，神清，左侧中枢性面舌瘫，左侧肢体肌力2级，左侧Babinski征(+)。头颅CT未见异常。"},
{"t": "q", "n": 58, "tp": "A3", "s": "(1) 首先应考虑的诊断是：", "o": [{"l": "A", "x": "脑出血"}, {"l": "B", "x": "脑肿瘤"}, {"l": "C", "x": "TIA"}, {"l": "D", "x": "脑栓塞"}, {"l": "E", "x": "急性脑梗死"}], "c": ["E"], "ex": "(1)晨起安静发病+局灶神经体征+CT未见出血→急性脑梗死；(2)MRI-DWI可在超早期（数分钟至数小时）显示缺血灶；(3)发病4.5小时内且无禁忌症→rt-PA静脉溶栓是标准治疗。", "sr": "教材P132-137", "bl": "应用"},
{"t": "q", "n": 59, "tp": "A3", "s": "(2) 下一步最重要的检查是：", "o": [{"l": "A", "x": "CTA"}, {"l": "B", "x": "增强MRI"}, {"l": "C", "x": "颈动脉超声"}, {"l": "D", "x": "心脏超声"}, {"l": "E", "x": "MRI-DWI"}], "c": ["E"], "ex": "(1)晨起安静发病+局灶神经体征+CT未见出血→急性脑梗死；(2)MRI-DWI可在超早期（数分钟至数小时）显示缺血灶；(3)发病4.5小时内且无禁忌症→rt-PA静脉溶栓是标准治疗。", "sr": "教材P132-137", "bl": "应用"},
{"t": "q", "n": 60, "tp": "A3", "s": "(3) 如果发病3小时且无禁忌症，首选治疗是：", "o": [{"l": "A", "x": "手术"}, {"l": "B", "x": "手术"}, {"l": "C", "x": "抗血小板"}, {"l": "D", "x": "抗凝"}, {"l": "E", "x": "rt-PA静脉溶栓"}], "c": ["E"], "ex": "(1)晨起安静发病+局灶神经体征+CT未见出血→急性脑梗死；(2)MRI-DWI可在超早期（数分钟至数小时）显示缺血灶；(3)发病4.5小时内且无禁忌症→rt-PA静脉溶栓是标准治疗。", "sr": "教材P132-137", "bl": "应用"},
{"t": "q", "n": 61, "tp": "A2", "s": "患者男，60岁，房颤病史5年，未服用抗凝药。突发右侧肢体完全瘫痪伴意识障碍30分钟来院。查体：嗜睡，完全性失语，右侧偏瘫，右侧Babinski征(+)，双眼向左侧凝视。头颅CT未见异常。最可能的诊断是：", "o": [{"l": "A", "x": "脑栓塞（心源性）"}, {"l": "B", "x": "脑血栓形成"}, {"l": "C", "x": "腔隙性脑梗死"}, {"l": "D", "x": "分水岭脑梗死"}, {"l": "E", "x": "脑出血"}], "c": ["A"], "ex": "房颤病史+活动中突发起病（数秒至数分钟达高峰）+意识障碍+CT早期未见异常=典型心源性脑栓塞。脑血栓形成多于安静时起病且进展较慢（数小时至数日）。", "sr": "教材P135", "bl": "应用"},
{"t": "q", "n": 62, "tp": "X", "s": "脑血管疾病的可干预危险因素包括：", "o": [{"l": "A", "x": "高血压"}, {"l": "B", "x": "糖尿病"}, {"l": "C", "x": "心房颤动"}, {"l": "D", "x": "年龄"}, {"l": "E", "x": "高脂血症"}], "c": ["A", "B", "C", "E"], "ex": "脑血管疾病可干预危险因素：高血压（最重要的危险因素）、糖尿病、心房颤动、高脂血症、吸烟、肥胖、缺乏运动等。年龄和性别是不可干预的危险因素。", "sr": "教材P130-131", "bl": "理解"},
{"t": "q", "n": 63, "tp": "B1", "s": "(1) 起病最急，数秒至数分钟达高峰", "o": [{"l": "A", "x": "脑栓塞"}, {"l": "B", "x": "脑血栓形成"}, {"l": "C", "x": "脑出血"}, {"l": "D", "x": "蛛网膜下腔出血"}, {"l": "E", "x": "TIA"}], "c": ["B"], "ex": "(1)脑栓塞：起病最急骤（数秒至数分钟达高峰），栓子突然堵塞血管。(2)脑血栓形成：起病较缓慢（数小时至数日渐进展），血栓逐渐增大堵塞血管。", "sr": "教材P132-135", "bl": "理解"},
{"t": "q", "n": 64, "tp": "B1", "s": "(2) 起病较慢，数小时至数日逐渐进展", "o": [{"l": "A", "x": "脑栓塞"}, {"l": "B", "x": "脑血栓形成"}, {"l": "C", "x": "脑出血"}, {"l": "D", "x": "蛛网膜下腔出血"}, {"l": "E", "x": "TIA"}], "c": ["C"], "ex": "(1)脑栓塞：起病最急骤（数秒至数分钟达高峰），栓子突然堵塞血管。(2)脑血栓形成：起病较缓慢（数小时至数日渐进展），血栓逐渐增大堵塞血管。", "sr": "教材P132-135", "bl": "理解"},
{"t": "q", "n": 65, "tp": "A1", "s": "腔隙性脑梗死最常见的病因是：", "o": [{"l": "A", "x": "大动脉粥样硬化"}, {"l": "B", "x": "心源性栓塞"}, {"l": "C", "x": "动脉夹层"}, {"l": "D", "x": "高血压性小动脉玻璃样变"}, {"l": "E", "x": "血管炎"}], "c": ["D"], "ex": "腔隙性脑梗死由大脑半球深部或脑干的穿支小动脉闭塞引起，最常见病因为高血压导致的小动脉玻璃样变和纤维素样坏死。梗死灶直径<15mm。", "sr": "教材P138", "bl": "理解"},
{"t": "q", "n": 66, "tp": "A2", "s": "患者女，58岁，突发眩晕、恶心呕吐、行走不稳3小时。查体：右侧面部痛温觉减退，左侧躯干肢体痛温觉减退，右侧Horner征，右侧指鼻试验欠准，声音嘶哑。最可能的诊断是：", "o": [{"l": "A", "x": "小脑出血"}, {"l": "B", "x": "前庭神经元炎"}, {"l": "C", "x": "脑桥出血"}, {"l": "D", "x": "梅尼埃病"}, {"l": "E", "x": "延髓背外侧综合征（Wallenberg）"}], "c": ["E"], "ex": "交叉性感觉障碍+Horner征+共济失调+后组脑神经麻痹=典型Wallenberg综合征（延髓背外侧综合征），由椎动脉或小脑后下动脉闭塞引起。", "sr": "教材P140", "bl": "应用"},
{"t": "q", "n": 67, "tp": "判断", "s": "分水岭脑梗死多发生于脑内两条大动脉供血区之间的边缘带，常见诱因包括休克、严重脱水等全身性低血压。", "o": [{"l": "A", "x": "正确"}, {"l": "B", "x": "错误"}], "c": ["A"], "ex": "正确。分水岭（边缘带）脑梗死发生于两条大动脉供血交界区，常在已有脑动脉狭窄基础上，因全身性低血压（如休克、严重脱水、心脏手术中血压骤降）诱发。", "sr": "教材P139", "bl": "理解"},
{"t": "q", "n": 68, "tp": "A1", "s": "帕金森病最核心的病理改变是：", "o": [{"l": "A", "x": "黑质多巴胺能神经元变性缺失，路易小体形成"}, {"l": "B", "x": "纹状体乙酰胆碱神经元增生"}, {"l": "C", "x": "苍白球钙化"}, {"l": "D", "x": "小脑齿状核变性"}, {"l": "E", "x": "丘脑底核铁沉积"}], "c": ["A"], "ex": "帕金森病核心病理：黑质致密部多巴胺能神经元进行性变性缺失+残存神经元内出现路易小体（Lewy body，主要成分为α-突触核蛋白）。多巴胺减少导致基底节直接/间接通路失衡。", "sr": "教材P150", "bl": "记忆"},
{"t": "q", "n": 69, "tp": "A1", "s": "以下哪项不是帕金森病的四大运动主征？", "o": [{"l": "A", "x": "静止性震颤"}, {"l": "B", "x": "感觉障碍"}, {"l": "C", "x": "运动迟缓"}, {"l": "D", "x": "肌强直"}, {"l": "E", "x": "姿势步态异常"}], "c": ["B"], "ex": "帕金森病四大运动主征：静止性震颤（搓丸样）、肌强直（铅管样/齿轮样）、运动迟缓（面具脸/小写征）、姿势步态异常（慌张步态）。感觉障碍属于非运动症状。", "sr": "教材P152", "bl": "理解"},
{"t": "q", "n": 70, "tp": "A2", "s": "患者男，65岁，进行性动作缓慢、肢体僵硬3年。查体：面具脸，双上肢静止性震颤（搓丸样），肌张力呈齿轮样增高，行走呈慌张步态。最可能的诊断是：", "o": [{"l": "A", "x": "肝豆状核变性"}, {"l": "B", "x": "特发性震颤"}, {"l": "C", "x": "帕金森病"}, {"l": "D", "x": "多系统萎缩"}, {"l": "E", "x": "进行性核上性麻痹"}], "c": ["C"], "ex": "静止性震颤+肌强直（齿轮样）+运动迟缓（面具脸）+慌张步态=典型帕金森病四主征。特发性震颤为姿势性/动作性震颤，无肌强直和运动迟缓。肝豆状核变性多见于青少年。", "sr": "教材P152-153", "bl": "应用"},
{"t": "q", "n": 71, "tp": "A1", "s": "关于帕金森病的早期治疗，以下说法正确的是：", "o": [{"l": "A", "x": "确诊后应立即使用左旋多巴"}, {"l": "B", "x": "年轻患者首选左旋多巴"}, {"l": "C", "x": "所有患者都应首选多巴胺受体激动剂"}, {"l": "D", "x": "老年患者可首选复方左旋多巴"}, {"l": "E", "x": "药物治疗应在出现功能障碍后开始"}], "c": ["D"], "ex": "帕金森病早期治疗原则：年轻患者（<65岁）可首选多巴胺受体激动剂或MAO-B抑制剂以延迟左旋多巴使用；老年患者（>=65岁）或认知功能减退者可首选复方左旋多巴。治疗应在功能障碍影响生活时开始。", "sr": "教材P155", "bl": "理解"},
{"t": "q", "n": 72, "tp": "A1", "s": "左旋多巴治疗帕金森病的作用机制是：", "o": [{"l": "A", "x": "直接激动多巴胺受体"}, {"l": "B", "x": "阻滞钙通道"}, {"l": "C", "x": "抑制多巴胺降解酶"}, {"l": "D", "x": "抑制乙酰胆碱释放"}, {"l": "E", "x": "补充脑内多巴胺前体"}], "c": ["E"], "ex": "左旋多巴是多巴胺的前体物质，可通过血脑屏障进入脑内，在黑质残存神经元内转化为多巴胺，补充脑内多巴胺的不足。与外周多巴脱羧酶抑制剂（卡比多巴/苄丝肼）合用可减少外周不良反应。", "sr": "教材P155", "bl": "记忆"},
{"t": "q", "n": 73, "tp": "X", "s": "帕金森病的非运动症状包括：", "o": [{"l": "A", "x": "嗅觉减退"}, {"l": "B", "x": "便秘"}, {"l": "C", "x": "快速眼动期睡眠行为障碍"}, {"l": "D", "x": "抑郁和焦虑"}, {"l": "E", "x": "体位性低血压"}], "c": ["A", "B", "C", "D", "E"], "ex": "帕金森病非运动症状可在运动症状出现前数年即已存在：嗅觉减退、便秘、RBD（REM睡眠行为障碍）、抑郁焦虑、认知障碍、自主神经功能障碍（体位性低血压、排尿障碍）等。", "sr": "教材P153-154", "bl": "理解"},
{"t": "q", "n": 74, "tp": "A2", "s": "患者女，72岁，帕金森病服用复方左旋多巴治疗3年，近半年出现\"剂末现象\"和\"开-关现象\"。以下处理最合理的是：", "o": [{"l": "A", "x": "加用COMT抑制剂（如恩他卡朋）或调整给药方案"}, {"l": "B", "x": "增加左旋多巴剂量和给药频率"}, {"l": "C", "x": "立即停用左旋多巴"}, {"l": "D", "x": "仅给予心理安慰"}, {"l": "E", "x": "改为手术治疗"}], "c": ["A"], "ex": "剂末现象和开-关现象是左旋多巴长期治疗的并发症（运动波动）。处理：调整给药方案（增加频次、控释剂型）+加用COMT抑制剂（延长左旋多巴半衰期）或加用多巴胺受体激动剂。不应立即停药。", "sr": "教材P156", "bl": "应用"},
{"t": "q", "n": 75, "tp": "判断", "s": "帕金森病的静止性震颤在随意运动时加重，睡眠时消失。", "o": [{"l": "A", "x": "正确"}, {"l": "B", "x": "错误"}], "c": ["B"], "ex": "错误。帕金森病的静止性震颤在安静状态下最明显，随意运动时减轻或消失，睡眠时完全消失。此为静止性震颤与小脑性意向性震颤（越接近目标越明显）的重要鉴别点。", "sr": "教材P152", "bl": "理解"},
{"t": "q", "n": 76, "tp": "A1", "s": "癫痫持续状态的传统定义是：", "o": [{"l": "A", "x": "单次癫痫发作持续超过5分钟"}, {"l": "B", "x": "单次癫痫发作持续超过30分钟，或连续多次发作且发作间期意识未恢复超过30分钟"}, {"l": "C", "x": "24小时内发作超过5次"}, {"l": "D", "x": "单次发作伴有意识障碍"}, {"l": "E", "x": "任何需要药物终止的发作"}], "c": ["B"], "ex": "癫痫持续状态传统定义：单次发作持续>30分钟，或连续多次发作且发作间期意识未恢复>30分钟。现代操作定义：发作持续>5分钟（全面性）或>10分钟（局灶性），需紧急处理。", "sr": "教材P170", "bl": "记忆"},
{"t": "q", "n": 77, "tp": "A1", "s": "癫痫持续状态的首选初始静脉用药是：", "o": [{"l": "A", "x": "苯妥英钠"}, {"l": "B", "x": "丙戊酸钠口服"}, {"l": "C", "x": "地西泮10-20mg静脉推注"}, {"l": "D", "x": "左乙拉西坦肌注"}, {"l": "E", "x": "苯巴比妥口服"}], "c": ["C"], "ex": "癫痫持续状态一线治疗：地西泮10-20mg缓慢静脉推注（速度<5mg/min），可在1-3分钟内起效。如发作未控制，可用苯妥英钠或丙戊酸钠静脉维持。", "sr": "教材P172", "bl": "记忆"},
{"t": "q", "n": 78, "tp": "A1", "s": "全面性强直-阵挛发作（大发作）的临床表现不包括：", "o": [{"l": "A", "x": "突发意识丧失"}, {"l": "B", "x": "强直期后出现阵挛期"}, {"l": "C", "x": "可伴有舌咬伤和尿失禁"}, {"l": "D", "x": "发作全程意识保持清醒"}, {"l": "E", "x": "发作后意识模糊或嗜睡"}], "c": ["D"], "ex": "全面性强直-阵挛发作（GTCS/Grand mal）以意识丧失为首发表现→强直期（全身骨骼肌持续收缩约10-20秒）→阵挛期（全身肌肉交替收缩与松弛）→发作后状态（意识模糊、嗜睡、头痛）。发作全程意识丧失。", "sr": "教材P165", "bl": "理解"},
{"t": "q", "n": 79, "tp": "A2", "s": "患者男，20岁，反复发作性意识丧失、四肢抽搐3年。每次发作持续约2分钟，发作后对过程无记忆。脑电图示双侧同步对称的棘慢复合波。最可能的癫痫发作类型是：", "o": [{"l": "A", "x": "单纯部分性发作"}, {"l": "B", "x": "复杂部分性发作"}, {"l": "C", "x": "肌阵挛发作"}, {"l": "D", "x": "失神发作"}, {"l": "E", "x": "全面性强直-阵挛发作"}], "c": ["E"], "ex": "突发意识丧失+四肢抽搐+发作后遗忘+EEG双侧同步棘慢波=典型全面性强直-阵挛发作（大发作）。失神发作表现为短暂意识中断（数秒），无抽搐。部分性发作意识可保留（单纯）或伴意识障碍（复杂）。", "sr": "教材P165", "bl": "应用"},
{"t": "q", "n": 80, "tp": "A2", "s": "患者男，25岁，反复发作性右侧口角、手指抽搐，持续1-2分钟，发作时意识清楚，可扩散至右侧上肢和下肢。最可能的诊断是：", "o": [{"l": "A", "x": "Jackson发作（部分运动性发作）"}, {"l": "B", "x": "全面性强直-阵挛发作"}, {"l": "C", "x": "失神发作"}, {"l": "D", "x": "复杂部分性发作"}, {"l": "E", "x": "假性发作"}], "c": ["A"], "ex": "一侧口角/手指→向邻近部位扩散（按大脑皮质运动区分布顺序扩展）+发作时意识清楚=典型Jackson发作（部分运动性发作沿皮质扩散）。病变在对侧中央前回。", "sr": "教材P163", "bl": "应用"},
{"t": "q", "n": 81, "tp": "A1", "s": "癫痫与晕厥的鉴别要点中，支持癫痫的是：", "o": [{"l": "A", "x": "发作前有头晕、黑矇等前驱症状"}, {"l": "B", "x": "发作时伴舌咬伤和尿失禁"}, {"l": "C", "x": "发作后很快恢复清醒"}, {"l": "D", "x": "多由体位改变诱发"}, {"l": "E", "x": "面色苍白、大汗"}], "c": ["B"], "ex": "眩晕鉴别：癫痫常伴舌咬伤、尿失禁、发作后意识模糊；晕厥常有头晕黑矇前驱症状、面色苍白出汗、体位改变诱发、发作后很快清醒。EEG可帮助鉴别。", "sr": "教材P167", "bl": "理解"},
{"t": "q", "n": 82, "tp": "A1", "s": "以下哪项是诊断癫痫最重要的辅助检查？", "o": [{"l": "A", "x": "头颅CT"}, {"l": "B", "x": "头颅MRI"}, {"l": "C", "x": "脑电图（EEG）"}, {"l": "D", "x": "腰椎穿刺"}, {"l": "E", "x": "经颅多普勒超声"}], "c": ["C"], "ex": "脑电图（EEG）是诊断癫痫最重要的辅助检查手段，发作期可见棘波、尖波、棘慢复合波等癫痫样放电。MRI用于寻找病因（结构性病变），CT对钙化和出血更敏感。", "sr": "教材P166", "bl": "记忆"},
{"t": "q", "n": 83, "tp": "A2", "s": "患者女，8岁，上课时频繁出现短暂愣神，持续约5-10秒，呼之不应，无抽搐，每日发作数十次，发作后继续原来活动。脑电图示双侧对称3Hz棘慢复合波。最可能的诊断是：", "o": [{"l": "A", "x": "全面性强直-阵挛发作"}, {"l": "B", "x": "Lennox-Gastaut综合征"}, {"l": "C", "x": "复杂部分性发作"}, {"l": "D", "x": "典型失神发作"}, {"l": "E", "x": "青少年肌阵挛癫痫"}], "c": ["D"], "ex": "儿童+频繁短暂意识中断（数秒）+无抽搐+EEG示对称3Hz棘慢波=典型失神发作（小发作）。好发于学龄期儿童，青春期后可自行缓解。", "sr": "教材P164", "bl": "应用"},
{"t": "q", "n": 84, "tp": "X", "s": "癫痫持续状态的可能并发症包括：", "o": [{"l": "A", "x": "缺氧性脑损害"}, {"l": "B", "x": "高热"}, {"l": "C", "x": "电解质紊乱"}, {"l": "D", "x": "骨折"}, {"l": "E", "x": "肺栓塞"}], "c": ["A", "B", "C", "D", "E"], "ex": "癫痫持续状态并发症：缺氧性脑损害、高热、代谢性酸中毒、电解质紊乱（低钾/高钾）、横纹肌溶解、骨折（剧烈抽搐致椎体压缩骨折等）、误吸/肺栓塞、心律失常等。", "sr": "教材P171-172", "bl": "理解"},
{"t": "q", "n": 85, "tp": "A1", "s": "影响癫痫发作的常见诱因不包括：", "o": [{"l": "A", "x": "睡眠剥夺"}, {"l": "B", "x": "闪光刺激"}, {"l": "C", "x": "情绪激动"}, {"l": "D", "x": "停用抗癫痫药物"}, {"l": "E", "x": "高蛋白饮食"}], "c": ["E"], "ex": "癫痫常见诱因：睡眠剥夺、闪光刺激（光敏性癫痫）、情绪激动、饮酒、发热、停药或漏服抗癫痫药、月经期（经期癫痫）等。高蛋白饮食一般不是诱因（某些患者生酮饮食反而有益）。", "sr": "教材P162", "bl": "理解"},
{"t": "q", "n": 86, "tp": "B1", "s": "(1) 发作时意识清楚，一侧肢体抽搐", "o": [{"l": "A", "x": "单纯部分性发作"}, {"l": "B", "x": "复杂部分性发作"}, {"l": "C", "x": "全面性强直-阵挛发作"}, {"l": "D", "x": "失神发作"}, {"l": "E", "x": "肌阵挛发作"}], "c": ["A"], "ex": "(1)单纯部分性发作：无意识障碍，局灶运动或感觉症状；(2)全面性强直-阵挛发作：意识丧失+四肢抽搐+口吐白沫+舌咬伤/尿失禁。", "sr": "教材P163-165", "bl": "理解"},
{"t": "q", "n": 87, "tp": "B1", "s": "(2) 发作时意识丧失，四肢抽搐，口吐白沫", "o": [{"l": "A", "x": "单纯部分性发作"}, {"l": "B", "x": "复杂部分性发作"}, {"l": "C", "x": "全面性强直-阵挛发作"}, {"l": "D", "x": "失神发作"}, {"l": "E", "x": "肌阵挛发作"}], "c": ["B"], "ex": "(1)单纯部分性发作：无意识障碍，局灶运动或感觉症状；(2)全面性强直-阵挛发作：意识丧失+四肢抽搐+口吐白沫+舌咬伤/尿失禁。", "sr": "教材P163-165", "bl": "理解"},
{"t": "q", "n": 88, "tp": "判断", "s": "首次无诱因癫痫发作后，应立即开始长期抗癫痫药物治疗。", "o": [{"l": "A", "x": "正确"}, {"l": "B", "x": "错误"}], "c": ["B"], "ex": "错误。首次无诱因癫痫发作后通常不建议立即开始长期治疗，复发率约30-50%。一般建议在第二次无诱因发作后或首次发作伴有高危因素（如结构性病灶、EEG明显异常）时启动治疗。", "sr": "教材P168-169", "bl": "理解"},
{"t": "q", "n": 89, "tp": "A1", "s": "三叉神经痛的首选治疗药物是：", "o": [{"l": "A", "x": "苯妥英钠"}, {"l": "B", "x": "加巴喷丁"}, {"l": "C", "x": "卡马西平"}, {"l": "D", "x": "普瑞巴林"}, {"l": "E", "x": "阿米替林"}], "c": ["C"], "ex": "卡马西平是三叉神经痛的一线首选药物（起始剂量100mg bid，可逐渐增量至疼痛控制，最大剂量1000mg/d）。作用机制为阻断电压门控钠通道，降低神经元兴奋性。", "sr": "教材P185", "bl": "记忆"},

{"t": "q", "n": 102, "tp": "A1", "s": "重症肌无力危象的概念及处理中，以下说法正确的是：", "o": [{"l": "A", "x": "肌无力危象是由于抗胆碱酯酶药物过量引起"}, {"l": "B", "x": "胆碱能危象应增加抗胆碱酯酶药物剂量"}, {"l": "C", "x": "反拗性危象首选抗胆碱酯酶药物"}, {"l": "D", "x": "肌无力危象应使用新斯的明或血浆置换"}, {"l": "E", "x": "所有危象的处理方案相同"}], "c": ["D"], "ex": "重症肌无力三种危象：(1)肌无力危象（最常见）：抗胆碱酯酶药量不足→加重用药+呼吸支持+血浆置换/IVIG；(2)胆碱能危象：药物过量→停用抗胆碱酯酶药+阿托品；(3)反拗性危象：对药物不敏感→暂停药物+呼吸支持。", "sr": "教材P204-205", "bl": "理解"},

{"t": "q", "n": 105, "tp": "A1", "s": "低钾型周期性瘫痪发作期的首选治疗是：", "o": [{"l": "A", "x": "静脉推注葡萄糖酸钙"}, {"l": "B", "x": "口服或静脉补钾"}, {"l": "C", "x": "口服抗胆碱酯酶药"}, {"l": "D", "x": "静脉注射糖皮质激素"}, {"l": "E", "x": "血浆置换"}], "c": ["B"], "ex": "低钾型周期性瘫痪发作期直接补钾（口服氯化钾为首选，重症可静脉补钾但需注意浓度和速度）。补钾后常在数小时内症状改善。预防可用乙酰唑胺或螺内酯。", "sr": "教材P209", "bl": "理解"},

];

var TOTAL = 0;
for(var i=0;i<data.length;i++) if(data[i].t==='q') TOTAL++;

var state = {answered:{},correct:0,wrong:0,selected:{}};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function tc(t){
    var m={A1:'A1',A2:'A2',A3:'A3',A4:'A4',B1:'B1',X:'X'};
    return m[t]||'判断';
}

function updateBar(){
    var a=state.correct+state.wrong;
    document.getElementById('cc').textContent=state.correct;
    document.getElementById('wc').textContent=state.wrong;
    document.getElementById('sp').textContent=a>0?Math.round(state.correct/a*100)+'%':'0%';
    document.getElementById('pbar').style.width=(a/TOTAL*100)+'%';
    document.getElementById('plabel').textContent=a+'/'+TOTAL;
    if(a===TOTAL&&state.wrong===0) document.getElementById('pbar').style.background='#34a853';
    else if(a===TOTAL) document.getElementById('pbar').style.background='#fbbc04';
}

function arraysEqual(a,b){
    if(a.length!==b.length) return false;
    var sa=a.slice().sort(), sb=b.slice().sort();
    for(var i=0;i<sa.length;i++) if(sa[i]!==sb[i]) return false;
    return true;
}

function finishQuestion(idx,isOk,correct,userLabels){
    state.answered[idx]=true;
    var q=data[idx];
    if(isOk) state.correct++; else state.wrong++;
    var qDiv=document.getElementById('q'+idx);
    var opts=qDiv.querySelectorAll('.option');
    var panel=document.getElementById('p'+idx);
    if(isOk){
        qDiv.classList.add('correct');
        panel.classList.add('open','ok');
        panel.firstChild.className='ans-head green';
        panel.firstChild.textContent='\u2705 回答正确！答案：'+correct.join(', ');
    }else{
        qDiv.classList.add('wrong');
        panel.classList.add('open','no');
        panel.firstChild.className='ans-head red';
        panel.firstChild.textContent='\u274c 回答错误！正确答案：'+correct.join(', ');
    }
    for(var k=0;k<opts.length;k++){
        var o=opts[k], ol=o.getAttribute('data-l');
        o.classList.add('no-click');
        if(correct.indexOf(ol)>=0){
            o.classList.add('correct-show');
            o.lastChild.classList.add('show'); o.lastChild.textContent='\u2713';
        }
        if(userLabels.indexOf(ol)>=0&&!isOk){
            o.classList.add('wrong-pick');
            o.lastChild.classList.add('show'); o.lastChild.textContent='\u2717';
        }
    }
    updateBar();
    setTimeout(function(){
        for(var j=idx+1;j<data.length;j++){
            if(data[j].t==='q'&&!state.answered[j]){
                var n=document.getElementById('q'+j);
                if(n) n.scrollIntoView({behavior:'smooth',block:'center'});
                break;
            }
        }
    },350);
}

function pick(idx,label){
    if(state.answered[idx]) return;
    var q=data[idx], correct=q.c;

    if(q.tp==='X'){
        if(!state.selected[idx]) state.selected[idx]=[];
        var sel=state.selected[idx];
        var pos=sel.indexOf(label);
        if(pos>=0){
            sel.splice(pos,1);
            document.querySelector('#q'+idx+' .option[data-l="'+label+'"]').classList.remove('picked');
        }else{
            sel.push(label);
            document.querySelector('#q'+idx+' .option[data-l="'+label+'"]').classList.add('picked');
        }
        if(sel.length===correct.length){
            var isOk=arraysEqual(sel,correct);
            finishQuestion(idx,isOk,correct,sel.slice());
        }
        return;
    }

    var isOk=correct.indexOf(label)>=0;
    finishQuestion(idx,isOk,correct,[label]);
}

function reset(){
    state={answered:{},correct:0,wrong:0,selected:{}};
    var qs=document.querySelectorAll('.question');
    for(var i=0;i<qs.length;i++) qs[i].classList.remove('correct','wrong');
    var os=document.querySelectorAll('.option');
    for(var i=0;i<os.length;i++){
        os[i].classList.remove('no-click','correct-show','wrong-pick','picked');
        os[i].lastChild.classList.remove('show'); os[i].lastChild.textContent='';
    }
    var ps=document.querySelectorAll('.answer-box');
    for(var i=0;i<ps.length;i++) ps[i].classList.remove('open','ok','no');
    document.getElementById('pbar').style.background='#34a853';
    updateBar();
    window.scrollTo({top:0,behavior:'smooth'});
}

function showAll(){
    var ps=document.querySelectorAll('.answer-box');
    for(var i=0;i<ps.length;i++) ps[i].classList.add('open');
}

function render(){
    var root=document.getElementById('quiz-root');
    var h='', caseOpen=false, realNum=0, b1Open=false;
    for(var i=0;i<data.length;i++){
        var q=data[i];
        if(q.t==='c'){
            if(caseOpen) h+='</div>';
            if(b1Open){h+='</div>';b1Open=false;}
            h+='<div class="case-group"><div class="case-header"><span class="case-label">\ud83d\udccb 病例 '+q.n+'</span>  '+esc(q.cs)+'</div>';
            caseOpen=true;
        }else if(q.t==='b'){
            if(b1Open) h+='</div>';
            if(caseOpen){h+='</div>';caseOpen=false;}
            h+='<div class="b1-box"><span class="b1-label">\ud83d\udd17 共用选项：</span> '+esc(q.lb)+'</div>';
            b1Open=true;
        }else{
            realNum++;
            var isX=q.tp==='X';
            h+='<div class="question" id="q'+i+'">';
            h+='<span class="q-num">'+realNum+'</span><span class="q-type '+tc(q.tp)+'">'+q.tp+'</span>';
            if(isX) h+=' <span style="font-size:11px;color:#7b1fa2;font-weight:600">(多选——点击切换选择，选够'+q.c.length+'个自动提交)</span>';
            if(q.tp==='\u5224\u65ad') h+=' <span style="font-size:11px;color:#00695c">(判断正误)</span>';
            h+='<div class="q-stem">'+esc(q.s)+'</div>';
            if(q.o){
                for(var k=0;k<q.o.length;k++){
                    var o=q.o[k];
                    h+='<div class="option" data-l="'+o.l+'" onclick="Quiz.pick('+i+',\''+o.l+'\')">';
                    h+='<span class="opt-label">'+o.l+'.</span><span>'+esc(o.x)+'</span>';
                    h+='<span class="result-icon">\u2713</span></div>';
                }
            }
            h+='<div class="answer-box" id="p'+i+'">';
            h+='<div class="ans-head">\u2705 答案：'+q.c.join(', ')+' | '+q.tp+' | '+q.bl+'</div>';
            h+='<div class="exp">'+esc(q.ex)+'</div>';
            if(q.sr) h+='<div class="src">\ud83d\udcd6 '+esc(q.sr)+'</div>';
            h+='</div></div>';
        }
    }
    if(caseOpen) h+='</div>';
    if(b1Open) h+='</div>';
    root.innerHTML=h;
}

render();
updateBar();

return {pick:pick,reset:reset,showAll:showAll};
})();
</script>

</html>
