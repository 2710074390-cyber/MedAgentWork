<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内科学 押题卷 · 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f4f8;
  --card-bg:#fff;
  --text:#1a1a2e;
  --primary:#1a56db;
  --primary-light:#e8f0fe;
  --success:#059669;
  --success-bg:#ecfdf5;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --warn:#d97706;
  --warn-bg:#fffbeb;
  --purple:#7c3aed;
  --purple-bg:#f5f3ff;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --radius:12px;
  --topbar-bg:linear-gradient(135deg,#0f172a,#1e3a5f);
}html[data-theme="obsidian"]{--bg:#202020;--card:#282828;--card2:#2e2e2e;--gold:#7f6df2;--gold2:#8875ff;--accent:#483699;--accent2:#a882ff;--green:#44cf6e;--red:#fb464c;--text:#dcddde;--text2:#999;--blue:#027aff;--orange:#e9973f;--purple:#a882ff;--teal:#53dfdd}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;padding-top:156px;transition:padding-top .35s ease}
body.narrow{padding-top:42px}
#topbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--topbar-bg);color:#fff;padding:12px 24px 16px;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:transform .35s ease}#topbar.hidden{transform:translateY(-100%)}
#topbar.collapsed{transform:translateY(calc(-100% + 38px))}
#topbar .peek{display:none;position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);width:48px;height:5px;background:rgba(255,255,255,.6);border-radius:0 0 6px 6px;cursor:pointer;transition:opacity .3s}
#topbar.collapsed .peek{display:block}
#topbar .peek:hover{background:rgba(255,255,255,.9);height:7px}
#topbar .collapse-hint{display:none;position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:9px;opacity:.5;letter-spacing:1px;padding-bottom:2px}
#topbar.collapsed .collapse-hint{display:block}
#topbar .inner{max-width:1000px;margin:0 auto}
#topbar h1{font-size:22px;margin-bottom:2px}
#topbar .subtitle{font-size:12px;opacity:.7;margin-bottom:8px}
#topbar .subtitle span{margin-right:16px}
.progress-row{display:flex;align-items:center;gap:12px;margin:6px 0}
.progress-wrap{flex:1;background:rgba(255,255,255,.15);border-radius:8px;height:8px;overflow:hidden}
.progress-bar{height:100%;background:var(--success);border-radius:8px;transition:width .4s;width:0%}
.progress-label{font-size:12px;opacity:.85;white-space:nowrap;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.btn-row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.btn-row .stat{font-size:12px;opacity:.9;margin-right:4px}
.btn-row .stat b{font-weight:700;min-width:20px;display:inline-block;text-align:center}
.btn-row .spacer{flex:1}
#topbar button{padding:6px 18px;border:none;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
.btn-reset{background:rgba(255,255,255,.2);color:#fff}
.btn-reset:hover{background:rgba(255,255,255,.35)}
.btn-show{background:rgba(255,255,255,.15);color:#fff}
.btn-show:hover{background:rgba(255,255,255,.3)}
.btn-jump{background:rgba(255,255,255,.1);color:#fff;font-size:11px!important;padding:5px 12px!important}
.system-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.system-tag{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);border:1px solid transparent}
.system-tag:hover,.system-tag.active{background:rgba(255,255,255,.25);color:#fff;border-color:rgba(255,255,255,.5)}

.container{max-width:1000px;margin:0 auto;padding:0 20px 30px}

.system-section{margin-bottom:6px}
.system-head{padding:14px 0 8px;font-size:17px;font-weight:700;color:var(--primary);border-bottom:2px solid #e2e8f0;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.system-head .icon{font-size:22px}
.system-head .count{font-size:13px;font-weight:400;color:#64748b;margin-left:4px}

.question{background:var(--card-bg);border-radius:var(--radius);padding:22px;margin-bottom:12px;box-shadow:var(--shadow);transition:all .3s;position:relative}
.question.correct{border-left:4px solid var(--success);background:var(--success-bg)}
.question.wrong{border-left:4px solid var(--danger);background:var(--danger-bg)}
.q-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.q-num{display:inline-flex;align-items:center;justify-content:center;background:var(--primary-light);color:var(--primary);padding:3px 14px;border-radius:14px;font-size:13px;font-weight:700;min-width:44px}
.q-type{display:inline-block;font-size:11px;padding:2px 10px;border-radius:10px;font-weight:600;letter-spacing:.5px}
.q-type.A1{background:#ecfdf5;color:#059669}
.q-type.A2{background:#eff6ff;color:#2563eb}
.q-type.A3,.q-type.A4{background:#fef2f2;color:#dc2626}
.q-type.B1{background:#fffbeb;color:#d97706}
.q-type.X{background:#f5f3ff;color:#7c3aed}
.q-type.pd{background:#f0fdf4;color:#16a34a}
.q-bl{display:inline-block;font-size:10px;padding:1px 8px;border-radius:8px;background:#f1f5f9;color:#64748b;font-weight:500}
.q-stem{font-size:15px;margin:8px 0 12px;font-weight:500;line-height:1.75}
.options{margin:4px 0}
.option{padding:10px 16px;margin:3px 0;border-radius:10px;background:#f8fafc;cursor:pointer;transition:all .15s;border:2px solid transparent;display:flex;align-items:baseline;user-select:none;font-size:14px}
.option:hover{background:var(--primary-light);border-color:var(--primary);transform:translateX(3px)}
.option.correct-show{border-color:var(--success);background:var(--success-bg)!important;cursor:default}
.option.wrong-pick{border-color:var(--danger);background:var(--danger-bg)!important;cursor:default}
.option.picked{border-color:var(--purple);background:var(--purple-bg)!important;transform:translateX(3px)}
.option.picked .opt-label{color:var(--purple)}
.option.no-click{pointer-events:none;opacity:.9}
.opt-label{font-weight:700;color:var(--primary);margin-right:10px;min-width:24px;flex-shrink:0;font-size:13px}
.option.correct-show .opt-label{color:var(--success)}
.option.wrong-pick .opt-label{color:var(--danger)}
.result-icon{display:none;margin-left:auto;font-size:16px;font-weight:700}
.result-icon.show{display:inline}

.answer-box{display:none;margin-top:10px;padding:16px;border-radius:10px;animation:fadeIn .3s}
.answer-box.open{display:block}
.answer-box.ok{background:var(--success-bg);border-left:3px solid var(--success)}
.answer-box.no{background:var(--danger-bg);border-left:3px solid var(--danger)}
.ans-head{font-size:14px;font-weight:700;margin-bottom:4px}
.ans-head.green{color:var(--success)}
.ans-head.red{color:var(--danger)}
.exp{font-size:13px;color:#334155;line-height:1.7}
.src{font-size:11px;color:#94a3b8;margin-top:6px;font-style:italic}

.case-group{background:var(--card-bg);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.case-header{font-size:14px;color:#334155;margin-bottom:12px;padding:12px 16px;background:#f0f4ff;border-radius:8px;line-height:1.7}
.case-label{font-weight:700;color:var(--primary);font-size:13px}

.b1-box{background:var(--warn-bg);padding:14px 18px;border-radius:8px;margin-bottom:14px;font-size:13px;border-left:3px solid var(--warn);line-height:1.7}
.b1-label{font-weight:700;color:var(--warn)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.footer{text-align:center;padding:30px 20px;color:#94a3b8;font-size:12px;line-height:1.8}
.footer strong{color:#64748b}

/* ===== Obsidian 树 主题覆盖（参考 Obsidian 官方 Default dark 设计令牌） ===== */
html[data-theme="obsidian"] body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);background-image:none;padding-top:132px}
html[data-theme="obsidian"] #topbar{background:linear-gradient(180deg,rgba(22,22,22,.98),rgba(32,32,32,.95));border-bottom:1px solid #333}
html[data-theme="obsidian"] #topbar h1{color:var(--gold);font-family:inherit;letter-spacing:1px}
html[data-theme="obsidian"] #topbar .decor{background:linear-gradient(90deg,var(--gold),transparent)}
html[data-theme="obsidian"] #topbar button{border-color:rgba(127,109,242,.4);color:var(--text2)}
html[data-theme="obsidian"] #topbar button:hover{border-color:var(--gold);color:var(--gold);background:rgba(127,109,242,.1)}
html[data-theme="obsidian"] #topbar .progress-wrap{background:rgba(255,255,255,.08);border-radius:4px}
html[data-theme="obsidian"] #topbar .progress-label{color:var(--text2)}
html[data-theme="obsidian"] #topbar .stat{color:var(--text2)}
html[data-theme="obsidian"] .question{background:var(--card);border:1px solid #333;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
html[data-theme="obsidian"] .question.correct{background:linear-gradient(135deg,var(--card),rgba(68,207,110,.05));border-left:3px solid var(--green)}
html[data-theme="obsidian"] .question.wrong{background:linear-gradient(135deg,var(--card),rgba(251,70,76,.05));border-left:3px solid var(--red)}
html[data-theme="obsidian"] .question::before{background:linear-gradient(90deg,transparent,rgba(127,109,242,.2),transparent)}
html[data-theme="obsidian"] .q-num{font-family:inherit;color:var(--accent2)}
html[data-theme="obsidian"] .q-stem{color:var(--text)}
html[data-theme="obsidian"] .option{border:1px solid rgba(255,255,255,.06);border-radius:6px;background:transparent;color:var(--text2)}
html[data-theme="obsidian"] .option:hover{border-color:var(--accent2);background:rgba(168,130,255,.08);color:var(--text)}
html[data-theme="obsidian"] .option.picked{background:rgba(168,130,255,.1);border-color:var(--purple)}
html[data-theme="obsidian"] .q-type.A1{border-color:rgba(83,223,221,.45);color:var(--teal)}
html[data-theme="obsidian"] .q-type.A2{border-color:rgba(2,122,255,.5);color:var(--blue)}
html[data-theme="obsidian"] .q-type.A3,.q-type.A4{border-color:rgba(251,70,76,.4);color:var(--red)}
html[data-theme="obsidian"] .q-type.B1{border-color:rgba(233,151,63,.5);color:var(--orange)}
html[data-theme="obsidian"] .q-type.X{border-color:rgba(168,130,255,.5);color:var(--purple)}
html[data-theme="obsidian"] .q-type.判断{border-color:rgba(83,223,221,.4);color:var(--teal)}
html[data-theme="obsidian"] .case-group{background:var(--card2);border-left:2px solid var(--blue);border-radius:8px}
html[data-theme="obsidian"] .case-header{background:rgba(2,122,255,.07);color:var(--text)}
html[data-theme="obsidian"] .b1-box{border-left:2px solid var(--orange);background:rgba(233,151,63,.05);color:var(--text2)}
html[data-theme="obsidian"] .exp{color:var(--text2)}
html[data-theme="obsidian"] .src{color:rgba(127,109,242,.7)}
html[data-theme="obsidian"] .footer{border-top:1px solid #333;color:var(--text2)}
html[data-theme="obsidian"] ::-webkit-scrollbar{width:8px;height:8px}
html[data-theme="obsidian"] ::-webkit-scrollbar-track{background:var(--bg)}
html[data-theme="obsidian"] ::-webkit-scrollbar-thumb{background:#3f3f3f;border-radius:4px}
html[data-theme="obsidian"] ::-webkit-scrollbar-thumb:hover{background:#555}
html[data-theme="obsidian"] .ans-head.green{color:var(--green)}
html[data-theme="obsidian"] .ans-head.red{color:var(--red)}
html[data-theme="obsidian"] #topbar .stat b{color:var(--gold)}
html[data-theme="obsidian"] .case-label{color:var(--blue)}
html[data-theme="obsidian"] .b1-label{color:var(--orange)}
/* 题目跳转闪烁高亮 */
.tree-flash{animation:treeFlash 1.2s ease}
@keyframes treeFlash{0%{box-shadow:0 0 0 2px var(--gold);background:rgba(201,168,76,.08)}100%{box-shadow:0 0 0 0 transparent}}
html[data-theme="obsidian"] .tree-flash{animation-name:treeFlashO}
@keyframes treeFlashO{0%{box-shadow:0 0 0 2px var(--gold);background:rgba(127,109,242,.12)}100%{box-shadow:0 0 0 0 transparent}}
/* ===== Obsidian 树 侧边栏（两种主题共用，变量驱动） ===== */
#tree-panel{position:fixed;top:118px;left:0;bottom:0;width:300px;z-index:990;background:var(--card2);border-right:1px solid rgba(255,255,255,.06);transform:translateX(-102%);transition:transform .3s ease;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
html[data-tree="1"] #tree-panel{transform:translateX(0)}
html[data-theme="obsidian"] #tree-panel{background:#161616;border-right:1px solid #333;box-shadow:2px 0 12px rgba(0,0,0,.4)}
#tree-panel .tree-header{display:flex;align-items:center;gap:8px;padding:14px 16px;font-size:13px;font-weight:600;color:var(--text);border-bottom:1px solid rgba(255,255,255,.06);letter-spacing:.5px}
html[data-theme="obsidian"] #tree-panel .tree-header{border-bottom-color:#333;color:#dcddde}
#tree-panel .tree-header .t-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tree-panel .tree-toggle{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
#tree-panel .tree-toggle:hover{color:var(--gold);background:rgba(255,255,255,.06)}
#tree-body{flex:1;overflow-y:auto;padding:8px 0 20px}
#tree-body::-webkit-scrollbar{width:6px}
#tree-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
html[data-theme="obsidian"] #tree-body::-webkit-scrollbar-thumb{background:#3f3f3f}
.tree-group{user-select:none}
.tree-group>.g-head{display:flex;align-items:center;gap:6px;padding:7px 14px;cursor:pointer;font-size:12.5px;color:var(--text);border-radius:4px;margin:1px 6px;letter-spacing:.5px}
.tree-group>.g-head:hover{background:rgba(255,255,255,.06)}
html[data-theme="obsidian"] .tree-group>.g-head:hover{background:rgba(255,255,255,.075)}
.tree-group>.g-head .g-arrow{font-size:9px;color:var(--text2);width:10px;transition:transform .2s;display:inline-block}
.tree-group.open>.g-head .g-arrow{transform:rotate(90deg)}
.tree-group>.g-head .g-name{flex:1}
.tree-group>.g-head .g-count{font-size:11px;color:var(--text2);background:rgba(255,255,255,.07);padding:1px 8px;border-radius:10px}
html[data-theme="obsidian"] .tree-group>.g-head .g-count{background:rgba(255,255,255,.08);color:#999}
.tree-group>.g-items{display:none;margin:0 6px 2px 22px;border-left:1px solid rgba(255,255,255,.1)}
html[data-theme="obsidian"] .tree-group>.g-items{border-left-color:rgba(255,255,255,.14)}
.tree-group.open>.g-items{display:block}
.t-item{display:flex;align-items:baseline;gap:8px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--text2);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.t-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
html[data-theme="obsidian"] .t-item:hover{background:rgba(255,255,255,.075);color:#dcddde}
.t-item .t-no{font-family:Georgia,'Noto Serif SC',serif;font-size:11px;color:var(--gold);flex-shrink:0;min-width:26px}
html[data-theme="obsidian"] .t-item .t-no{font-family:inherit;color:#a882ff}
.t-item .t-stem{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tree-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:980;opacity:0;pointer-events:none;transition:opacity .25s}
html[data-tree="1"] #tree-scrim{opacity:1;pointer-events:auto}
</style>

<script>
(function(){try{var t=localStorage.getItem('maw-theme');if(t==='obsidian')document.documentElement.setAttribute('data-theme','obsidian');var s=localStorage.getItem('maw_tree');if(s==='1'&&!document.documentElement.hasAttribute('data-tree'))document.documentElement.setAttribute('data-tree','1');}catch(e){}})();
</script></head>
<body>
<div id="tree-panel"><div class="tree-header"><span class="t-title">📚 <span id="tree-title"></span></span><button class="tree-toggle" onclick="Tree.close()" title="收起">✕</button></div><div id="tree-body"></div></div><div id="tree-scrim" onclick="Tree.close()"></div>
<div id="topbar">
<div class="inner">
<div class="peek" onclick="Quiz.toggleBar()" title="点击展开/收起"></div>

<script>
var Theme = {
  key:'maw-theme',
  get:function(){try{return localStorage.getItem(this.key)||'default'}catch(e){return 'default'}},
  set:function(t){try{localStorage.setItem(this.key,t)}catch(e){}document.documentElement.setAttribute('data-theme',t);var b=document.getElementById('btn-theme');if(b)b.textContent=t==='obsidian'?'🌲':'◐'},
  toggle:function(){this.set(this.get()==='obsidian'?'default':'obsidian')}
};
var Tree = {
  key:'maw_tree',
  open:false,
  toggle:function(){this.open=!this.open;try{localStorage.setItem(this.key,this.open?'1':'0')}catch(e){}document.documentElement.setAttribute('data-tree',this.open?'1':'0')},
  close:function(){this.open=false;try{localStorage.setItem(this.key,'0')}catch(e){}document.documentElement.setAttribute('data-tree','0')},
  build:function(data){
    var titleEl=document.getElementById('tree-title');
    if(titleEl&&document.querySelector('#topbar h1'))titleEl.textContent=document.querySelector('#topbar h1').textContent;
    var blocks=document.getElementById('quiz-root').children;
    var order=['A1','A2','A3','A4','B1','X','判断'];
    var groups={},realNum=0;
    for(var i=0;i<data.length;i++){
      var q=data[i];
      if(q.t!=='q')continue;
      realNum++;
      var key=q.tp;
      if(!groups[key])groups[key]={items:[]};
      groups[key].items.push({no:realNum,idx:i,stem:q.s});
    }
    var body=document.getElementById('tree-body'),h='';
    for(var g=0;g<order.length;g++){
      var k=order[g];
      if(!groups[k])continue;
      h+='<div class="tree-group" data-g="'+k+'"><div class="g-head"><span class="g-arrow">▶</span><span class="g-name">'+k+' 题型</span><span class="g-count">'+groups[k].items.length+'</span></div><div class="g-items">';
      for(var j=0;j<groups[k].items.length;j++){
        var it=groups[k].items[j];
        h+='<div class="t-item" data-idx="'+it.idx+'" title="第'+it.no+'题"><span class="t-no">'+it.no+'</span><span class="t-stem">'+it.stem+'</span></div>';
      }
      h+='</div></div>';
    }
    body.innerHTML=h;
    var ghs=body.querySelectorAll('.g-head');
    for(var x=0;x<ghs.length;x++){
      ghs[x].addEventListener('click',function(){var g=this.parentNode;g.classList.toggle('open');});
    }
    var items=body.querySelectorAll('.t-item');

var Quiz = (function(){
var data = [{"t":"q","n":1,"tp":"A1","s":"慢性阻塞性肺疾病(COPD)诊断的必备条件是持续气流受限，其肺功能诊断标准为吸入支气管扩张剂后","o":[{"l":"A","x":"FEV₁/FVC＜70%"},{"l":"B","x":"FEV₁＜80%预计值"},{"l":"C","x":"FVC＜80%预计值"},{"l":"D","x":"RV/TLC＞40%"},{"l":"E","x":"DLCO＜60%预计值"}],"c":["A"],"ex":"COPD诊断金标准为吸入支气管扩张剂后FEV₁/FVC＜70%，表明存在持续气流受限。FEV₁占预计值的百分比用于严重程度分级（GOLD 1-4级），而非诊断标准。RV/TLC升高提示肺气肿，DLCO降低反映弥散功能障碍。","sr":"GOLD 2025·内科学第10版","bl":"理解","sys":"resp"},{"t":"q","n":2,"tp":"A1","s":"COPD急性加重最常见的诱因是","o":[{"l":"A","x":"心力衰竭"},{"l":"B","x":"自发性气胸"},{"l":"C","x":"呼吸道感染"},{"l":"D","x":"过敏原暴露"},{"l":"E","x":"药物中断"}],"c":["C"],"ex":"呼吸道感染（病毒或细菌）是COPD急性加重最常见诱因，约占70%-80%。气胸、心衰也可诱发加重但发生率远低于感染。","sr":"GOLD 2025·内科学第10版","bl":"理解","sys":"resp"},{"t":"q","n":3,"tp":"A2","s":"患者男性，68岁，吸烟40年。近5年反复咳嗽、咳痰，活动后气短。肺功能：FEV₁/FVC 62%，FEV₁占预计值55%。该患者COPD严重程度分级（GOLD）为","o":[{"l":"A","x":"GOLD 1级（轻度）"},{"l":"B","x":"GOLD 2级（中度）"},{"l":"C","x":"GOLD 3级（重度）"},{"l":"D","x":"GOLD 4级（极重度）"},{"l":"E","x":"无法分级"}],"c":["B"],"ex":"GOLD分级以FEV₁%预计值为标准：GOLD 1级≥80%，GOLD 2级50-79%，GOLD 3级30-49%，GOLD 4级＜30%。患者FEV₁ 55%属GOLD 2级（中度）。","sr":"GOLD 2025","bl":"应用","sys":"resp"},{"t":"q","n":4,"tp":"A1","s":"COPD所致慢性肺源性心脏病，使用正性肌力药（洋地黄）的指征不包括","o":[{"l":"A","x":"感染已控制、呼吸功能改善后仍反复水肿"},{"l":"B","x":"合并室上性快速性心律失常"},{"l":"C","x":"以右心衰竭为主而无明显急性感染"},{"l":"D","x":"出现急性左心衰竭"},{"l":"E","x":"所有COPD合并肺心病患者常规使用"}],"c":["E"],"ex":"COPD所致肺心病使用洋地黄需严格掌握指征：①感染控制、呼吸功能改善后仍反复水肿；②合并室上性快速性心律失常；③以右心衰为主无明显急性感染；④出现急性左心衰。常规使用不正确——此类患者对洋地黄耐受性差，易中毒，且剂量宜小（常规量的1/2-2/3）。","sr":"内科学第10版 肺心病章节","bl":"理解","sys":"resp"},{"t":"q","n":5,"tp":"X","s":"以下属于COPD临床表现的是","o":[{"l":"A","x":"慢性咳嗽、咳痰"},{"l":"B","x":"进行性加重的呼吸困难"},{"l":"C","x":"桶状胸体征"},{"l":"D","x":"呼气相延长伴哮鸣音"},{"l":"E","x":"吸气性三凹征"}],"c":["A","B","C","D"],"ex":"COPD典型表现包括慢性咳嗽咳痰、进行性呼吸困难、桶状胸（肺气肿体征）、呼气相延长伴哮鸣音。E「吸气性三凹征」为上气道阻塞的表现，非COPD特征。COPD为呼气性呼吸困难。","sr":"内科学第10版","bl":"理解","sys":"resp"},{"t":"q","n":6,"tp":"A1","s":"支气管哮喘的本质是","o":[{"l":"A","x":"气道平滑肌痉挛"},{"l":"B","x":"肺泡弹性减退"},{"l":"C","x":"支气管黏膜水肿"},{"l":"D","x":"气道黏液腺增生"},{"l":"E","x":"慢性气道炎症"}],"c":["E"],"ex":"支气管哮喘的本质是多种炎症细胞和介质参与的气道慢性炎症，由此导致气道高反应性和可逆性气流受限。气道平滑肌痉挛、黏膜水肿、黏液分泌增多均为炎症的继发表现。","sr":"GINA 2025·内科学第10版","bl":"理解","sys":"resp"},{"t":"q","n":7,"tp":"A1","s":"支气管哮喘急性发作的首选缓解药物是","o":[{"l":"A","x":"短效β₂受体激动剂(SABA)"},{"l":"B","x":"吸入性糖皮质激素(ICS)"},{"l":"C","x":"白三烯受体拮抗剂"},{"l":"D","x":"长效β₂受体激动剂(LABA)"},{"l":"E","x":"茶碱缓释片"}],"c":["A"],"ex":"短效β₂受体激动剂（如沙丁胺醇）起效快（数分钟），是哮喘急性发作的首选缓解药物。ICS为控制药物，LABA常与ICS联用于长期控制。白三烯受体拮抗剂和茶碱为辅助控制药物。","sr":"GINA 2025","bl":"记忆","sys":"resp"},{"t":"q","n":8,"tp":"A2","s":"患者女性，22岁。反复发作性喘息3年，常于夜间及凌晨发作，闻及刺激性气味可诱发。查体：双肺散在哮鸣音。该患者最可能的诊断是","o":[{"l":"A","x":"慢性阻塞性肺疾病"},{"l":"B","x":"心源性哮喘"},{"l":"C","x":"上气道阻塞"},{"l":"D","x":"支气管哮喘"},{"l":"E","x":"过敏性肺炎"}],"c":["D"],"ex":"青年女性，发作性喘息、夜间/凌晨好发、诱因为刺激性气味、双肺哮鸣音——典型支气管哮喘。COPD多见于中老年吸烟者；心源性哮喘有心脏病基础伴湿啰音；上气道阻塞为吸气性呼吸困难。","sr":"GINA 2025","bl":"应用","sys":"resp"},{"t":"q","n":9,"tp":"A1","s":"支气管哮喘典型的呼吸困难类型为","o":[{"l":"A","x":"吸气性呼吸困难"},{"l":"B","x":"混合性呼吸困难"},{"l":"C","x":"呼气性呼吸困难"},{"l":"D","x":"端坐呼吸"},{"l":"E","x":"潮式呼吸"}],"c":["C"],"ex":"支气管哮喘表现为发作性伴哮鸣音的呼气性呼吸困难，因小气道痉挛狭窄导致呼气相气流受限。吸气性呼吸困难提示上气道阻塞（如喉头水肿、异物）；端坐呼吸为左心衰特征。","sr":"内科学第10版","bl":"理解","sys":"resp"},{"t":"q","n":10,"tp":"判断","s":"哮喘患者症状缓解后即可停用吸入性糖皮质激素（ICS）。","o":[{"l":"A","x":"正确"},{"l":"B","x":"错误"}],"c":["B"],"ex":"错误。ICS是哮喘长期控制药物，需规律使用以控制气道炎症。症状缓解不等于炎症消退，擅自停药易导致急性发作。应根据控制水平阶梯式调整剂量，达到良好控制3个月后才考虑降级治疗。","sr":"GINA 2025","bl":"理解","sys":"resp"},{"t":"q","n":11,"tp":"A1","s":"肺炎链球菌肺炎最具特征性的痰液性状是","o":[{"l":"A","x":"粉红色泡沫痰"},{"l":"B","x":"白色黏痰"},{"l":"C","x":"铁锈色痰"},{"l":"D","x":"黄绿色脓痰"},{"l":"E","x":"大量恶臭痰"}],"c":["C"],"ex":"肺炎链球菌肺炎特征性痰液为铁锈色痰，因肺泡内红细胞破坏、含铁血黄素混入痰液所致。粉红色泡沫痰见于急性左心衰肺水肿；黄绿脓痰见于铜绿假单胞菌感染；恶臭痰见于厌氧菌感染。","sr":"内科学第10版","bl":"记忆","sys":"resp"},{"t":"q","n":12,"tp":"A1","s":"肺炎链球菌肺炎的首选抗菌药物是","o":[{"l":"A","x":"头孢曲松"},{"l":"B","x":"左氧氟沙星"},{"l":"C","x":"阿奇霉素"},{"l":"D","x":"万古霉素"},{"l":"E","x":"青霉素G"}],"c":["E"],"ex":"肺炎链球菌对青霉素G敏感，青霉素G仍为首选药物。对青霉素过敏或耐药者可选用头孢菌素、呼吸喹诺酮类。万古霉素仅用于耐青霉素肺炎链球菌(PRSP)的重症感染。","sr":"内科学第10版·CAP指南","bl":"记忆","sys":"resp"},{"t":"q","n":13,"tp":"A2","s":"患者男性，28岁。淋雨后突发寒战、高热(T 39.8℃)、咳嗽、咳铁锈色痰，右侧胸痛。血常规：WBC 18×10⁹/L，N 88%。胸片示右上肺大片实变影。最可能的病原体是","o":[{"l":"A","x":"肺炎支原体"},{"l":"B","x":"肺炎链球菌"},{"l":"C","x":"金黄色葡萄球菌"},{"l":"D","x":"肺炎克雷伯菌"},{"l":"E","x":"铜绿假单胞菌"}],"c":["B"],"ex":"青年男性，淋雨受凉后急性起病，寒战高热+铁锈色痰+肺实变体征+WBC/N显著升高+胸片实变影——肺炎链球菌肺炎典型表现。支原体肺炎多见于青少年、干咳为主、WBC正常。金葡菌肺炎病情重、易形成空洞。克雷伯菌肺炎痰液黏稠呈砖红色。","sr":"内科学第10版","bl":"应用","sys":"resp"},{"t":"q","n":14,"tp":"A1","s":"肺炎支原体肺炎的首选抗菌药物是","o":[{"l":"A","x":"青霉素G"},{"l":"B","x":"头孢呋辛"},{"l":"C","x":"阿米卡星"},{"l":"D","x":"大环内酯类(阿奇霉素)"},{"l":"E","x":"万古霉素"}],"c":["D"],"ex":"肺炎支原体无细胞壁，对作用于细胞壁的β-内酰胺类（青霉素、头孢）天然耐药。大环内酯类（阿奇霉素、红霉素）和呼吸喹诺酮类（左氧氟沙星、莫西沙星）为首选。","sr":"内科学第10版","bl":"记忆","sys":"resp"},{"t":"c","n":15,"cs":"患者男性，72岁。因「发热、咳嗽、咳痰3天，呼吸困难1天」入院。既往COPD病史10年。体温38.6℃，呼吸28次/分，BP 88/55mmHg，SpO₂ 88%（吸空气）。双肺可闻及湿啰音。胸片示双下肺斑片状浸润影。","sys":"resp"},{"t":"q","n":16,"tp":"A3","s":"该患者最可能的诊断是","o":[{"l":"A","x":"重症肺炎"},{"l":"B","x":"COPD急性加重"},{"l":"C","x":"急性肺栓塞"},{"l":"D","x":"急性左心衰竭"},{"l":"E","x":"肺结核病"}],"c":["A"],"ex":"老年COPD患者，急性发热+呼吸道症状+低血压(收缩压<90mmHg)+低氧血症(SpO₂<90%)，符合重症肺炎诊断标准（需呼吸支持或存在脓毒症休克）。COPD急性加重一般无高热；肺栓塞以突发胸痛、咯血为特征；左心衰以肺水肿为主。","sr":"IDSA/ATS重症肺炎标准","bl":"应用","sys":"resp"},{"t":"q","n":17,"tp":"A3","s":"对该患者首要的处理措施是","o":[{"l":"A","x":"口服抗生素"},{"l":"B","x":"等待痰培养结果后用药"},{"l":"C","x":"立即使用支气管扩张剂"},{"l":"D","x":"利尿剂减轻肺水肿"},{"l":"E","x":"经验性静脉抗生素+氧疗"}],"c":["E"],"ex":"重症肺炎需立即经验性静脉抗生素治疗（1小时内）+氧疗/呼吸支持，不应等待病原学结果而延误治疗。支气管扩张剂可作为辅助。利尿剂对肺炎无益。CAP重症患者应在1小时内启动抗生素治疗。","sr":"IDSA/ATS CAP指南","bl":"应用","sys":"resp"},{"t":"q","n":18,"tp":"A1","s":"肺结核最主要的传播途径是","o":[{"l":"A","x":"消化道传播"},{"l":"B","x":"血液传播"},{"l":"C","x":"母婴垂直传播"},{"l":"D","x":"呼吸道飞沫传播"},{"l":"E","x":"皮肤接触传播"}],"c":["D"],"ex":"肺结核主要通过呼吸道飞沫传播，排菌肺结核患者咳嗽、打喷嚏、大声说话时喷出含结核分枝杆菌的飞沫核，被他人吸入后感染。消化道传播（饮用未消毒带菌牛奶致牛型结核）极少见。","sr":"WHO结核病报告·内科学第10版","bl":"记忆","sys":"resp"},{"t":"q","n":19,"tp":"A2","s":"患者男性，35岁。午后低热、盗汗、乏力2个月，伴咳嗽、咳痰、痰中带血1周。胸片示右上肺斑片状阴影，边缘模糊。PPD试验强阳性。最可能的诊断是","o":[{"l":"A","x":"原发性肺癌"},{"l":"B","x":"肺炎链球菌肺炎"},{"l":"C","x":"急性肺脓肿"},{"l":"D","x":"支气管扩张"},{"l":"E","x":"肺结核病"}],"c":["E"],"ex":"青年男性，午后低热+盗汗+乏力（结核中毒症状）+咳嗽咳痰咯血+上肺病变+PPD强阳性，典型继发性肺结核表现。肺癌好发于中老年、吸烟者；肺脓肿有大量脓臭痰；支扩有慢性咳嗽大量脓痰史。","sr":"内科学第10版","bl":"应用","sys":"resp"},{"t":"q","n":20,"tp":"A1","s":"抗结核化疗的基本原则不包括","o":[{"l":"A","x":"早期"},{"l":"B","x":"联合"},{"l":"C","x":"适量"},{"l":"D","x":"单药序贯"},{"l":"E","x":"全程"}],"c":["D"],"ex":"抗结核化疗五原则：早期、联合、适量、规律、全程。「单药序贯」违反联合用药原则，易诱导耐药。标准化疗方案采用INH+RFP+PZA+EMB四联强化期，后两联巩固期。","sr":"WHO·内科学第10版","bl":"记忆","sys":"resp"},{"t":"q","n":21,"tp":"X","s":"抗结核一线药物包括","o":[{"l":"A","x":"异烟肼(INH)"},{"l":"B","x":"利福平(RFP)"},{"l":"C","x":"吡嗪酰胺(PZA)"},{"l":"D","x":"乙胺丁醇(EMB)"},{"l":"E","x":"莫西沙星(MFX)"}],"c":["A","B","C","D"],"ex":"一线抗结核药物为INH、RFP、PZA、EMB、SM（链霉素）。莫西沙星属氟喹诺酮类，为二线药物，主要用于耐药结核病(MDR-TB)的治疗。","sr":"WHO·内科学第10版","bl":"记忆","sys":"resp"},{"t":"q","n":22,"tp":"A1","s":"原发性支气管肺癌最重要的危险因素是","o":[{"l":"A","x":"大气污染"},{"l":"B","x":"职业暴露(石棉)"},{"l":"C","x":"遗传因素"},{"l":"D","x":"电离辐射"},{"l":"E","x":"长期吸烟"}],"c":["E"],"ex":"吸烟是肺癌最重要的危险因素，约85%以上的肺癌与吸烟相关。吸烟者患肺癌风险为非吸烟者的10-20倍。石棉、大气污染、电离辐射、遗传均为危险因素但权重远低于吸烟。","sr":"内科学第10版·WHO癌症报告","bl":"记忆","sys":"resp"},{"t":"q","n":23,"tp":"A2","s":"患者男性，58岁，吸烟指数600（20支/天×30年）。近2月刺激性干咳，近1周痰中带血丝。胸片示右肺门肿块影伴右上肺不张。最可能的诊断是","o":[{"l":"A","x":"中心型肺癌"},{"l":"B","x":"周围型肺癌"},{"l":"C","x":"肺结核球"},{"l":"D","x":"肺错构瘤"},{"l":"E","x":"炎性假瘤"}],"c":["A"],"ex":"老年男性，大量吸烟史，刺激性干咳+痰中带血+肺门肿块+肺不张——典型中心型肺癌（鳞癌多见）表现。周围型肺癌以孤立肺结节为主。结核球好发于上肺尖后段，有钙化和卫星灶。错构瘤呈「爆米花」样钙化。","sr":"内科学第10版","bl":"应用","sys":"resp"},{"t":"q","n":24,"tp":"判断","s":"低剂量螺旋CT可用于肺癌高危人群的筛查，可降低肺癌死亡率。","o":[{"l":"A","x":"正确"},{"l":"B","x":"错误"}],"c":["A"],"ex":"正确。NLST研究和NELSON研究证实，对肺癌高危人群（55-74岁，吸烟≥30包年）采用低剂量螺旋CT(LDCT)年度筛查，可降低肺癌死亡率约20%。","sr":"USPSTF·NLST研究","bl":"记忆","sys":"resp"},{"t":"q","n":25,"tp":"A1","s":"慢性肺源性心脏病最常见的病因是","o":[{"l":"A","x":"间质性肺疾病"},{"l":"B","x":"胸廓畸形"},{"l":"C","x":"肺血管病变"},{"l":"D","x":"COPD"},{"l":"E","x":"睡眠呼吸暂停综合征"}],"c":["D"],"ex":"COPD是慢性肺心病最常见的病因，约占80%-90%。COPD导致肺泡缺氧和二氧化碳潴留→肺血管收缩重塑→肺动脉高压→右心负荷增加→肺心病。","sr":"内科学第10版","bl":"记忆","sys":"resp"},{"t":"q","n":26,"tp":"A2","s":"患者男性，70岁，COPD病史15年。近半年出现双下肢水肿、颈静脉怒张、肝大压痛。超声心动图示右心室扩大、肺动脉压48mmHg。该患者的诊断是","o":[{"l":"A","x":"慢性肺源性心脏病（失代偿期）"},{"l":"B","x":"扩张型心肌病"},{"l":"C","x":"缩窄性心包炎"},{"l":"D","x":"肝炎后肝硬化"},{"l":"E","x":"肾病综合征"}],"c":["A"],"ex":"COPD基础病+肺动脉高压(48mmHg)+右心衰体征（下肢水肿、颈静脉怒张、肝大）=慢性肺心病失代偿期。扩张型心肌病以左心室扩大为主；缩窄性心包炎有Kussmaul征；肝硬化有门脉高压表现。","sr":"内科学第10版","bl":"应用","sys":"resp"},{"t":"q","n":27,"tp":"A1","s":"肺性肺动脉高压形成的最关键机制是","o":[{"l":"A","x":"肺泡壁破坏、肺毛细血管床减少"},{"l":"B","x":"缺氧性肺血管收缩"},{"l":"C","x":"血液黏稠度增加"},{"l":"D","x":"高碳酸血症直接扩血管"},{"l":"E","x":"左心功能不全的后向传递"}],"c":["B"],"ex":"缺氧性肺血管收缩是肺性肺动脉高压最关键的始动机制。慢性缺氧→肺血管平滑肌细胞膜钾通道抑制→膜去极化→电压门控钙通道开放→细胞内Ca²⁺升高→肺血管持续收缩重塑→肺动脉高压。A、C为辅助因素；D「高碳酸血症」产生H⁺也可收缩肺血管，但缺氧效应为主。","sr":"内科学第10版 肺心病章节","bl":"理解","sys":"resp"},{"t":"q","n":28,"tp":"X","s":"慢性肺源性心脏病的并发症包括","o":[{"l":"A","x":"肺性脑病"},{"l":"B","x":"酸碱失衡及电解质紊乱"},{"l":"C","x":"心律失常"},{"l":"D","x":"消化道出血"},{"l":"E","x":"急性心肌梗死"}],"c":["A","B","C","D"],"ex":"肺心病并发症包括肺性脑病、酸碱失衡及电解质紊乱、心律失常、消化道出血（应激性溃疡）、休克、DIC等。E「急性心肌梗死」非肺心病直接并发症（虽然可共存但与COPD-肺心病因果链无关）。","sr":"内科学第10版","bl":"理解","sys":"resp"},{"t":"q","n":29,"tp":"A1","s":"在海平面、静息状态、呼吸空气条件下，慢性呼吸衰竭的诊断标准是","o":[{"l":"A","x":"PaO₂＜80mmHg"},{"l":"B","x":"PaO₂＜70mmHg"},{"l":"C","x":"PaO₂＜60mmHg伴或不伴PaCO₂＞50mmHg"},{"l":"D","x":"PaCO₂＞40mmHg"},{"l":"E","x":"SpO₂＜95%"}],"c":["C"],"ex":"慢性呼吸衰竭诊断标准（海平面、静息状态、呼吸空气）：PaO₂＜60mmHg，伴或不伴PaCO₂＞50mmHg。Ⅰ型呼衰仅有低氧血症（PaO₂＜60）；Ⅱ型呼衰伴高碳酸血症（PaO₂＜60+PaCO₂＞50）。","sr":"内科学第10版","bl":"记忆","sys":"resp"},{"t":"q","n":30,"tp":"X","s":"Ⅱ型呼吸衰竭的血气分析特征包括","o":[{"l":"A","x":"PaO₂＜60mmHg"},{"l":"B","x":"PaCO₂＞50mmHg"},{"l":"C","x":"PaO₂＞80mmHg"},{"l":"D","x":"pH可能降低（失代偿性酸中毒）"},{"l":"E","x":"HCO₃⁻可代偿性升高"}],"c":["A","B","D","E"],"ex":"Ⅱ型呼衰（高碳酸血症性）：PaO₂＜60mmHg+PaCO₂＞50mmHg。急性期pH降低（呼吸性酸中毒），慢性期肾脏代偿→HCO₃⁻升高→pH可正常或接近正常。C错误（PaO₂不可能＞80）。","sr":"内科学第10版","bl":"理解","sys":"resp"},{"t":"q","n":31,"tp":"A1","s":"慢性心力衰竭最常见的诱因是","o":[{"l":"A","x":"感染（尤其肺部感染）"},{"l":"B","x":"体力活动"},{"l":"C","x":"情绪激动"},{"l":"D","x":"输液过多"},{"l":"E","x":"妊娠分娩"}],"c":["A"],"ex":"感染（尤其呼吸道感染）是心衰最常见、最重要的诱因。感染→发热→心率加快→心肌耗氧增加+毒素抑制心肌→诱发或加重心衰。其他诱因包括心律失常、血容量增加、过度劳累、治疗不当等。","sr":"中国心衰指南2024·内科学第10版","bl":"理解","sys":"circ"},{"t":"q","n":32,"tp":"A1","s":"诊断心力衰竭最有价值的辅助检查是","o":[{"l":"A","x":"心电图"},{"l":"B","x":"胸部X线"},{"l":"C","x":"超声心动图"},{"l":"D","x":"血浆BNP/NT-proBNP"},{"l":"E","x":"冠状动脉造影"}],"c":["C"],"ex":"超声心动图是评估心脏结构和功能的首选方法，可直观评估LVEF、心室大小、室壁厚度、瓣膜功能及舒张功能参数，是心衰诊断的核心依据。BNP/NT-proBNP用于筛查和排除（阴性预测值>95%）；心电图和胸片为辅助检查。","sr":"中国心衰指南2024","bl":"理解","sys":"circ"},{"t":"q","n":33,"tp":"A1","s":"慢性HFrEF（射血分数降低的心衰）药物治疗的「新四联」基石不包括","o":[{"l":"A","x":"ARNI/ACEI/ARB"},{"l":"B","x":"β受体阻滞剂"},{"l":"C","x":"醛固酮受体拮抗剂(MRA)"},{"l":"D","x":"SGLT-2抑制剂"},{"l":"E","x":"地高辛"}],"c":["E"],"ex":"HFrEF '新四联'GDMT：①ARNI/ACEI/ARB + ②β受体阻滞剂 + ③MRA + ④SGLT-2抑制剂。地高辛为二线药物，用于「新四联」后仍有症状者或合并房颤快室率者，不属基石药物。","sr":"中国心衰指南2024·ESC 2023","bl":"记忆","sys":"circ"},{"t":"q","n":34,"tp":"A2","s":"患者男性，68岁。冠心病史10年。近1个月出现活动后呼吸困难，夜间不能平卧，需高枕卧位。查体：双肺底细湿啰音。该患者心功能NYHA分级为","o":[{"l":"A","x":"Ⅰ级"},{"l":"B","x":"Ⅱ级"},{"l":"C","x":"Ⅲ级"},{"l":"D","x":"Ⅳ级"},{"l":"E","x":"无法判断"}],"c":["C"],"ex":"NYHA分级：Ⅰ级-日常活动不受限；Ⅱ级-日常活动轻度受限（较重活动出现症状）；Ⅲ级-日常活动明显受限（轻度活动即出现症状，夜间阵发性呼吸困难）；Ⅳ级-静息状态也有症状。患者夜间不能平卧+轻度活动即出现症状=NYHA Ⅲ级。","sr":"NYHA分级标准","bl":"应用","sys":"circ"},{"t":"q","n":35,"tp":"A2","s":"患者女性，72岁。高血压病史20年。突发严重呼吸困难、端坐呼吸、烦躁不安、大汗淋漓，咳粉红色泡沫痰。双肺满布湿啰音及哮鸣音。BP 200/110mmHg。最可能的诊断是","o":[{"l":"A","x":"支气管哮喘急性发作"},{"l":"B","x":"COPD急性加重"},{"l":"C","x":"急性肺栓塞"},{"l":"D","x":"急性左心衰竭"},{"l":"E","x":"自发性气胸"}],"c":["D"],"ex":"高血压+突发端坐呼吸+粉红色泡沫痰（特征性）+双肺湿啰音+血压显著升高——急性左心衰（高血压急症诱发）。哮喘以呼气性呼吸困难+哮鸣音为主，无粉红色泡沫痰及湿啰音。肺栓塞以胸痛、咯血、D-二聚体升高为特征。","sr":"中国心衰指南2024","bl":"应用","sys":"circ"},{"t":"q","n":36,"tp":"X","s":"洋地黄中毒的临床表现包括","o":[{"l":"A","x":"恶心、呕吐、黄视"},{"l":"B","x":"室性期前收缩二联律"},{"l":"C","x":"房室传导阻滞"},{"l":"D","x":"心房颤动"},{"l":"E","x":"头痛、失眠"}],"c":["A","B","C"],"ex":"洋地黄中毒表现：①胃肠道症状（恶心、呕吐、食欲减退）；②心脏毒性（室早二联律、非阵发性交界性心动过速、房室传导阻滞、房速伴阻滞等）；③神经系统症状（黄视/绿视、头痛、眩晕）。D心房颤动本身不是洋地黄中毒表现（虽然洋地黄可用于控制房颤室率）。","sr":"内科学第10版","bl":"理解","sys":"circ"},{"t":"c","n":37,"cs":"患者男性，65岁。因「突发胸痛2小时」入院。心电图示V₁-V₄导联ST段弓背向上抬高。诊断为急性广泛前壁心肌梗死。急诊行PCI术，术后第3天患者出现呼吸困难、双肺底湿啰音、血压偏低。","sys":"circ"},{"t":"q","n":38,"tp":"A3","s":"该患者目前的心功能Killip分级最可能是","o":[{"l":"A","x":"Killip Ⅰ级"},{"l":"B","x":"无法判断"},{"l":"C","x":"Killip Ⅲ级"},{"l":"D","x":"Killip Ⅳ级"},{"l":"E","x":"Killip Ⅱ级"}],"c":["E"],"ex":"Killip分级（用于AMI合并心衰）：Ⅰ级-无心衰征象；Ⅱ级-双肺底湿啰音（＜50%肺野）+S₃奔马律；Ⅲ级-急性肺水肿（湿啰音>50%肺野）；Ⅳ级-心源性休克。患者双肺底湿啰音+血压偏低但未达休克=Killip Ⅱ级。","sr":"Killip分级标准","bl":"应用","sys":"circ"},{"t":"q","n":39,"tp":"A1","s":"心房颤动最常见的心血管基础病因是","o":[{"l":"A","x":"心脏瓣膜病"},{"l":"B","x":"冠心病"},{"l":"C","x":"肺源性心脏病"},{"l":"D","x":"心肌病"},{"l":"E","x":"先天性心脏病"}],"c":["A"],"ex":"房颤最常见心血管病因为心脏瓣膜病（尤其二尖瓣狭窄/关闭不全）和高血压心脏病、冠心病。其中风湿性二尖瓣病变与房颤关系最为密切——左房扩大→心房肌电重构→房颤。但总体上随人口老龄化，高血压和冠心病相关房颤比例不断上升。","sr":"内科学第10版","bl":"记忆","sys":"circ"},{"t":"q","n":40,"tp":"A1","s":"预激综合征（WPW综合征）最具特征性的心电图表现是","o":[{"l":"A","x":"PR间期延长"},{"l":"B","x":"QRS波宽大畸形"},{"l":"C","x":"delta波+PR间期缩短+QRS波增宽"},{"l":"D","x":"ST段显著压低"},{"l":"E","x":"QT间期显著延长"}],"c":["C"],"ex":"WPW综合征典型心电图三联征：①delta波（QRS波起始部粗钝）；②PR间期缩短（＜0.12s）；③QRS波增宽（≥0.12s）。机制为存在房室旁路(Kent束)→心室提前激动。","sr":"内科学第10版","bl":"理解","sys":"circ"},{"t":"q","n":41,"tp":"A2","s":"患者女性，55岁。突发心悸2小时，既往有阵发性心悸史。ECG示心率180次/分，QRS波正常，P波消失，RR间期绝对规则。最可能的诊断是","o":[{"l":"A","x":"阵发性室上性心动过速"},{"l":"B","x":"心房扑动"},{"l":"C","x":"心房颤动"},{"l":"D","x":"室性心动过速"},{"l":"E","x":"窦性心动过速"}],"c":["A"],"ex":"心率180次/分+QRS正常（窄QRS）+RR绝对规则+P波消失——典型阵发性室上速（PSVT，多为房室结折返性心动过速AVNRT）。房颤RR绝对不规则；房扑可有锯齿波；室速为宽QRS；窦速有P波且心率一般＜150。","sr":"内科学第10版","bl":"应用","sys":"circ"},{"t":"q","n":42,"tp":"A1","s":"三度房室传导阻滞的心电图特征不包括","o":[{"l":"A","x":"P波与QRS波完全无关"},{"l":"B","x":"心房率＞心室率"},{"l":"C","x":"PR间期固定延长"},{"l":"D","x":"心室率缓慢而规则"},{"l":"E","x":"可出现Adams-Stokes综合征"}],"c":["C"],"ex":"三度房室传导阻滞特征：P与QRS完全无关（房室分离）、房率＞室率、心室率缓慢（30-50次/分）且规则、可出现阿斯综合征。C「PR间期固定延长」为二度Ⅰ型（文氏型）特征，三度AVB的PR间期完全不固定。","sr":"内科学第10版","bl":"理解","sys":"circ"},{"t":"q","n":43,"tp":"X","s":"心房颤动的治疗策略包括","o":[{"l":"A","x":"心室率控制"},{"l":"B","x":"节律控制（转复并维持窦性心律）"},{"l":"C","x":"抗凝治疗预防血栓栓塞"},{"l":"D","x":"常规使用Ⅰc类抗心律失常药"},{"l":"E","x":"上游治疗（控制危险因素）"}],"c":["A","B","C","E"],"ex":"房颤治疗三支柱：①抗凝预防卒中（CHA₂DS₂-VASc评分指导）；②室率控制或节律控制；③上游治疗（控制高血压、心衰、糖尿病等危险因素）。D错误——Ⅰc类药物（如普罗帕酮）仅用于无结构性心脏病者的节律控制，非「常规使用」。","sr":"ESC 2024房颤指南","bl":"理解","sys":"circ"},{"t":"q","n":44,"tp":"判断","s":"心房颤动患者出现血流动力学不稳定时，首选治疗是紧急电复律。","o":[{"l":"A","x":"正确"},{"l":"B","x":"错误"}],"c":["A"],"ex":"正确。房颤伴血流动力学不稳定（低血压、休克、急性心衰、心肌缺血、意识障碍）→紧急同步直流电复律，是Ⅰ类推荐。药物复律起效慢，不适合紧急情况。","sr":"ESC 2024房颤指南","bl":"应用","sys":"circ"},{"t":"q","n":45,"tp":"A1","s":"冠心病最重要的独立危险因素是","o":[{"l":"A","x":"高血压"},{"l":"B","x":"糖尿病"},{"l":"C","x":"血脂异常（LDL-C升高）"},{"l":"D","x":"肥胖"},{"l":"E","x":"吸烟"}],"c":["C"],"ex":"血脂异常（尤其LDL-C升高）是动脉粥样硬化最重要的独立危险因素和始动环节。LDL-C经氧化修饰后被巨噬细胞吞噬形成泡沫细胞，构成粥样斑块核心。「没有LDL-C就没有动脉粥样硬化」——孟德尔随机化研究证实因果关联。","sr":"ESC CVD预防指南·内科学第10版","bl":"理解","sys":"circ"},{"t":"q","n":46,"tp":"A1","s":"稳定型心绞痛的典型疼痛特点不包括","o":[{"l":"A","x":"持续时间＞30分钟"},{"l":"B","x":"劳累或情绪激动诱发"},{"l":"C","x":"胸骨后压榨性疼痛"},{"l":"D","x":"休息或含服硝酸甘油后1-5分钟内缓解"},{"l":"E","x":"可放射至左肩及左上肢"}],"c":["A"],"ex":"稳定型心绞痛持续时间为数分钟（一般3-5分钟），很少超过15-20分钟。持续＞30分钟需警惕急性心肌梗死。其余选项均为稳定型心绞痛的典型特点。","sr":"内科学第10版","bl":"理解","sys":"circ"},{"t":"q","n":47,"tp":"A2","s":"患者男性，60岁。活动时出现胸骨后压榨样疼痛，休息3-5分钟后缓解。近1个月发作频率增加，轻微活动即可诱发。心电图无异常。该患者应诊断为","o":[{"l":"A","x":"稳定型心绞痛"},{"l":"B","x":"不稳定型心绞痛"},{"l":"C","x":"变异型心绞痛"},{"l":"D","x":"急性心肌梗死"},{"l":"E","x":"心脏神经官能症"}],"c":["B"],"ex":"近1个月内发作频率增加、活动耐量下降（轻微活动即可诱发）→恶化劳力性心绞痛，属不稳定型心绞痛(UA)。特点是：①发作频率/程度/持续时间增加；②诱发阈值降低；③静息时也可发作。稳定型心绞痛发作特点1个月内无变化。","sr":"内科学第10版","bl":"应用","sys":"circ"},{"t":"q","n":48,"tp":"A1","s":"急性心肌梗死最具确诊价值的心肌坏死标志物是","o":[{"l":"A","x":"CK-MB"},{"l":"B","x":"肌红蛋白"},{"l":"C","x":"cTnI/cTnT（心肌肌钙蛋白）"},{"l":"D","x":"AST"},{"l":"E","x":"LDH"}],"c":["C"],"ex":"心肌肌钙蛋白(cTnI/cTnT)是目前诊断AMI的首选标志物，具有极高的心肌特异性和敏感性。高敏肌钙蛋白(hs-cTn)可在胸痛发作1-3小时内检测到升高。CK-MB也曾为传统标志物，现已被cTn取代。肌红蛋白升高最早但特异性低。","sr":"第四版心肌梗死通用定义","bl":"记忆","sys":"circ"},{"t":"q","n":49,"tp":"A2","s":"患者男性，55岁。突发胸骨后剧烈疼痛2小时，伴大汗、濒死感。ECG示V₁-V₄导联ST段弓背向上抬高。首选的治疗措施是","o":[{"l":"A","x":"溶栓治疗"},{"l":"B","x":"直接PCI（经皮冠状动脉介入治疗）"},{"l":"C","x":"抗凝治疗"},{"l":"D","x":"β受体阻滞剂"},{"l":"E","x":"硝酸甘油静脉滴注"}],"c":["B"],"ex":"STEMI发病2小时，在时间窗内（＜12h），首选直接PCI（急诊经皮冠状动脉介入治疗）开通梗死相关动脉——Ⅰ类推荐。溶栓仅作为无法及时PCI时的替代。PCI优于溶栓：TIMI 3级血流率更高、再梗率更低、颅内出血风险更低。","sr":"ESC 2023 STEMI指南","bl":"应用","sys":"circ"},{"t":"q","n":50,"tp":"A1","s":"急性心肌梗死后24小时内最常见的并发症是","o":[{"l":"A","x":"心律失常"},{"l":"B","x":"心力衰竭"},{"l":"C","x":"心源性休克"},{"l":"D","x":"心室游离壁破裂"},{"l":"E","x":"室间隔穿孔"}],"c":["A"],"ex":"心律失常是AMI最常见的并发症，尤以24小时内最多见（室性心律失常为主），也是院前死亡的主要原因。室颤在AMI发生4小时内发生率最高。心衰、心源性休克可发生但发生率低于心律失常。心脏破裂为晚期并发症（多见于3-7天）。","sr":"内科学第10版","bl":"记忆","sys":"circ"},{"t":"q","n":51,"tp":"X","s":"冠心病二级预防的ABCDE方案包括","o":[{"l":"A","x":"A-阿司匹林(Aspirin)和ACEI/ARB"},{"l":"B","x":"B-β受体阻滞剂(β-blocker)和血压控制(Blood pressure)"},{"l":"C","x":"C-戒烟(Cigarette)和降胆固醇(Cholesterol)"},{"l":"D","x":"D-控制糖尿病(Diabetes)和合理饮食(Diet)"},{"l":"E","x":"E-教育(Education)和运动(Exercise)"}],"c":["A","B","C","D","E"],"ex":"冠心病二级预防ABCDE方案：A-Aspirin+ACEI/ARB；B-β-blocker+Blood pressure；C-Cigarette(戒烟)+Cholesterol(他汀)；D-Diabetes(控糖)+Diet(饮食)；E-Education(健康教育)+Exercise(运动康复)。全选。","sr":"AHA/ACC·内科学第10版","bl":"记忆","sys":"circ"},{"t":"c","n":52,"cs":"患者男性，62岁。因「胸痛6小时」入院。ECG示Ⅱ、Ⅲ、aVF导联ST段抬高。诊断为急性下壁心肌梗死。急诊PCI术中于右冠状动脉置入支架1枚。术后第5天，患者突发胸痛加剧、呼吸困难、血压下降至80/50mmHg，心前区闻及粗糙收缩期杂音。","sys":"circ"},{"t":"q","n":53,"tp":"A4","s":"该患者术后第5天出现上述表现，最可能的原因是","o":[{"l":"A","x":"支架内血栓形成"},{"l":"B","x":"肺栓塞"},{"l":"C","x":"心包炎"},{"l":"D","x":"再次心肌梗死"},{"l":"E","x":"室间隔穿孔"}],"c":["E"],"ex":"下壁MI+术后第5天+突发胸痛+血流动力学恶化+心前区粗糙收缩期杂音——典型室间隔穿孔(VSR)三联征。好发于AMI后3-7天。支架内血栓通常发生在术后24h内（急性）或1-30天（亚急性）；再次MI的ECG应有动态演变。","sr":"内科学第10版 AMI并发症","bl":"分析","sys":"circ"},{"t":"q","n":54,"tp":"A4","s":"确认该并发症最有价值的辅助检查是","o":[{"l":"A","x":"心电图"},{"l":"B","x":"胸部X线"},{"l":"C","x":"心肌酶谱"},{"l":"D","x":"超声心动图"},{"l":"E","x":"冠状动脉造影"}],"c":["D"],"ex":"超声心动图（尤其多普勒）可直观显示室间隔回声中断+左向右分流信号，是诊断室间隔穿孔的首选检查，敏感性和特异性均高。冠状动脉造影显示冠脉病变但不能直接诊断VSR。","sr":"内科学第10版","bl":"分析","sys":"circ"},{"t":"q","n":55,"tp":"A1","s":"原发性高血压的诊断标准是（非同日3次测量）","o":[{"l":"A","x":"收缩压≥120mmHg和/或舒张压≥80mmHg"},{"l":"B","x":"收缩压≥130mmHg和/或舒张压≥85mmHg"},{"l":"C","x":"收缩压≥140mmHg和/或舒张压≥90mmHg"},{"l":"D","x":"收缩压≥150mmHg和/或舒张压≥95mmHg"},{"l":"E","x":"收缩压≥160mmHg和/或舒张压≥100mmHg"}],"c":["C"],"ex":"中国高血压诊断标准：非同日3次测量，收缩压≥140mmHg和/或舒张压≥90mmHg。注意与美国ACC/AHA标准(≥130/80mmHg)的区别。中国仍沿用140/90mmHg标准（中国高血压防治指南2024）。","sr":"中国高血压防治指南2024","bl":"记忆","sys":"circ"},{"t":"q","n":56,"tp":"A1","s":"高血压合并糖尿病患者的血压控制目标为","o":[{"l":"A","x":"＜140/90mmHg"},{"l":"B","x":"＜130/80mmHg"},{"l":"C","x":"＜120/80mmHg"},{"l":"D","x":"＜150/90mmHg"},{"l":"E","x":"＜160/100mmHg"}],"c":["B"],"ex":"高血压合并糖尿病、冠心病、慢性肾病、心衰等高危患者，血压控制目标更严格：＜130/80mmHg。一般高血压患者目标为＜140/90mmHg。老年人(≥65岁)可适当放宽至＜150/90mmHg。","sr":"中国高血压防治指南2024","bl":"记忆","sys":"circ"},{"t":"q","n":57,"tp":"A2","s":"患者男性，48岁。体检发现血压160/100mmHg，无不适症状。非同日3次测量均在150-165/95-105mmHg范围。心电图及超声心动图正常。该患者高血压分级为","o":[{"l":"A","x":"正常高值血压"},{"l":"B","x":"1级高血压"},{"l":"C","x":"单纯收缩期高血压"},{"l":"D","x":"3级高血压"},{"l":"E","x":"2级高血压"}],"c":["E"],"ex":"高血压分级（以较高者为准）：1级 140-159/90-99，2级 160-179/100-109，3级 ≥180/110。患者160/100mmHg属2级高血压（收缩压达2级标准）。正常高值=120-139/80-89。","sr":"中国高血压防治指南2024","bl":"应用","sys":"circ"},{"t":"q","n":58,"tp":"A2","s":"患者男性，60岁。高血压病史10年，长期服用氨氯地平。今日突发剧烈头痛、恶心呕吐、视物模糊。BP 220/130mmHg。眼底检查示视乳头水肿。该患者应诊断为","o":[{"l":"A","x":"恶性高血压"},{"l":"B","x":"高血压急症"},{"l":"C","x":"高血压亚急症"},{"l":"D","x":"顽固性高血压"},{"l":"E","x":"白大衣高血压"}],"c":["B"],"ex":"BP 220/130mmHg+急性靶器官损害证据（视乳头水肿=高血压脑病/视网膜病变）→高血压急症(Hypertensive Emergency)。高血压急症=血压显著升高(>180/120)+急性进行性靶器官损害，需静脉降压。高血压亚急症=血压显著升高但无急性靶器官损害。恶性高血压=舒张压>130+视乳头水肿(KW Ⅲ-Ⅳ级)。","sr":"中国高血压防治指南2024","bl":"应用","sys":"circ"},{"t":"q","n":59,"tp":"X","s":"以下属于继发性高血压常见病因的是","o":[{"l":"A","x":"肾实质性高血压"},{"l":"B","x":"肾血管性高血压（肾动脉狭窄）"},{"l":"C","x":"原发性醛固酮增多症"},{"l":"D","x":"嗜铬细胞瘤"},{"l":"E","x":"主动脉缩窄"}],"c":["A","B","C","D","E"],"ex":"继发性高血压常见病因：①肾实质性（肾炎、多囊肾）；②肾血管性（肾动脉狭窄）；③内分泌性（原醛、嗜铬细胞瘤、库欣综合征）；④主动脉缩窄；⑤OSAS；⑥药物性等。约占高血压患者的5%-15%，多见于年轻、难治、突发高血压患者。全选。","sr":"内科学第10版","bl":"理解","sys":"circ"},{"t":"q","n":60,"tp":"判断","s":"高血压患者一经诊断，应立即启动两种及以上降压药物联合治疗。","o":[{"l":"A","x":"正确"},{"l":"B","x":"错误"}],"c":["B"],"ex":"错误。1级高血压且心血管风险为低-中危者，可先生活方式干预（1-3个月），血压不达标再启动单药治疗。2级及以上或高危/极高危患者（如合并糖尿病、CKD、CVD）应立即启动药物治疗，可考虑起始联合治疗。并非「所有患者一经诊断即联合用药」。","sr":"中国高血压防治指南2024","bl":"应用","sys":"circ"},{"t":"q","n":61,"tp":"A1","s":"扩张型心肌病最主要的临床特征是","o":[{"l":"A","x":"心脏扩大+收缩功能障碍"},{"l":"B","x":"限制性充盈障碍"},{"l":"C","x":"心肌肥厚为主"},{"l":"D","x":"心室壁增厚+舒张功能障碍"},{"l":"E","x":"心包增厚钙化"}],"c":["A"],"ex":"扩张型心肌病(DCM)特征：左心室或双心室扩大+收缩功能障碍（LVEF降低）。肥厚型心肌病(HCM)特征：心室壁增厚+舒张功能障碍。限制型心肌病(RCM)特征：限制性充盈障碍。缩窄性心包炎为心包增厚钙化。","sr":"内科学第10版","bl":"理解","sys":"circ"},{"t":"q","n":62,"tp":"A1","s":"肥厚型心肌病最具特征性的体征是","o":[{"l":"A","x":"心尖部收缩期杂音"},{"l":"B","x":"三尖瓣区全收缩期杂音"},{"l":"C","x":"心尖部舒张期隆隆样杂音"},{"l":"D","x":"主动脉瓣区舒张期叹气样杂音"},{"l":"E","x":"胸骨左缘第3-4肋间粗糙的喷射性收缩期杂音"}],"c":["E"],"ex":"肥厚型梗阻性心肌病(HOCM)特征性体征为胸骨左缘第3-4肋间粗糙的喷射性收缩期杂音，为左室流出道梗阻所致。杂音激发试验：Valsalva动作、站立位→杂音增强；下蹲、握拳→杂音减弱。A为二尖瓣反流；C为二尖瓣狭窄；D为主动脉瓣关闭不全。","sr":"内科学第10版","bl":"理解","sys":"circ"},{"t":"q","n":63,"tp":"A2","s":"患者男性，35岁。运动中突发晕厥。其父于40岁时猝死。超声心动图示室间隔厚18mm（正常6-11mm），室间隔/左室后壁厚度比1.8，左室流出道压差60mmHg。最可能的诊断是","o":[{"l":"A","x":"扩张型心肌病"},{"l":"B","x":"高血压性心脏病"},{"l":"C","x":"限制型心肌病"},{"l":"D","x":"主动脉瓣狭窄"},{"l":"E","x":"肥厚型心肌病"}],"c":["E"],"ex":"青年男性+运动相关晕厥+猝死家族史+室间隔显著肥厚(18mm)+SAM征致流出道梗阻(压差60mmHg)=典型肥厚型心肌病(HOCM)。HCM为常染色体显性遗传（肌小节蛋白基因突变），是青年 athletes 心源性猝死最常见原因。","sr":"内科学第10版","bl":"应用","sys":"circ"},{"t":"q","n":64,"tp":"X","s":"扩张型心肌病的治疗包括","o":[{"l":"A","x":"ACEI/ARB/ARNI"},{"l":"B","x":"β受体阻滞剂"},{"l":"C","x":"醛固酮受体拮抗剂(MRA)"},{"l":"D","x":"SGLT-2抑制剂"},{"l":"E","x":"心脏再同步化治疗(CRT)（符合指征者）"}],"c":["A","B","C","D","E"],"ex":"DCM治疗与HFrEF相同：'新四联'GDMT（A+B+C+D）+ 器械治疗（ICD预防猝死、CRT治疗心室不同步）。晚期可考虑心脏移植。全选。","sr":"中国心衰指南2024","bl":"应用","sys":"circ"},{"t":"q","n":65,"tp":"A1","s":"二尖瓣狭窄最具特征性的听诊体征是","o":[{"l":"A","x":"心尖部全收缩期吹风样杂音"},{"l":"B","x":"心尖部舒张中晚期隆隆样杂音"},{"l":"C","x":"胸骨左缘第2肋间连续性机器样杂音"},{"l":"D","x":"主动脉瓣区舒张期叹气样杂音"},{"l":"E","x":"胸骨左缘第3-4肋间喷射性收缩期杂音"}],"c":["B"],"ex":"二尖瓣狭窄特征性杂音：心尖部舒张中晚期低调隆隆样（雷鸣样）杂音，伴S₁亢进和开瓣音（瓣膜弹性尚好时）。A为二尖瓣关闭不全；C为动脉导管未闭；D为主动脉瓣关闭不全；E为肥厚型心肌病/主动脉瓣狭窄。","sr":"内科学第10版","bl":"记忆","sys":"circ"},{"t":"q","n":66,"tp":"A1","s":"慢性主动脉瓣关闭不全的周围血管征不包括","o":[{"l":"A","x":"水冲脉"},{"l":"B","x":"枪击音"},{"l":"C","x":"毛细血管搏动征"},{"l":"D","x":"奇脉"},{"l":"E","x":"点头征(De Musset征)"}],"c":["D"],"ex":"主动脉瓣关闭不全的周围血管征（脉压增大所致）包括水冲脉、枪击音、Duroziez双重音、毛细血管搏动征、点头征(De Musset征)、股动脉收缩压显著高于肱动脉(Hill征)等。D「奇脉」为心包填塞和缩窄性心包炎的体征（吸气时收缩压下降>10mmHg）。","sr":"内科学第10版","bl":"理解","sys":"circ"},{"t":"q","n":67,"tp":"A2","s":"患者男性，45岁。风湿性心脏病史。查体：心尖部可闻及全收缩期吹风样3/6级杂音，向左腋下传导。该杂音提示","o":[{"l":"A","x":"二尖瓣狭窄"},{"l":"B","x":"二尖瓣关闭不全"},{"l":"C","x":"主动脉瓣狭窄"},{"l":"D","x":"主动脉瓣关闭不全"},{"l":"E","x":"三尖瓣关闭不全"}],"c":["B"],"ex":"心尖部全收缩期吹风样杂音+向左腋下传导——典型二尖瓣关闭不全。二尖瓣狭窄为舒张期隆隆样杂音；主动脉瓣狭窄为胸骨右缘第2肋间收缩期喷射性杂音向颈部传导；主动脉瓣关闭不全为舒张期叹气样杂音胸骨左缘第3-4肋间。","sr":"内科学第10版","bl":"应用","sys":"circ"},{"t":"c","n":68,"cs":"患者女性，38岁。风湿性心脏病二尖瓣狭窄病史10年。近半年活动耐量明显下降，间断夜间阵发性呼吸困难。查体：二尖瓣面容，心尖部舒张期隆隆样杂音，P₂亢进。","sys":"circ"},{"t":"q","n":69,"tp":"A3","s":"该患者目前最可能的并发症是","o":[{"l":"A","x":"感染性心内膜炎"},{"l":"B","x":"心房颤动"},{"l":"C","x":"急性肺水肿"},{"l":"D","x":"体循环栓塞"},{"l":"E","x":"肺部感染"}],"c":["B"],"ex":"二尖瓣狭窄最常见的并发症为房颤：左房扩大→心房肌纤维化+电重构→房颤。表现为活动耐量下降（心输出量减少）、心悸。P₂亢进提示肺动脉高压，为MS继发改变。急性肺水肿可出现但患者目前未达此程度。","sr":"内科学第10版","bl":"应用","sys":"circ"},{"t":"q","n":70,"tp":"A3","s":"为预防该并发症最严重的后果（血栓栓塞），最重要的治疗措施是","o":[{"l":"A","x":"利尿剂减轻前负荷"},{"l":"B","x":"β受体阻滞剂控制心率"},{"l":"C","x":"地高辛增加心肌收缩力"},{"l":"D","x":"抗凝治疗（华法林/NOAC）"},{"l":"E","x":"经皮二尖瓣球囊扩张术"}],"c":["D"],"ex":"二尖瓣狭窄合并房颤→血栓栓塞风险显著增加（尤其脑卒中）。CHA₂DS₂-VASc评分指导下，中-高危患者必须抗凝治疗（华法林INR 2.0-3.0或NOAC）以预防血栓栓塞。瓣膜病合并房颤抗凝指征较非瓣膜病房颤更严格。","sr":"ESC 2024房颤指南·内科学第10版","bl":"应用","sys":"circ"},{"t":"q","n":71,"tp":"A1","s":"急性心包炎最具特征性的症状是","o":[{"l":"A","x":"心前区疼痛，与呼吸和体位相关"},{"l":"B","x":"阵发性夜间呼吸困难"},{"l":"C","x":"端坐呼吸"},{"l":"D","x":"晕厥发作"},{"l":"E","x":"咯血症状"}],"c":["A"],"ex":"急性心包炎的典型胸痛特点：锐痛、与呼吸相关（吸气加重）、前倾坐位可缓解、可放射至斜方肌嵴。区别于心肌缺血性胸痛（压榨性、与呼吸无关、硝酸甘油缓解）。其他选项为心衰（B/C）、心律失常（D）、肺栓塞（E）的表现。","sr":"内科学第10版","bl":"记忆","sys":"circ"},{"t":"q","n":72,"tp":"A1","s":"心包填塞(心脏压塞)的Beck三联征是","o":[{"l":"A","x":"高血压+心音遥远+颈静脉怒张"},{"l":"B","x":"低血压+心音增强+肝大"},{"l":"C","x":"低血压+心音增强+颈静脉塌陷"},{"l":"D","x":"高血压+心音增强+奇脉"},{"l":"E","x":"低血压+心音遥远+颈静脉怒张"}],"c":["E"],"ex":"Beck三联征：①低血压（心输出量减少）；②心音遥远（心包积液隔音）；③颈静脉怒张（静脉回流受阻）。+奇脉=心脏压塞的完整表现。","sr":"内科学第10版","bl":"记忆","sys":"circ"},{"t":"q","n":73,"tp":"A2","s":"患者男性，28岁。2周前感冒后出现胸骨后锐痛，前倾位缓解。查体可闻及心包摩擦音。ECG示广泛导联ST段弓背向下抬高。最可能的诊断是","o":[{"l":"A","x":"急性心肌梗死"},{"l":"B","x":"急性心包炎"},{"l":"C","x":"肺栓塞"},{"l":"D","x":"主动脉夹层"},{"l":"E","x":"自发性气胸"}],"c":["B"],"ex":"青年+感冒前驱史+体位相关性胸痛(前倾缓解)+心包摩擦音+广泛导联ST段弓背向下抬高——急性心包炎典型表现。AMI的ST段为弓背向上抬高且呈导联对应性改变；心包炎为广泛性弓背向下抬高+PR段压低。","sr":"内科学第10版","bl":"应用","sys":"circ"},{"t":"q","n":74,"tp":"判断","s":"缩窄性心包炎的特征性体征是Kussmaul征（吸气时颈静脉怒张加重）。","o":[{"l":"A","x":"正确"},{"l":"B","x":"错误"}],"c":["A"],"ex":"正确。Kussmaul征=吸气时颈静脉怒张反而加重（正常吸气时颈静脉塌陷），为缩窄性心包炎和限制型心肌病的特征性体征。机制：右心充盈受限→吸气时回心血量增加但右室不能相应扩张→颈静脉压反常升高。","sr":"内科学第10版","bl":"记忆","sys":"circ"},{"t":"q","n":75,"tp":"A1","s":"成人基础生命支持(BLS)中，胸外按压的深度为","o":[{"l":"A","x":"2-3cm"},{"l":"B","x":"3-4cm"},{"l":"C","x":"5cm"},{"l":"D","x":"6-7cm"},{"l":"E","x":"至少8cm"}],"c":["C"],"ex":"2025 AHA指南：成人胸外按压深度为至少5cm（约2英寸），不超过6cm。按压频率100-120次/分，保证胸廓充分回弹。2026年内科主治教材将此前'5-6cm'统一为'至少5cm'。","sr":"AHA 2025 CPR指南","bl":"记忆","sys":"circ"},{"t":"q","n":76,"tp":"A1","s":"成人基础生命支持中，胸外按压与通气的比例为","o":[{"l":"A","x":"15:1"},{"l":"B","x":"15:2"},{"l":"C","x":"30:1"},{"l":"D","x":"30:2"},{"l":"E","x":"持续按压不通气"}],"c":["D"],"ex":"成人单人/双人CPR按压通气比均为30:2。新生儿为3:1（如有指征）。强调持续高质量按压，尽量减少中断。2010年前曾为15:2，现统一为30:2。","sr":"AHA 2025 CPR指南","bl":"记忆","sys":"circ"},{"t":"q","n":77,"tp":"A2","s":"患者男性，55岁。突发意识丧失，大动脉搏动消失，呼吸停止。立即开始CPR。心电监护示心室颤动。下一步最关键的处理是","o":[{"l":"A","x":"继续胸外按压"},{"l":"B","x":"气管插管"},{"l":"C","x":"静脉注射肾上腺素"},{"l":"D","x":"立即电除颤"},{"l":"E","x":"静脉注射利多卡因"}],"c":["D"],"ex":"可电击心律（室颤/无脉性室速）→立即电除颤是最关键措施，每延迟1分钟除颤，存活率下降7-10%。CPR期间尽早除颤，除颤后立即继续CPR 2分钟再检查心律。肾上腺素在第二次除颤后使用。","sr":"AHA 2025 CPR指南","bl":"应用","sys":"circ"},{"t":"q","n":78,"tp":"X","s":"心脏骤停可电击心律包括","o":[{"l":"A","x":"心室颤动(VF)"},{"l":"B","x":"无脉性室性心动过速(pVT)"},{"l":"C","x":"心室停搏(asystole)"},{"l":"D","x":"无脉性电活动(PEA)"},{"l":"E","x":"心房颤动"}],"c":["A","B"],"ex":"可电击心律仅两种：心室颤动(VF)和无脉性室性心动过速(pVT)。心室停搏和PEA为不可电击心律，继续CPR+肾上腺素，不除颤。房颤如血流动力学不稳定也应电复律，但不属于心脏骤停范畴。","sr":"AHA 2025 CPR指南","bl":"记忆","sys":"circ"},{"t":"q","n":79,"tp":"A1","s":"主动脉夹层最典型的临床表现是","o":[{"l":"A","x":"胸骨后压榨性疼痛"},{"l":"B","x":"撕裂样或刀割样剧烈胸痛"},{"l":"C","x":"胸痛伴咯血"},{"l":"D","x":"胸痛伴发热"},{"l":"E","x":"胸痛伴上腹痛"}],"c":["B"],"ex":"主动脉夹层特征性表现为突发撕裂样或刀割样剧烈胸痛，疼痛一开始即达高峰，可沿主动脉走行放射（前胸→后背→腹部），常伴双侧血压不对称。心梗疼痛为压榨性、逐渐加重；肺栓塞伴咯血和呼吸困难。","sr":"内科学第10版","bl":"记忆","sys":"circ"},{"t":"q","n":80,"tp":"判断","s":"Stanford A型主动脉夹层（累及升主动脉）首选药物治疗而非手术。","o":[{"l":"A","x":"正确"},{"l":"B","x":"错误"}],"c":["B"],"ex":"错误。Stanford A型（累及升主动脉）→紧急外科手术！死亡率每小时增加1-2%，药物保守治疗死亡率极高。Stanford B型（仅累及降主动脉）无并发症者可药物治疗（控制血压心率）。","sr":"ESC 2014主动脉疾病指南","bl":"应用","sys":"circ"},{"t":"q","n":81,"tp":"A1","s":"根据红细胞形态，缺铁性贫血属于","o":[{"l":"A","x":"大细胞性贫血"},{"l":"B","x":"正细胞性贫血"},{"l":"C","x":"小细胞低色素性贫血"},{"l":"D","x":"单纯小细胞性贫血"},{"l":"E","x":"正细胞正色素性贫血"}],"c":["C"],"ex":"缺铁性贫血(IDA)为小细胞低色素性贫血：MCV＜80fl，MCH＜27pg，MCHC＜32%。大细胞性贫血(MCV>100fl)见于巨幼细胞贫血(叶酸/B12缺乏)；正细胞性贫血见于再障、溶血性贫血、急性失血。","sr":"内科学第10版","bl":"记忆","sys":"hema"},{"t":"q","n":82,"tp":"A1","s":"缺铁性贫血最可靠的诊断指标是","o":[{"l":"A","x":"血清铁蛋白降低"},{"l":"B","x":"总铁结合力升高"},{"l":"C","x":"血清铁降低"},{"l":"D","x":"转铁蛋白饱和度降低"},{"l":"E","x":"红细胞游离原卟啉升高"}],"c":["A"],"ex":"血清铁蛋白＜12μg/L是诊断IDA最敏感和特异的指标，反映体内储存铁耗竭。血清铁、转铁蛋白饱和度在慢性病贫血时也可降低（鉴别需铁蛋白）。骨髓铁染色（铁粒幼细胞减少或消失）为金标准但有创。","sr":"内科学第10版","bl":"理解","sys":"hema"},{"t":"q","n":83,"tp":"A2","s":"患者女性，32岁。月经量增多1年，近3个月头晕、乏力。查体：面色苍白，指甲变薄、脆、呈匙状。血常规：Hb 72g/L，MCV 68fl，MCH 22pg。最可能的诊断是","o":[{"l":"A","x":"巨幼细胞贫血"},{"l":"B","x":"再生障碍性贫血"},{"l":"C","x":"溶血性贫血"},{"l":"D","x":"缺铁性贫血"},{"l":"E","x":"地中海贫血"}],"c":["D"],"ex":"育龄女性+月经量增多（铁丢失增加）+小细胞低色素性贫血(MCV 68,MCH 22)+反甲（匙状甲特征性体征）=典型缺铁性贫血。巨幼贫为大细胞性(MCV>100)；再障为全血细胞减少；地中海贫血有家族史及靶形红细胞。","sr":"内科学第10版","bl":"应用","sys":"hema"},{"t":"q","n":84,"tp":"A1","s":"再生障碍性贫血最主要的发病机制是","o":[{"l":"A","x":"造血原料缺乏"},{"l":"B","x":"造血干细胞内在缺陷"},{"l":"C","x":"骨髓微环境异常"},{"l":"D","x":"免疫异常介导的造血干细胞损伤"},{"l":"E","x":"脾功能亢进"}],"c":["D"],"ex":"再障(AA)核心发病机制为T细胞免疫异常活化→攻击造血干细胞/祖细胞→骨髓造血衰竭。证据：IST（免疫抑制治疗，ATG+CsA）有效率达60-80%。A为缺铁性贫血/巨幼贫机制；B为先天性再障(Fanconi贫血)；C/E为次要/无关机制。","sr":"内科学第10版","bl":"理解","sys":"hema"},{"t":"q","n":85,"tp":"X","s":"再生障碍性贫血的典型血象特征包括","o":[{"l":"A","x":"全血细胞减少"},{"l":"B","x":"网织红细胞减少"},{"l":"C","x":"骨髓增生极度活跃"},{"l":"D","x":"淋巴细胞比例相对增高"},{"l":"E","x":"中性粒细胞减少"}],"c":["A","B","D","E"],"ex":"再障血象：①全血细胞减少（WBC、RBC、PLT均减少）；②网织红细胞减少（绝对值减少）；③淋巴细胞比例相对增高（因粒系、红系减少）；④中性粒细胞减少。C错误——再障骨髓为增生减低或重度减低（非活跃），此为白血病MDS特征。","sr":"内科学第10版","bl":"理解","sys":"hema"},{"t":"q","n":86,"tp":"A1","s":"急性白血病确诊的金标准检查是","o":[{"l":"A","x":"血常规"},{"l":"B","x":"骨髓穿刺+活检"},{"l":"C","x":"细胞化学染色"},{"l":"D","x":"免疫分型（流式细胞术）"},{"l":"E","x":"染色体核型分析"}],"c":["B"],"ex":"骨髓穿刺+活检是确诊白血病的金标准：骨髓原始细胞≥20%（WHO标准）即可诊断急性白血病。免疫分型、细胞化学染色、染色体核型用于进一步分型（AML/ALL及其亚型），但确诊基于骨髓形态学。","sr":"WHO 2022造血和淋巴组织肿瘤分类","bl":"记忆","sys":"hema"},{"t":"q","n":87,"tp":"A1","s":"特发性血小板减少性紫癜(ITP)的发病机制是","o":[{"l":"A","x":"骨髓巨核细胞生成障碍"},{"l":"B","x":"血小板消耗过多"},{"l":"C","x":"自身抗体介导的血小板破坏过多"},{"l":"D","x":"脾功能亢进"},{"l":"E","x":"血小板分布异常"}],"c":["C"],"ex":"ITP为自身免疫性疾病：产生抗血小板自身抗体（多为IgG型，靶抗原为GPⅡb/Ⅲa、GPⅠb/Ⅸ等）→致敏血小板被脾脏巨噬细胞Fc受体识别并破坏。骨髓巨核细胞正常或增多（代偿性），但成熟障碍。B为TTP/DIC机制。","sr":"内科学第10版","bl":"理解","sys":"hema"},{"t":"q","n":88,"tp":"A2","s":"患者女性，25岁。双下肢皮肤瘀点、瘀斑1周。无发热。血常规：Plt 18×10⁹/L，WBC和Hb正常。骨髓象：巨核细胞增多伴成熟障碍。最可能的诊断是","o":[{"l":"A","x":"ITP"},{"l":"B","x":"急性白血病"},{"l":"C","x":"再生障碍性贫血"},{"l":"D","x":"过敏性紫癜"},{"l":"E","x":"DIC"}],"c":["A"],"ex":"青年女性+皮肤出血+孤立性血小板减少(Plt 18)+WBC和Hb正常+骨髓巨核细胞增多伴成熟障碍=典型ITP。白血病WBC异常+骨髓原始细胞增多；再障全血细胞减少；过敏性紫癜Plt正常；DIC有原发病+多部位出血+凝血异常。","sr":"内科学第10版","bl":"应用","sys":"hema"},{"t":"q","n":89,"tp":"A1","s":"弥散性血管内凝血(DIC)实验室检查最具特征性的组合是","o":[{"l":"A","x":"PT延长+APTT延长+FIB升高+Plt升高"},{"l":"B","x":"血小板减少+PT/APTT延长+FIB降低+FDP/D-二聚体显著升高"},{"l":"C","x":"PT正常+APTT正常+FIB正常+D-二聚体正常"},{"l":"D","x":"PT缩短+APTT缩短+FIB升高+Plt升高"},{"l":"E","x":"PT延长+APTT正常+FIB正常+Plt正常"}],"c":["B"],"ex":"DIC特征性实验室改变：消耗性凝血障碍→Plt减少+PT/APTT延长+FIB降低+凝血因子消耗；继发性纤溶亢进→FDP和D-二聚体显著升高。D-二聚体显著升高是DIC区别于严重肝病的要点（肝病时D-二聚体正常或轻度升高）。","sr":"内科学第10版","bl":"理解","sys":"hema"},{"t":"q","n":90,"tp":"X","s":"过敏性紫癜的临床分型包括","o":[{"l":"A","x":"单纯型（皮肤型）"},{"l":"B","x":"腹型"},{"l":"C","x":"关节型"},{"l":"D","x":"肾型"},{"l":"E","x":"混合型"}],"c":["A","B","C","D","E"],"ex":"过敏性紫癜五型：①单纯型（皮肤紫癜为主）；②腹型（腹痛、消化道出血）；③关节型（关节肿痛）；④肾型（血尿、蛋白尿、肾炎）；⑤混合型（两型以上同时存在）。血小板计数正常是与ITP的关键鉴别。全选。","sr":"内科学第10版","bl":"记忆","sys":"hema"},{"t":"q","n":91,"tp":"A1","s":"骨髓增生异常综合征(MDS)的WHO诊断标准中，诊断急性髓系白血病(AML)的骨髓原始细胞阈值为","o":[{"l":"A","x":"≥5%"},{"l":"B","x":"≥10%"},{"l":"C","x":"≥15%"},{"l":"D","x":"≥20%"},{"l":"E","x":"≥30%"}],"c":["D"],"ex":"WHO标准：骨髓/外周血原始细胞≥20%即可诊断急性白血病（AML或ALL）。MDS时原始细胞＜20%。20%是MDS和AML的分界线。注意：WHO 2022分类中部分具有特定遗传学异常的AML即使原始细胞＜20%也可诊断。","sr":"WHO 2022造血和淋巴组织肿瘤分类","bl":"记忆","sys":"hema"},{"t":"q","n":92,"tp":"A1","s":"霍奇金淋巴瘤(HL)最具诊断意义的特征性细胞是","o":[{"l":"A","x":"原始粒细胞"},{"l":"B","x":"淋巴细胞"},{"l":"C","x":"泡沫细胞"},{"l":"D","x":"Auer小体"},{"l":"E","x":"Reed-Sternberg细胞(RS细胞)"}],"c":["E"],"ex":"RS细胞（镜影细胞）是霍奇金淋巴瘤的病理特征性细胞——双核或多核、核仁大而嗜酸性、呈「猫头鹰眼」样。Auer小体见于AML（尤其M2、M3）；原始粒细胞增多见于白血病；泡沫细胞见于动脉粥样硬化。","sr":"WHO 2022·内科学第10版","bl":"记忆","sys":"hema"},{"t":"q","n":93,"tp":"A2","s":"患者女性，28岁。皮肤瘀斑、牙龈出血1周。血常规：WBC 2.1×10⁹/L，Hb 68g/L，Plt 22×10⁹/L。骨髓象：早幼粒细胞占65%，可见Auer小体，PML-RARα融合基因阳性。最可能的诊断是","o":[{"l":"A","x":"急性早幼粒细胞白血病(APL/M3)"},{"l":"B","x":"急性淋巴细胞白血病(ALL)"},{"l":"C","x":"骨髓增生异常综合征(MDS)"},{"l":"D","x":"特发性血小板减少性紫癜(ITP)"},{"l":"E","x":"再生障碍性贫血"}],"c":["A"],"ex":"全血细胞减少+骨髓早幼粒细胞显著增多(65%)+Auer小体(多而长，呈「柴捆」状)+PML-RARα融合基因(t(15;17))=典型APL(M3)。APL为AML的特殊亚型，易并发DIC，用全反式维甲酸(ATRA)+砷剂治疗。","sr":"WHO 2022·内科学第10版","bl":"应用","sys":"hema"},{"t":"q","n":94,"tp":"A2","s":"患者男性，55岁。因「感染性休克」入院，治疗中出现全身多处皮肤瘀斑、静脉穿刺部位持续渗血。实验室检查：Plt 45×10⁹/L，PT 22s(对照13s)，APTT 55s(对照35s)，FIB 0.8g/L，D-二聚体＞20μg/mL。最可能的诊断是","o":[{"l":"A","x":"严重肝病"},{"l":"B","x":"弥散性血管内凝血(DIC)"},{"l":"C","x":"维生素K缺乏症"},{"l":"D","x":"原发性纤溶亢进"},{"l":"E","x":"血友病A"}],"c":["B"],"ex":"感染性休克(原发病)→多部位出血+Plt减少+PT/APTT延长+FIB降低(消耗性凝血障碍)+D-二聚体显著升高(继发性纤溶亢进)=典型DIC。严重肝病D-二聚体正常或轻度升高(鉴别要点)；维生素K缺乏PT延长为主且Plt正常。","sr":"内科学第10版","bl":"应用","sys":"hema"}];

var TOTAL = 0;
for(var i=0;i<data.length;i++) if(data[i].t==='q') TOTAL++;

var state = {answered:{}, correct:0, wrong:0, selected:{}, currentFilter:'all'};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function tc(t){
  var m={A1:'A1',A2:'A2',A3:'A3',A4:'A4',B1:'B1',X:'X',pd:'判断'};
  return m[t]||t;
}

function updateBar(){
  var a=state.correct+state.wrong, visible=0;
  document.querySelectorAll('.question').forEach(function(q){if(q.style.display!=='none') visible++;});
  var dispTotal = (state.currentFilter==='all') ? TOTAL : document.querySelectorAll('.question[data-sys="'+state.currentFilter+'"]').length;
  document.getElementById('cc').textContent=state.correct;
  document.getElementById('wc').textContent=state.wrong;
  document.getElementById('sp').textContent=dispTotal>0?Math.round(state.correct/Math.max(1,state.correct+state.wrong)*100)+'%':'0%';
  document.getElementById('pbar').style.width=(a/TOTAL*100)+'%';
  document.getElementById('plabel').textContent=a+'/'+TOTAL;
  if(a===TOTAL&&state.wrong===0) document.getElementById('pbar').style.background='#059669';
  else if(a===TOTAL) document.getElementById('pbar').style.background='#eab308';
}

function arraysEqual(a,b){
  if(a.length!==b.length) return false;
  var sa=a.slice().sort(), sb=b.slice().sort();
  for(var i=0;i<sa.length;i++) if(sa[i]!==sb[i]) return false;
  return true;
}

function finishQuestion(idx,isOk,correct,userLabels){
  state.answered[idx]=true;
  var q=data[idx];
  if(isOk) state.correct++; else state.wrong++;
  var qDiv=document.getElementById('q'+idx);
  var opts=qDiv.querySelectorAll('.option');
  var panel=document.getElementById('p'+idx);
  if(isOk){
    qDiv.classList.add('correct');
    panel.classList.add('open','ok');
    panel.firstChild.className='ans-head green';
    panel.firstChild.textContent='✅ 回答正确！答案：'+correct.join(', ');
  }else{
    qDiv.classList.add('wrong');
    panel.classList.add('open','no');
    panel.firstChild.className='ans-head red';
    panel.firstChild.textContent='❌ 回答错误！正确答案：'+correct.join(', ');
  }
  for(var k=0;k<opts.length;k++){
    var o=opts[k], ol=o.getAttribute('data-l');
    o.classList.add('no-click');
    if(correct.indexOf(ol)>=0){
      o.classList.add('correct-show');
      o.lastChild.classList.add('show'); o.lastChild.textContent='✓';
    }
    if(userLabels.indexOf(ol)>=0&&!isOk){
      o.classList.add('wrong-pick');
      o.lastChild.classList.add('show'); o.lastChild.textContent='✗';
    }
  }
  updateBar();
  setTimeout(function(){
    for(var j=idx+1;j<data.length;j++){
      if(data[j].t==='q'&&!state.answered[j]){
        var n=document.getElementById('q'+j);
        if(n&&n.style.display!=='none'){ n.scrollIntoView({behavior:'smooth',block:'center'}); break; }
      }
    }
  },350);
}

function pick(idx,label){
  if(state.answered[idx]) return;
  var q=data[idx], correct=q.c;
  if(q.tp==='X'){
    if(!state.selected[idx]) state.selected[idx]=[];
    var sel=state.selected[idx], pos=sel.indexOf(label);
    if(pos>=0){
      sel.splice(pos,1);
      document.querySelector('#q'+idx+' .option[data-l="'+label+'"]').classList.remove('picked');
    }else{
      sel.push(label);
      document.querySelector('#q'+idx+' .option[data-l="'+label+'"]').classList.add('picked');
    }
    if(sel.length===correct.length){
      var isOk=arraysEqual(sel,correct);
      finishQuestion(idx,isOk,correct,sel.slice());
    }
    return;
  }
  var isOk=correct.indexOf(label)>=0;
  finishQuestion(idx,isOk,correct,[label]);
}

function reset(){
  state={answered:{},correct:0,wrong:0,selected:{},currentFilter:state.currentFilter};
  document.querySelectorAll('.question').forEach(function(q){q.classList.remove('correct','wrong');});
  document.querySelectorAll('.option').forEach(function(o){
    o.classList.remove('no-click','correct-show','wrong-pick','picked');
    o.lastChild.classList.remove('show'); o.lastChild.textContent='';
  });
  document.querySelectorAll('.answer-box').forEach(function(p){p.classList.remove('open','ok','no');});
  document.getElementById('pbar').style.background='#059669';
  updateBar();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showAll(){
  document.querySelectorAll('.answer-box').forEach(function(p){p.classList.add('open');});
}

function filterSys(sys){
  state.currentFilter=sys;
  document.querySelectorAll('.system-tag').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.system-tag').forEach(function(t){
    if(t.textContent.indexOf(sys==='all'?'全部':sys==='resp'?'呼吸':sys==='circ'?'循环':'血液')>=0) t.classList.add('active');
  });
  document.querySelectorAll('.question').forEach(function(q){
    q.style.display=(sys==='all'||q.getAttribute('data-sys')===sys)?'':'none';
  });
  document.querySelectorAll('.case-group').forEach(function(g){
    var vis=false;
    g.querySelectorAll('.question').forEach(function(q){if(q.style.display!=='none') vis=true;});
    g.style.display=vis?'':'none';
  });
  updateBar();
}

function scrollToSys(sys){
  filterSys(sys);
  var first=document.querySelector('.question[data-sys="'+sys+'"]');
  if(first) first.scrollIntoView({behavior:'smooth',block:'start'});
}

function render(){
  var root=document.getElementById('quiz-root');
  var h='', caseOpen=false, realNum=0, currentSys='';
  var sysNames={'resp':'🫁 呼吸系统疾病','circ':'🫀 循环系统疾病','hema':'🩸 血液和造血系统疾病'};
  var sysCounts={'resp':0,'circ':0,'hema':0};
  for(var i=0;i<data.length;i++) if(data[i].t==='q'&&data[i].sys) sysCounts[data[i].sys]++;

  for(var i=0;i<data.length;i++){
    var q=data[i];
    if(q.t==='c'){
      if(caseOpen) h+='</div>';
      if(currentSys!==q.sys){ currentSys=q.sys; h+='<div class="system-section"><div class="system-head"><span class="icon">'+sysNames[q.sys].charAt(0)+'</span>'+sysNames[q.sys]+'<span class="count">('+sysCounts[q.sys]+'题)</span></div></div>'; }
      h+='<div class="case-group" data-sys="'+q.sys+'"><div class="case-header"><span class="case-label">📋 病例 '+q.n+'</span> &nbsp;'+esc(q.cs)+'</div>';
      caseOpen=true;
    }else{
      realNum++;
      if(currentSys!==q.sys){
        currentSys=q.sys;
        h+='<div class="system-section"><div class="system-head"><span class="icon">'+sysNames[q.sys].charAt(0)+'</span>'+sysNames[q.sys]+'<span class="count">('+sysCounts[q.sys]+'题)</span></div></div>';
      }
      var isX=q.tp==='X';
      h+='<div class="question" id="q'+i+'" data-sys="'+q.sys+'">';
      h+='<div class="q-header">';
      h+='<span class="q-num">'+realNum+'</span><span class="q-type '+q.tp+'">'+tc(q.tp)+'</span>';
      h+='<span class="q-bl">'+q.bl+'</span>';
      if(isX) h+=' <span style="font-size:11px;color:#7c3aed;font-weight:600">(多选——点击切换选择，选够'+q.c.length+'个自动提交)</span>';
      h+='</div>';
      h+='<div class="q-stem">'+esc(q.s)+'</div>';
      if(q.tp==='B1'&&q.o){
        h+='<div class="b1-box"><span class="b1-label">🔗 共用选项：</span> ';
        var parts=[];
        for(var k=0;k<q.o.length;k++) parts.push(q.o[k].l+'. '+esc(q.o[k].x));
        h+=parts.join(' | ');
        h+='</div>';
      }else if(q.o){
        h+='<div class="options">';
        for(var k=0;k<q.o.length;k++){
          var o=q.o[k];
          h+='<div class="option" data-l="'+o.l+'" onclick="Quiz.pick('+i+',\''+o.l+'\')">';
          h+='<span class="opt-label">'+o.l+'.</span><span>'+esc(o.x)+'</span>';
          h+='<span class="result-icon">✓</span></div>';
        }
        h+='</div>';
      }
      h+='<div class="answer-box" id="p'+i+'">';
      h+='<div class="ans-head">✅ 答案：'+q.c.join(', ')+' | '+tc(q.tp)+' | '+q.bl+'</div>';
      h+='<div class="exp">'+esc(q.ex)+'</div>';
      if(q.sr) h+='<div class="src">📖 '+esc(q.sr)+'</div>';
      h+='</div></div>';
    }
  }
  if(caseOpen) h+='</div>';
  root.innerHTML=h;
}

render();
Tree.build(data);
updateBar();

// Scroll-based topbar collapse
var lastScroll = 0, barEl = document.getElementById('topbar'), ticking = false;
function toggleBar(){ barEl.classList.toggle('collapsed'); document.body.classList.toggle('narrow'); }
window.addEventListener('scroll', function(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    var st = window.pageYOffset || document.documentElement.scrollTop;
    if(st > 120 && st > lastScroll){
      barEl.classList.add('collapsed'); document.body.classList.add('narrow');
    } else if(st < lastScroll - 10){
      barEl.classList.remove('collapsed'); document.body.classList.remove('narrow');
    }
    lastScroll = st <= 0 ? 0 : st;
    ticking = false;
  });
}, {passive:true});

return {pick:pick, reset:reset, showAll:showAll, updateBar:updateBar, filterSys:filterSys, scrollToSys:scrollToSys, toggleBar:toggleBar};
})();
</script>
</body>
