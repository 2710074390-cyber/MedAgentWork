type: grid
title: 休克临床分期·表现与估计失血量
subtitle: 急诊与灾难医学 M5 休克（确定性图谱通道）
cols: 3
output: annotated/09_休克临床分期与失血量.png
webp: images_webp/09_休克临床分期与失血量.webp
items:
  - title: 代偿期（轻度）
    color: green
    lines:
      - 神志清楚、痛苦表情、紧张
      - 皮肤开始苍白、正常发凉
      - 脉<100次/分、尚有力
      - 收缩正常或稍升、脉压缩小
      - 尿量正常或减少
      - 估计失血<20%（<800ml）
  - title: 失代偿期（中度）
    color: orange
    lines:
      - 神志清楚、表情淡漠
      - 皮肤苍白、发冷
      - 脉100~200次/分
      - 收缩压70~90mmHg、脉压小
      - 少尿
      - 估计失血20%~40%（800~1600ml）
  - title: 失代偿期（重度）
    color: red
    lines:
      - 神志模糊、甚至昏迷
      - 显著苍白、肢端青紫、厥冷
      - 脉速而细弱或摸不清
      - 收缩压<70或测不到
      - 少尿或无尿
      - 估计失血>40%（>1600ml）
note: 内容依据人卫《急诊与灾难医学》第3版；render_diagram.py 确定性渲染，文字与结构可复核
