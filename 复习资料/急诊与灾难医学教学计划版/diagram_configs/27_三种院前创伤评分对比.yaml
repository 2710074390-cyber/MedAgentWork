type: grid
title: 三种院前创伤评分对比
subtitle: 急诊与灾难医学 M9 创伤评分（教材表9-1）
cols: 3
output: annotated/27_三种院前创伤评分对比.png
webp: images_webp/27_三种院前创伤评分对比.webp
items:
  - title: 创伤指数（TI）
    color: blue
    lines:
      - 指标：部位/类型/循环/意识/呼吸（1、3、5、6分）
      - 分级：5~7轻；8~17中重；>17极重（死亡率≈50%）
      - TI>10 送创伤中心
  - title: CRMAS
    color: green
    lines:
      - 指标：循环/呼吸/胸腹/运动/语言（0~2分）
      - 分级：9~10轻；7~8重；≤6极重
      - 现场快速分级
  - title: 创伤评分（TS）
    color: orange
    lines:
      - 指标：GCS/呼吸频率/呼吸困难/收缩压/毛细血管充盈（0~5分）
      - 分级：14~16轻（存活96%）；4~13经治可存活；1~3重（死亡96%）
      - 含 GCS，判定生理紊乱
note: 内容依据人卫《急诊与灾难医学》第3版（教材P248-249）；本图由 render_diagram.py 确定性渲染
