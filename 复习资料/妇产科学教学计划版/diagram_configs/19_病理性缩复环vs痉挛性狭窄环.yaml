type: compare
title: 病理性缩复环 vs 子宫痉挛性狭窄环
subtitle: 妇产科学 M5 异常分娩（确定性图谱通道）
output: annotated/19_病理性缩复环vs痉挛性狭窄环.png
webp: images_webp/19_病理性缩复环vs痉挛性狭窄环.webp
items:
  - title: 病理性缩复环
    color: red
    lines:
      - 位于子宫下段
      - 随宫缩逐渐上升、平脐或脐上
      - 环处压痛明显
      - 伴强直性宫缩、血尿
      - ＝先兆子宫破裂征象
      - 处理：抑制宫缩＋尽快剖宫产
  - title: 子宫痉挛性狭窄环
    color: blue
    lines:
      - 局部平滑肌持续不放松
      - 位于胎体狭窄部及上下段交界处
      - 不随宫缩上升
      - 多因精神紧张/疲劳/不当缩宫剂
      - 第三产程易致胎盘嵌顿
      - 处理：停操作＋停缩宫剂＋宫缩抑制剂
note: 内容依据人卫《妇产科学》第9版；render_diagram.py 确定性渲染，文字与结构可复核
