type: compare
title: 子宫内膜异位症 vs 子宫腺肌病
subtitle: 妇产科学 M10 子宫内膜异位性疾病（确定性图谱通道）
output: annotated/28_内异症vs腺肌病.png
webp: images_webp/28_内异症vs腺肌病.webp
items:
  - title: 子宫内膜异位症
    color: blue
    lines:
      - 内膜腺体+间质出现于子宫体以外
      - 好发卵巢（巧克力囊肿）、骶韧带
      - 继发进行性痛经＋不孕＋性交痛
      - 子宫可后倾固定、附件触痛结节
      - 对孕激素有反应
      - 腹腔镜确诊
  - title: 子宫腺肌病
    color: red
    lines:
      - 内膜腺体+间质侵入子宫肌层
      - 经量过多＋经期延长＋进行性痛经
      - 子宫均匀增大、质硬、经期压痛甚
      - 对孕激素无反应
      - 病理诊断为金标准
      - 无根治性药物
note: 内容依据人卫《妇产科学》第9版；render_diagram.py 确定性渲染，文字与结构可复核
