type: compare
title: 妇科检查三法对比
subtitle: 妇产科学 M15 · 第16章 P221-223
output: annotated/41_妇科检查三法对比.png
webp: images_webp/41_妇科检查三法对比.webp
items:
  - title: 双合诊
    color: blue
    lines:
      - 手指配置：阴道两指＋腹壁一手
      - 查：阴道 / 宫颈 / 宫体（位置·大小·软硬·活动度·压痛）与附件
      - 正常卵巢偶可触及、正常输卵管不能触及
      - 地位：妇科检查中最重要的项目，常规首选
  - title: 三合诊
    color: teal
    lines:
      - 手指配置：阴道一指＋直肠一指＋腹壁一手
      - 查：后倾后屈子宫、子宫后壁、宫颈旁、直肠子宫陷凹、骶韧带及盆壁
      - 双合诊不足时的重要补充
      - 肿瘤 / 结核 / 内异症 / 炎症尤显重要
  - title: 直肠-腹部诊
    color: gray
    lines:
      - 手指配置：直肠一指＋腹壁一手
      - 用于：无性生活史、阴道闭锁或不宜行双合诊者
      - 记录按解剖部位顺序：外阴→阴道→宫颈→宫体→附件
note: 内容依据人卫《妇产科学（第10版）》P221-223；本图由 render_diagram.py 确定性渲染，文字与结构可复核
