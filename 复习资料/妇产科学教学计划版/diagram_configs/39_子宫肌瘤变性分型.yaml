type: grid
title: 子宫肌瘤变性分型
subtitle: 妇产科学 M11（按变性类型与临床意义）
cols: 3
output: annotated/39_子宫肌瘤变性分型.png
webp: images_webp/39_子宫肌瘤变性分型.webp
items:
  - title: 玻璃样变
    color: blue
    lines:
      - 最常见
      - 均匀透明、无结构胶原
  - title: 囊性变
    color: teal
    lines:
      - 玻璃样变基础上液化
      - 形成囊腔
  - title: 钙化
    color: green
    lines:
      - 蒂小、血供不足的浆膜下肌瘤
      - 绝经后多见
  - title: 红色变性
    color: red
    lines:
      - 妊娠期或产褥期特殊坏死
      - 剧烈腹痛+恶心呕吐+发热+WBC↑
      - 保守治疗为主
  - title: 肉瘤变
    color: purple
    lines:
      - 发生率仅 0.4%~0.8%
      - 绝经后增大应警惕→手术
note: 内容依据人卫《妇产科学》第9版；本图由 render_diagram.py 确定性渲染
