      - 三阶梯：HPV/细胞学→阴道镜→活检
  - title: 子宫内膜癌
    color: red
    lines:
      - 好发子宫内膜（宫体）
      - 病因：无孕激素拮抗的雌激素
      - 内膜样癌占80%~90%
      - 典型：绝经后自发阴道流血
      - 绝经后60岁上下
      - 转移：淋巴为主
      - 分段诊刮为金标准
