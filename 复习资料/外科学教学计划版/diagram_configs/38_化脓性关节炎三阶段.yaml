type: compare
title: 化脓性关节炎三阶段
subtitle: 外科学（二）M8 骨与关节化脓性感染（按滑膜渗出→软骨破坏）
output: annotated/38_化脓性关节炎三阶段.png
webp: images_webp/38_化脓性关节炎三阶段.webp
items:
  - title: 浆液性渗出期（可逆）
    color: green
    lines:
      - 滑膜充血水肿、白细胞浸润
      - 关节软骨未破坏
      - 治疗及时可完全吸收、无功能障碍
  - title: 浆液纤维素性渗出期（部分不可逆）
    color: orange
    lines:
      - 渗出混浊黏稠、纤维蛋白沉积软骨
      - 溶酶体破坏软骨基质
      - 可致粘连与功能障碍
  - title: 脓性渗出期（不可逆）
    color: red
    lines:
      - 真性脓性渗出
      - 软骨广泛破坏、侵犯软骨下骨
      - 修复后重度粘连→纤维性/骨性强直
note: 内容依据人卫《外科学》第9版（教材P735-736）；多见于儿童、好发髋膝关节、金葡菌约85%，确诊=关节腔穿刺+关节液检查；本图由 render_diagram.py 确定性渲染
