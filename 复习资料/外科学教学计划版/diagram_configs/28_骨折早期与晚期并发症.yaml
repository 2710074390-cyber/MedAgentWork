type: compare
title: 骨折早期并发症 vs 晚期并发症
subtitle: 外科学（二）M7 骨折、关节损伤、脊柱脊髓损伤、骨盆骨折（确定性图谱通道）
output: annotated/28_骨折早期与晚期并发症.png
webp: images_webp/28_骨折早期与晚期并发症.webp
items:
  - title: 早期并发症（即刻～1 周内）
    color: red
    lines:
      - 全身：休克、脂肪栓塞综合征
      - 血管：腘动脉/肱动脉/胫前后动脉损伤
      - 神经：桡/腓总/腋神经、脊髓损伤
      - 骨筋膜隔室综合征
      - 内脏损伤
  - title: 晚期并发症（愈合期/制动后）
    color: orange
    lines:
      - 坠积性肺炎、压疮、下肢深静脉血栓
      - 缺血性肌挛缩（爪形手/足）
      - 骨化性肌炎（肘多见）
      - 缺血性骨坏死（腕舟骨/股骨头）
      - 创伤性关节炎、关节僵硬
note: 内容依据人卫《外科学》第9版；render_diagram.py 确定性渲染，文字与结构可复核
