type: compare
title: 前尿道与后尿道损伤鉴别
subtitle: 外科学（二）M6 泌尿系统疾病（确定性图谱通道）
output: annotated/23_前后尿道损伤鉴别.png
webp: images_webp/23_前后尿道损伤鉴别.webp
items:
  - title: 前尿道（球部）损伤
    color: blue
    lines:
      - 损伤机制：会阴部骑跨伤
      - 会阴、阴囊蝶形血肿
      - 尿道外口鲜血滴溢（最常见）
      - 休克较少见
      - 尿外渗限会阴、阴囊（浅筋膜）
      - 导尿失败→耻骨上膀胱造瘘＋尿道成形/端端吻合
  - title: 后尿道（膜部/前列腺部）损伤
    color: red
    lines:
      - 损伤机制：骨盆骨折
      - 耻骨后血肿（前列腺周围）
      - 尿道口无或仅有少量血
      - 休克常见（合并大出血）
      - 尿外渗入耻骨后间隙、膀胱周围
      - 直肠指诊前列腺尖端浮动
      - 耻骨上膀胱造瘘＋尿道会师复位术
note: 内容依据人卫《外科学》第9版；render_diagram.py 确定性渲染，文字与结构可复核
