type: compare
title: 腹股沟斜疝、直疝与股疝鉴别
subtitle: 外科学（二）M2 腹外疝（确定性图谱通道）
output: annotated/02_斜疝直疝股疝鉴别.png
webp: images_webp/02_斜疝直疝股疝鉴别.webp
items:
  - title: 腹股沟斜疝
    color: blue
    lines:
      - 经腹股沟管内环（深环）突出
      - 疝囊颈在腹壁下动脉外侧
      - 可经腹股沟管进入阴囊
      - 回纳后压住内环，疝块不再突出
      - 多见于儿童与青壮年
  - title: 腹股沟直疝
    color: orange
    lines:
      - 经直疝三角（Hesselbach）突出
      - 疝囊颈在腹壁下动脉内侧
      - 不进入阴囊
      - 压住内环，疝块仍可突出
      - 多见于老年体弱者
  - title: 股疝
    color: red
    lines:
      - 经股管向下、自卵圆窝突出
      - 位于腹股沟韧带下方
      - 疝块较小，半球形
      - 最易嵌顿（约 40%~60%）
      - 多见于中年以上女性
note: 内容依据人卫《外科学》第9版；render_diagram.py 确定性渲染，文字与结构可复核
