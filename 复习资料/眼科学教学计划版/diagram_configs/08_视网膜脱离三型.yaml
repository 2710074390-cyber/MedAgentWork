type: compare
title: 视网膜脱离三型鉴别
subtitle: 眼科学 M8 视网膜疾病（确定性图谱通道）
output: annotated/08_视网膜脱离三型.png
webp: images_webp/08_视网膜脱离三型.webp
items:
  - title: 孔源性
    color: blue
    lines:
      - "机制: 视网膜裂孔+液流进入视网膜下"
      - "诱因: 高度近视/外伤/老年"
      - "特征: 闪光感→眼前黑影→视野缺损"
      - "检查: 裂孔（马蹄形/圆形）"
      - "治疗: 激光/冷凝封闭裂孔+巩膜扣带/玻切"
  - title: 牵拉性
    color: orange
    lines:
      - "机制: 玻璃体视网膜增殖条索牵拉"
      - "诱因: 糖尿病PDR/眼外伤/炎症"
      - "特征: 视力渐进下降、无裂孔"
      - "检查: 增殖膜+牵拉嵴"
      - "治疗: 玻璃体切割+增殖膜剥离"
  - title: 渗出性
    color: purple
    lines:
      - "机制: 脉络膜渗出液积聚视网膜下"
      - "诱因: 脉络膜炎症/肿瘤/高血压"
      - "特征: 脱离位置随体位移动（可移动）"
      - "检查: 超声/造影见渗出源，无裂孔"
      - "治疗: 治原发病（抗炎/抗肿瘤）"
note: 内容依据人卫《眼科学》第10版（范先群/颜华）M8；三型均需与「飞蚊症/玻璃体后脱离」鉴别；render_diagram.py确定性渲染
