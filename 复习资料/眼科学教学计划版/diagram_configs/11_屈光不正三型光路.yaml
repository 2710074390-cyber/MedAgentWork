type: compare
title: 屈光不正三型鉴别
subtitle: 眼科学 M9 屈光不正（确定性图谱通道）
output: annotated/11_屈光不正三型光路.png
webp: images_webp/11_屈光不正三型光路.webp
items:
  - title: 近视
    color: blue
    lines:
      - "原因: 眼轴过长/屈光力过强"
      - "成像: 平行光聚焦于视网膜前"
      - "表现: 看近清楚、看远模糊"
      - "矫正: 凹透镜（负球镜）"
  - title: 远视
    color: orange
    lines:
      - "原因: 眼轴过短/屈光力不足"
      - "成像: 平行光聚焦于视网膜后"
      - "表现: 远近均模糊，看近更明显"
      - "矫正: 凸透镜（正球镜）"
  - title: 散光
    color: purple
    lines:
      - "原因: 角膜/晶状体各子午线屈光力不同"
      - "成像: 不能聚焦为一点（弥散环）"
      - "表现: 视物变形、重影、易疲劳"
      - "矫正: 柱镜（圆柱镜）"
note: 内容依据人卫《眼科学》第10版（范先群/颜华）M9；老视为晶状体调节力下降，不属屈光不正三型；render_diagram.py确定性渲染
