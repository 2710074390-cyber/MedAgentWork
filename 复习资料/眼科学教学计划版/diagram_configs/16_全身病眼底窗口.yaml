type: grid
title: 全身病眼底窗口
subtitle: 眼科学 M10 高血压与糖尿病眼底表现（确定性图谱通道）
cols: 2
output: annotated/16_全身病眼底窗口.png
webp: images_webp/16_全身病眼底窗口.webp
items:
  - title: 高血压视网膜病变（K-W分级）
    color: red
    lines:
      - "Ⅰ级: 视网膜动脉变细/反光增强"
      - "Ⅱ级: 动静脉交叉压迫征"
      - "Ⅲ级: 出血+渗出+棉絮斑"
      - "Ⅳ级: 视盘水肿（恶性高血压）"
  - title: 糖尿病视网膜病变
    color: orange
    lines:
      - "微动脉瘤→出血/硬性渗出"
      - "棉絮斑（Ⅲ期）"
      - "新生血管→玻璃体积血→牵拉脱离"
      - "血糖/血压/血脂三控+定期眼底检查"
note: 内容依据人卫《眼科学》第10版（范先群/颜华）M10；眼底是高血压/糖尿病的「窗口」；render_diagram.py确定性渲染
