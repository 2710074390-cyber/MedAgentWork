type: grid
title: 红眼五病鉴别决策树
subtitle: 眼科学 M3-M7 红眼鉴别轴线（确定性图谱通道）
cols: 2
output: annotated/03_红眼五病鉴别决策树.png
webp: images_webp/03_红眼五病鉴别决策树.webp
items:
  - title: 急性结膜炎
    color: blue
    lines:
      - "分泌物: 水样/黏液脓性多"
      - "充血: 结膜弥漫充血"
      - "视力: 多正常"
      - "瞳孔/前房: 正常、清"
      - "眼压: 正常"
      - "处理: 抗生素/抗病毒滴眼液"
  - title: 急性角膜炎（角膜溃疡）
    color: teal
    lines:
      - "症状: 眼痛+畏光+流泪"
      - "充血: 睫状充血为主"
      - "角膜: 浸润/溃疡/混浊"
      - "视力: 明显下降"
      - "前房: 可积脓（前房积脓）"
      - "处理: 病原学+抗感染，防穿孔"
  - title: 急性前葡萄膜炎（虹睫炎）
    color: orange
    lines:
      - "症状: 眼痛畏光流泪"
      - "体征: 睫状充血+尘状KP"
      - "前房: 闪辉+前房细胞（可积脓）"
      - "瞳孔: 缩小、虹膜后粘连"
      - "眼压: 正常或偏低"
      - "处理: 扩瞳（后马托品/阿托品）+糖皮质激素"
  - title: 急性闭角型青光眼
    color: red
    lines:
      - "症状: 剧烈眼痛+头痛恶心呕吐"
      - "视觉: 雾视、虹视"
      - "角膜: 水肿（哈气样）"
      - "前房: 浅、房角关闭"
      - "瞳孔: 散大固定（竖椭圆形）"
      - "眼压: 骤升（可达50mmHg以上）"
note: 内容依据人卫《眼科学》第10版（范先群/颜华）M3/M4/M5/M7；render_diagram.py确定性渲染
