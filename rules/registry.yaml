# 已失效的条款标「已废止」并保留为别名（grep 旧编号仍能命中）。
#
# 判定依据见 `python scripts/hc_audit.py`：活定义 ≥2 才算编号事故。
# 2026-11-02 治理后 output = duplicate 0 / orphan 0。
duplicate_numbers: []
resolved_numbers:
