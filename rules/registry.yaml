# MedAgentWork 规则单一事实来源（SSOT）注册表
#
# 目的：把散落在 SOUL.md、提示词、validate_options.py、check_learning_value.py、
#       gate_check.py、quality_policy.json、pipeline.yaml 中的规则收敛成一张可 lint、
#       可渲染、可被门禁消费的清单。
#
# 约束：
#   1. 本文件是「规则语义」的唯一事实来源；代码里的判定逻辑仍以 detector 指向的实现为准。
#   2. 只登记，不改行为。任何行为变更必须走 detectors 指向的代码 PR + golden set 回归。
#   3. 历史批次（batch046 及以前）只读体检，不受本表新增条目影响。
#
# 关联：P1-S1（清单）→ P1-S2（lint/渲染）→ P1-S3（config_keys）→ P1-S5（lineage）

schema_version: 1
registry_version: "1.0.0"
updated_at: "2026-11-02"
owner: medagentwork
scope_note: "本表只覆盖「判定规则」，不含用户数据相关条款（本项目硬约束：零用户数据）。"

# ── 事实来源 ────────────────────────────────────────────────
sources:
  SOUL:
    path: SOUL.md
    kind: doc
  PROMPT:
    path: Prompt版本/MedGen_current_prompt.md
    kind: prompt
  VALIDATE:
    path: validate_options.py
    kind: code
  LV:
    path: scripts/check_learning_value.py
    kind: code
  GATE:
    path: gate_check.py
    kind: code
  POLICY:
    path: scripts/quality_policy.json
    kind: config
  CONFIG:
    path: scripts/pipeline.yaml
    kind: config
  SCHEMA:
    path: schemas/agent2_output.schema.json
    kind: contract

# ── 判定规则 ────────────────────────────────────────────────
#
# 字段说明
#   id         全局唯一 ID（本表主键，永不复用）
#   aliases    旧编号/别名（如 R1、HC-20），必须全局唯一
#   kind       item 单题 / group 组题 / file 文件级 / batch 批次级 / gate 阶段门禁 / process 流程约束
#   severity   hard 违规即阻断 / soft 告警 / process 无机器判定，靠编排与人工
#   detector   type: python（file+symbol[+tag]）/ command（cmd）/ semantic（无实现，需人工评审）
#   target     被约束的字段名（用于 lint 检测同字段双向约束）
#   direction  min / max / eq / set（配 target 使用）
#   range_with 声明与哪条规则构成区间（min+max 配对），避免误判为双向冲突
#   source_refs 出处（文件:行号 或 章节）
#   status     active / deprecated / draft

rules:

  # ── 单题结构规则 R1–R13（validate_options.py）────────────────
  - id: R-ITEM-FORBIDDEN
    aliases: [R1]
    title: 禁止项与绝对化用语
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r1_forbidden, engine: basic}
    source_refs: ["scripts/validate/rules_numeric.py:19", "SOUL.md:65"]
    status: active
    notes: "「以上都是/都不是」变体 = FAIL；绝对化用语 = WARN，故本条目实际含 hard+soft 双档，门禁取 FAIL。"

  - id: R-ITEM-LENRATIO
    aliases: [R2]
    title: 正确选项与最短干扰项长度比
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r2_length_ratio, engine: basic}
    target: option_len_ratio
    direction: max
    source_refs: ["scripts/validate/rules_numeric.py:46", "SOUL.md:65"]
    status: active
    notes: "阈值 r2_ratio_fail=2.0 / r2_ratio_warn=1.5，见 config_keys。"

  - id: R-ITEM-NUMSORT
    aliases: [R3]
    title: 数值选项排序
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r3_numeric_sort, engine: basic}
    source_refs: ["scripts/validate/rules_numeric.py:90", "SOUL.md:65"]
    status: active

  - id: R-ITEM-NEGBOLD
    aliases: [R4]
    title: 否定词加粗
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r4_negation_bold, engine: basic}
    source_refs: ["scripts/validate/rules_numeric.py:117", "SOUL.md:65"]
    status: active

  - id: R-ITEM-OPTCOUNT
    aliases: [R5]
    title: 选项数量
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r5_option_count, engine: basic}
    source_refs: ["scripts/validate/rules_numeric.py:139", "SOUL.md:65"]
    status: active
    notes: "工作指令 §0.5 明确「R5 从 5 选项改 3 选项」属需用户决策事项，本次不动。"

  - id: R-ITEM-NUMDISCRIM
    aliases: [R6]
    title: 数值型干扰项区分度（≤5 倍）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r6_numeric_discrimination, engine: basic}
    source_refs: ["scripts/validate/rules_numeric.py:164", "SOUL.md:52"]
    status: active

  - id: R-ITEM-TRUNC
    aliases: [R7]
    title: 文本截断
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r7_truncation, engine: basic}
    source_refs: ["scripts/validate/rules_numeric.py:194", "SOUL.md:65"]
    status: active

  - id: R-ITEM-MINLEN
    aliases: [R8]
    title: 选项最小字数
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r8_min_length, engine: basic}
    target: option_len_chars
    direction: min
    range_with: R-ITEM-LENCEIL
    source_refs: ["scripts/validate/rules_numeric.py:229", "SOUL.md:77"]
    status: active

  - id: R-ITEM-UNIT
    aliases: [R9]
    title: 数值缺单位
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r9_missing_unit, engine: basic}
    source_refs: ["scripts/validate/rules_numeric.py:284", "SOUL.md:65"]
    status: active

  - id: R-ITEM-CLUEREPEAT
    aliases: [R10]
    title: 题干与选项线索重复
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_structural.py, symbol: check_r10_clue_repetition, engine: full}
    source_refs: ["scripts/validate/rules_structural.py:48", "SOUL.md:65"]
    status: active

  - id: R-ITEM-CONVERGE
    aliases: [R11]
    title: 选项收敛（互为同义）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_structural.py, symbol: check_r11_convergence, engine: full}
    source_refs: ["scripts/validate/rules_structural.py:91", "SOUL.md:65"]
    status: active

  - id: R-ITEM-SUFFIX
    aliases: [R12]
    title: 无意义括号后缀
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_structural.py, symbol: check_r12_meaningless_suffix, engine: full}
    source_refs: ["scripts/validate/rules_structural.py:131", "SOUL.md:67", "SOUL.md:80"]
    status: active

  - id: R-ITEM-LENCEIL
    aliases: [R13]
    title: 选项长度上限
    kind: item
    severity: soft
    detector: {type: python, file: scripts/validate/rules_structural.py, symbol: check_r13_length_ceiling, engine: full}
    target: option_len_chars
    direction: max
    range_with: R-ITEM-MINLEN
    source_refs: ["scripts/validate/rules_structural.py:185", "SOUL.md:77"]
    status: active
    notes: "上限 20（校验口径）≠ 生成目标 18（pipeline.yaml prompt_constraints.option_length.max_chars），两者是不同口径，见 config_keys.option_length_target。2026-11-02（P2-S5）：severity 由 hard 降为 soft，逐项超长 FAIL→WARN；真题原题（kaoyan_origin/zhiyi_origin）与含条件/因果/时间窗/人群限定的选项整体或逐项豁免（脚本内 origin_kind / conditional_feature）。「靠长度猜答案」的硬约束由 R2 继续以 FAIL 守住。回测见 reports/validate/r13_backtest_20261102.md。"

  # ── 组题 / 文件级规则 ───────────────────────────────────────
  - id: R-GROUP-B1
    aliases: [B1]
    title: A3/A4/B1 组题结构完整性
    kind: group
    severity: hard
    detector: {type: python, file: scripts/validate/rules_structural.py, symbol: check_b1_groups, engine: full}
    source_refs: ["scripts/validate/rules_structural.py:194"]
    status: active

  - id: R-FILE-JSON
    aliases: [JS1]
    title: JSON 完整性（截断/括号/编码）
    kind: file
    severity: hard
    detector: {type: python, file: scripts/validate/rules_structural.py, symbol: check_js1_json_integrity, engine: full}
    source_refs: ["scripts/validate/rules_structural.py:244"]
    status: active

  - id: R-FILE-SCHEMAFIELDS
    aliases: [S1]
    title: 字段完整性与必填项
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_static.py, symbol: check_s1_schema_completeness}
    source_refs: ["scripts/validate/rules_static.py:9", "SCHEMA"]
    status: active

  - id: R-FILE-NULL
    aliases: [S2]
    title: 空值与非空约束
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_static.py, symbol: check_s2_null_values}
    source_refs: ["scripts/validate/rules_static.py:60"]
    status: active

  - id: R-FILE-PLACEHOLDER
    aliases: [S3]
    title: 占位页码（P??/待补）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_structural.py, symbol: check_s3_placeholder_pages, engine: full}
    source_refs: ["scripts/validate/rules_structural.py:315"]
    status: active

  - id: R-ITEM-ABSLANG
    aliases: [S4]
    title: 绝对化语言（静态扫描）
    kind: item
    severity: soft
    detector: {type: python, file: scripts/validate/rules_static.py, symbol: check_s4_absolute_language}
    source_refs: ["scripts/validate/rules_static.py:96"]
    status: active

  # ── 学习价值层 R14–R19（check_learning_value.py，HC-24）──────
  - id: R-LV-PEROPTION
    aliases: [R14]
    title: 逐项覆盖（per_option 与 options 标签集一致）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/check_learning_value.py, symbol: check_item, tag: R14}
    source_refs: ["scripts/check_learning_value.py:5", "SOUL.md:205"]
    status: active

  - id: R-LV-MISCONCEPTION
    aliases: [R15]
    title: 错误选项必须带 misconception_id + 描述且题内唯一
    kind: item
    severity: hard
    detector: {type: python, file: scripts/check_learning_value.py, symbol: check_item, tag: R15}
    source_refs: ["scripts/check_learning_value.py:6", "SOUL.md:205"]
    status: active

  - id: R-LV-SOURCEVERIFY
    aliases: [R16]
    title: 来源实证核验（source_quote / anchor）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/check_learning_value.py, symbol: check_item, tag: R16}
    source_refs: ["scripts/check_learning_value.py:7", "SOUL.md:205"]
    status: active

  - id: R-LV-INFOVOLUME
    aliases: [R17]
    title: 信息量下限（correct_rationale≥60 / why≥20 / key_takeaway≥30）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/check_learning_value.py, symbol: check_item, tag: R17}
    target: correct_rationale_chars
    direction: min
    source_refs: ["scripts/check_learning_value.py:12", "SOUL.md:205"]
    status: active

  - id: R-LV-ANCHOROVERLAP
    aliases: [R18]
    title: 锚点主题覆盖度（题干 2-gram 被 teacher_anchor 覆盖）
    kind: item
    severity: soft
    detector: {type: python, file: scripts/check_learning_value.py, symbol: check_item, tag: R18}
    source_refs: ["scripts/check_learning_value.py:232", "SOUL.md:205"]
    status: active

  - id: R-LV-MISCONSISTENCY
    aliases: [R19]
    title: 同一 misconception_id 的跨题释义一致性
    kind: batch
    severity: hard
    detector: {type: python, file: scripts/check_learning_value.py, symbol: audit_batch, tag: R19}
    target: misconception_consistency
    direction: eq
    source_refs: ["scripts/check_learning_value.py:14", "SOUL.md:205"]
    status: active

  - id: R-LV-MECHANISM
    aliases: [R20]
    title: 干扰项机制标签（HC-29）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/check_learning_value.py, symbol: check_item, tag: R20}
    notes: "仅对 schema_version ≥ 2.2 生效；2.1 及以下返回 SKIP，不追溯（覆盖率仍在批次汇总里统计）。"
    source_refs: ["Prompt版本/MedGen_current_prompt.md", "schemas/agent2_output.schema.json"]
    status: active

  # ── 阶段门禁 GATE ─────────────────────────────────────────
  - id: GATE-A2
    aliases: [GATE-A2]
    title: Agent2 产出门禁（validate_options FAIL=0）
    kind: gate
    severity: hard
    detector: {type: python, file: gate_check.py, symbol: gate_agent2}
    source_refs: ["gate_check.py:501", "SOUL.md:74"]
    status: active

  - id: GATE-A3
    aliases: [GATE-A3]
    title: Agent3 质检门禁（D20 硬阻断 + Bloom 偏差）
    kind: gate
    severity: hard
    detector: {type: python, file: gate_check.py, symbol: gate_agent3}
    source_refs: ["gate_check.py:588", "SOUL.md:74"]
    status: active

  - id: GATE-A3-D20
    aliases: [D20]
    title: 关键缺陷零容忍（D20_score ≠ 0 即阻断）
    kind: gate
    severity: hard
    detector: {type: python, file: gate_check.py, symbol: gate_agent3, tag: GATE-A3-D20}
    source_refs: ["gate_check.py:780"]
    status: active

  - id: GATE-A3-BLOOM
    aliases: [BLOOM]
    title: Bloom 单层偏差 ≤15%
    kind: gate
    severity: hard
    detector: {type: python, file: gate_check.py, symbol: gate_agent3, tag: GATE-A3-BLOOM}
    target: bloom_deviation_pct
    direction: max
    source_refs: ["gate_check.py:819", "SOUL.md:83"]
    status: active

  - id: GATE-A3-BLOOM-RECOMPUTE
    aliases: [BLOOM-RECOMPUTE]
    title: Bloom 门禁独立重算交叉验证（偏差 >5% 阻断）
    kind: gate
    severity: hard
    detector: {type: python, file: gate_check.py, symbol: gate_agent3, tag: GATE-A3-BLOOM-RECOMPUTE}
    source_refs: ["gate_check.py:864"]
    status: active

  - id: GATE-A4
    aliases: [GATE-A4]
    title: Agent4 修复门禁（source_file_synced 溯源，HC-13）
    kind: gate
    severity: hard
    detector: {type: python, file: gate_check.py, symbol: gate_agent4}
    source_refs: ["gate_check.py:910", "SOUL.md:75"]
    status: active

  - id: GATE-LV
    aliases: [GATE-LV]
    title: 学习价值层门禁（HC-24，advisory/enforce 双模）
    kind: gate
    severity: hard
    detector: {type: python, file: gate_check.py, symbol: gate_learning_value}
    source_refs: ["gate_check.py:1098", "SOUL.md:205"]
    status: active

  - id: GATE-ITEM-LV
    aliases: []
    title: 单题学习价值门禁
    kind: gate
    severity: hard
    detector: {type: python, file: gate_check.py, symbol: gate_item_learning_value}
    source_refs: ["gate_check.py:1152"]
    status: active

  - id: GATE-BLUEPRINT
    aliases: []
    title: 蓝图偏差门禁
    kind: gate
    severity: soft
    detector: {type: python, file: gate_check.py, symbol: gate_question_blueprint}
    source_refs: ["gate_check.py:1272", "SOUL.md:53"]
    status: active

  - id: GATE-FINAL
    aliases: [GATE-FINAL]
    title: 终审前全量门禁
    kind: gate
    severity: hard
    detector: {type: python, file: gate_check.py, symbol: gate_final}
    source_refs: ["gate_check.py:1353", "SOUL.md:221"]
    status: active

  # ── 合规发布 P8（2026-11-02 新增）─────────────────────────
  - id: P8-PUBLIC-GATE
    aliases: [PUBLIC-GATE]
    title: 公开闸门（白名单一致 / 裸题面 / 线上探测；授权不设门禁）
    kind: gate
    severity: hard
    detector: {type: python, file: scripts/public_gate.py, symbol: main}
    source_refs: ["scripts/public_gate.py", "SOUL.md:177"]
    status: active
    notes: "G1 白名单双通道一致｜G2 构建输出目录不得为仓库根（WARN）｜G3 真题引用清点（2026-11-03 起恒 INFO，授权不再阻断）｜G4 白名单内不得含裸题面｜G5 白名单外清单｜G6 线上探测按 content_type 判 SPA 兜底。G0 授权数据缺失也只记 INFO。"

  # ── 修复闭环 P5（2026-11-02 新增）─────────────────────────
  - id: P5-RETRY-ITEM
    aliases: []
    title: 单题重试上限（>2 次自动 QUARANTINE）
    kind: batch
    severity: hard
    detector: {type: python, file: scripts/workflow_state.py, symbol: record_retry}
    target: retry_item_count
    direction: max
    source_refs: ["scripts/workflow_state.py", "CONFIG"]
    status: active
    notes: "阈值 retry_item_max=2（pipeline.yaml thresholds）。超限把该题置 QUARANTINE，不再自动重试。"

  - id: P5-RETRY-BATCH
    aliases: []
    title: 整批重试上限（>3 次自动 QUARANTINE）
    kind: batch
    severity: hard
    detector: {type: python, file: scripts/workflow_state.py, symbol: record_retry}
    target: retry_batch_count
    direction: max
    source_refs: ["scripts/workflow_state.py", "CONFIG"]
    status: active
    notes: "阈值 retry_batch_max=3。批次级隔离覆盖题目级。"

  - id: P5-IMMUTABLE
    aliases: [IMMUTABLE]
    title: Patch 不可变字段（答案 / 真题题干与答案 / HC-20 引文 / 溯源）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/check_patch_integrity.py, symbol: audit}
    target: immutable_fields
    direction: set
    source_refs: ["scripts/check_patch_integrity.py", "SOUL.md:85"]
    status: active
    notes: "声明文件不能豁免本约束：即使 declared 里写了 answer，也照判违例。"

  - id: P5-DIFF
    aliases: [DIFF]
    title: 声明字段 vs 实际变更字段（未声明变化即拒收）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/check_patch_integrity.py, symbol: audit}
    target: declared_change_scope
    direction: set
    source_refs: ["scripts/check_patch_integrity.py"]
    status: active

  - id: P5-NOOP
    aliases: [NOOP]
    title: no-op 修复检测（声称修复但零变化）
    kind: batch
    severity: hard
    detector: {type: python, file: scripts/check_patch_integrity.py, symbol: detect_noop}
    target: effective_change
    direction: min
    source_refs: ["scripts/check_patch_integrity.py", "SOUL.md:75"]
    status: active
    notes: "batch046 的 A2→A4 是真实命中样本（字节完全相同）。no-op 不得算 PASS。"

  # ── 硬约束 HC（SOUL.md）─────────────────────────────────────
  - id: HC-5
    aliases: []
    title: 外来素材数值交叉验证（≥10% 抽查）
    kind: process
    severity: process
    detector: {type: semantic, reviewer: 内容专家}
    source_refs: ["SOUL.md:51"]
    status: active

  - id: HC-6-NUMDISCRIM
    aliases: []
    title: 干扰项区分度审查（数值型差值 ≤5 倍）
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_numeric.py, symbol: check_r6_numeric_discrimination}
    source_refs: ["SOUL.md:52"]
    status: active
    notes: "SOUL 中 HC-6 被三个 Agent 各自定义（A1/A4/A4-修复），本 ID 只承载 A1 语义；其余见 HC-6-A4 / HC-6-FIX-A4。"

  - id: HC-6-A4
    aliases: []
    title: Agent4 独立质量审查（≥5% 干扰项独立评估）
    kind: process
    severity: process
    detector: {type: semantic, reviewer: 内容专家}
    source_refs: ["SOUL.md:63"]
    status: active

  - id: HC-6-FIX-A4
    aliases: []
    title: 干扰项修复必须增加实质区分信息，禁止无意义后缀
    kind: item
    severity: hard
    detector: {type: python, file: scripts/validate/rules_structural.py, symbol: check_r12_meaningless_suffix}
    target: option_suffix
    direction: set
    source_refs: ["SOUL.md:67"]
    status: active

  - id: HC-7-BLUEPRINT
    aliases: []
