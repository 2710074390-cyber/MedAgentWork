    source_refs: ["PROMPT", "scripts/check_source_concepts.py:72"]
    status: active

  # ── 批次级规则（P2-S3，2026-11-02）──────────────────────────
  #
  # 与 R 系列的区别：X 系列在整批分布上判定，单题永远看不出。
  # 起步状态 advisory（违例记录但不阻断），转 enforce 的前置见 AC-P2-09。
  - id: X-BATCH-ANSDIST
    aliases: [X1]
    title: 答案字母分布（每字母 15%–30%）
    kind: batch
    severity: soft
    detector: {type: python, file: scripts/validate/rules_batch.py, symbol: check_answer_distribution}
    notes: "只统计单选（答案恰 1 个字母）；多选/判断单列不混分母。advisory 阶段 status=VIOLATED 但不阻断。"
    source_refs: ["scripts/validate/rules_batch.py", "tests/test_validate_rules.py"]
    status: active

  - id: X-BATCH-UNIQLONGEST
    aliases: [X2]
    title: 正确项为唯一最长项的题目占比 ≤30%
    kind: batch
    severity: soft
    detector: {type: python, file: scripts/validate/rules_batch.py, symbol: check_unique_longest}
    notes: "与 R2 长度比是不同口径：R2 看单题比值，X2 看整批「靠长度猜答案」的可利用度。"
    source_refs: ["scripts/validate/rules_batch.py", "tests/test_validate_rules.py"]
    status: active

  - id: X-BATCH-MISREUSE
    aliases: [X6]
    title: 错误认知复用率 ≥20%
    kind: batch
    severity: soft
    detector: {type: python, file: scripts/validate/rules_batch.py, symbol: check_misconception_reuse}
    notes: "分母为全部干扰项；复用 = 同一 misconception_id 被 ≥2 题使用。每题全新 ID 等于把错误认知降级为题内私有标签。"
    source_refs: ["scripts/validate/rules_batch.py", "SOUL.md:200"]
    status: active

  - id: X-BATCH-STRUCTCOV
    aliases: [S-STRUCT]
    title: schema 2.2 结构字段覆盖率 100%
    kind: batch
    severity: hard
    detector: {type: python, file: scripts/validate/rules_batch.py, symbol: check_structural_coverage}
    notes: "只对 schema_version ≥ 2.2 生效；历史批次返回 SKIP，不追溯。覆盖 difficulty_tier/step_count/competing_dx/negative_cues/conditionals + per_option.distractor_mechanism。"
    source_refs: ["schemas/agent2_output.schema.json", "tests/test_validate_rules.py"]
    status: active

  - id: X-BATCH-REVERSE
    aliases: [X5]
    title: 反选题占比 ≤15%
    kind: batch
    severity: hard
    detector: {type: python, file: scripts/validate/rules_batch.py, symbol: check_reverse_selection}
    target: reverse_selection_ratio
    direction: max
    notes: "分子 = polarity=negative 与题干设问的**并集**（宁可高估）；分母 = 全部题。只看 polarity 会被漏标掩盖（batch042 的 18 道反选全标了 positive → 算出 0%），只看题干会被加粗标签打断（batch037 的 `<b>不属于</b>` 整批漏检）。"
    source_refs: ["SOUL.md:303", "scripts/validate/rules_batch.py"]
    status: active

  - id: X-BATCH-REVANCHOR
    aliases: [X5-A]
    title: 反选题的为真干扰项逐项锚点
    kind: batch
    severity: hard
    detector: {type: python, file: scripts/validate/rules_batch.py, symbol: check_reverse_option_anchors}
    notes: "反选题的非答案项是**正确说法**，要求 source_anchor（题级 answer_evidence 可兜底），不要求 misconception_id。只对 schema_version ≥ 2.2 生效，历史批次 SKIP。"
    source_refs: ["SOUL.md:303", "scripts/validate/rules_batch.py"]
    status: active

  - id: X-BATCH-POLARITY
    aliases: [X5-P]
    title: 极性标注与题干设问一致性（advisory）
    kind: batch
    severity: soft
    detector: {type: python, file: scripts/validate/rules_batch.py, symbol: check_polarity_consistency}
    notes: "不一致项不必然是标注错：也可能是题干正则把「禁忌证是？」这类定语用法误判。故只出样本、不阻断、不改数据。"
    source_refs: ["scripts/validate/rules_batch.py"]
    status: active

# ── quality_policy 绑定（哪些检查属于哪个发布 profile）──────────
#
# 这里登记的是「绑定关系」，不是规则本体——避免与上面 rules 重复定义。
policy_bindings:
  check_commands:
    baseline: {cmd: "python scripts/pilot_baseline.py", symbol: scripts/pilot_baseline.py:main}
    kc_registry: {cmd: "python scripts/kc_registry.py check", symbol: scripts/kc_registry.py:check_registry}
    item_learning_value: {cmd: "python scripts/check_learning_value.py --file <json>", rule: HC-24}
    scorecard: {cmd: "python scripts/review_scorecard.py <args>", symbol: scripts/review_scorecard.py:main}
    review_detail: {cmd: "python scripts/check_review_detail.py <args>", rule: HC-26}
    source_concepts: {cmd: "python scripts/check_source_concepts.py --file <json> --batch <batch>", rule: R-CONCEPT-SOURCE}
    concept_graph: {cmd: "python scripts/check_concept_graph.py --subject <subject>", symbol: scripts/check_concept_graph.py:main}
    produce_rules: {cmd: "python scripts/verify_produce_rules.py", symbol: scripts/verify_produce_rules.py:main}
    site_freshness: {cmd: "python scripts/check_site_freshness.py", rule: HC-21}
    site_links: {cmd: "node scripts/check_site_links.mjs", symbol: scripts/check_site_links.mjs}
    keypoint_coverage: {cmd: "python scripts/check_keypoint_coverage.py --keypoints <keypoints> --md <md>", rule: HC-20}
    adaptive_coverage: {cmd: "python scripts/check_keypoint_coverage.py --adaptive --json --source-text", rule: HC-20}
    adaptive_manual_review: {cmd: "python scripts/quality_gate.py <args>", symbol: scripts/quality_gate.py}
    batch_rules: {cmd: "python scripts/validate/rules_batch.py --file <json>", symbol: scripts/validate/rules_batch.py:main}
    r13_backtest: {cmd: "python scripts/backtest_r13.py", rule: R-ITEM-LENCEIL}
    agreement: {cmd: "python scripts/agreement.py --ratings <json>", symbol: scripts/agreement.py:main}
    wording: {cmd: "python scripts/check_wording.py", symbol: scripts/check_wording.py:main}
    license_matrix: {cmd: "python scripts/license_matrix.py", symbol: scripts/license_matrix.py:main}
    public_gate: {cmd: "python scripts/public_gate.py", rule: P8-PUBLIC-GATE}
    hc_audit: {cmd: "python scripts/hc_audit.py", symbol: scripts/hc_audit.py:main}
    docs_inventory: {cmd: "ls docs/*.md | wc -l", note: "AC-P1-09：活跃 docs ≤5；台账见 reports/registry/docs_inventory_20261102.md"}
    reverse_backtest: {cmd: "python scripts/backtest_reverse.py", rule: X-BATCH-REVERSE}
    public_risk: {cmd: "python scripts/public_risk.py", symbol: scripts/public_risk.py:main}
    review_sample: {cmd: "python scripts/review_sample.py", symbol: scripts/review_sample.py:main}
  profiles:
    pilot: [baseline, kc_registry, item_learning_value, scorecard, review_detail, source_concepts, concept_graph]
    release_teacher_keypoint: [baseline, kc_registry, item_learning_value, scorecard, review_detail, source_concepts, concept_graph, produce_rules, site_freshness, site_links]
    release_teaching_plan: [keypoint_coverage, produce_rules, scorecard, review_detail]
    release_adaptive: [adaptive_coverage, adaptive_manual_review, produce_rules, site_freshness, site_links]

# ── 配置键（pipeline.yaml thresholds 的生效口径）───────────────
#
# default 必须等于 scripts/pipeline_config.py 的 DEFAULTS，
# 否则 lint 报 config_default_drift。
config_keys:
  - key: r2_ratio_fail
    default: 2.0
    rule: R-ITEM-LENRATIO
  - key: r2_ratio_warn
    default: 1.5
    rule: R-ITEM-LENRATIO
  - key: option_length_max
    default: 20
    rule: R-ITEM-LENCEIL
    distinct_from: option_length_target
    note: "校验上限（R13 FAIL 线）。生成目标 18 是另一口径，见 option_length_target。"
  - key: option_length_target
    default: 18
    rule: null
    yaml_probe: stages.0.prompt_constraints.option_length.max_chars
    distinct_from: option_length_max
    note: "来自 scripts/pipeline.yaml prompt_constraints.option_length.max_chars，属生成提示，不是校验阈值。"
  - key: option_avg_max
    default: 18
    rule: R-ITEM-LENCEIL
    yaml_probe: stages.0.slo.option_avg_max
  - key: bloom_deviation_max
    default: 15
    rule: GATE-A3-BLOOM
  - key: bloom_recompute_tolerance
    default: 5
    rule: GATE-A3-BLOOM-RECOMPUTE
  - key: learning_value_min_source_exact
    default: 0.95
    rule: R-LV-SOURCEVERIFY
  - key: learning_value_min_quote_verified
    default: 0.95
    rule: R-LV-SOURCEVERIFY
  - key: learning_value_max_misconception_conflicts
    default: 0
    rule: R-LV-MISCONSISTENCY
  - key: learning_value_min_anchor_verified
    default: 0.80
    rule: R-LV-SOURCEVERIFY
  # P5-S1 重试与自动隔离
  - key: retry_item_max
    default: 2
    rule: P5-RETRY-ITEM
  - key: retry_batch_max
    default: 3
    rule: P5-RETRY-BATCH
  # P2-S3 批次级规则 X1/X2/X6
  - key: x1_letter_min
    default: 0.15
    rule: X-BATCH-ANSDIST
    note: "与 x1_letter_max 是同一约束的下界/上界，成对使用，不属重复约束。"
  - key: x1_letter_max
    default: 0.30
    rule: X-BATCH-ANSDIST
    distinct_from: x1_letter_min
    note: "与 x1_letter_min 成对：一个是下界一个是上界，不冲突。"
  - key: x2_unique_longest_max
    default: 0.30
    rule: X-BATCH-UNIQLONGEST
  - key: x6_misconception_reuse_min
    default: 0.20
    rule: X-BATCH-MISREUSE
  - key: x5_reverse_max
    default: 0.15
    rule: X-BATCH-REVERSE
    note: "P2-S4：反选题占比上限。分子取 polarity 与题干设问的并集，分母为全部题。"

# ── 已知编号事故（供 P1-S6 治理，不改原文）─────────────────────
# ── 编号治理结果（P1-S6 · 2026-11-02 处理完毕，保留记录供追溯）──
