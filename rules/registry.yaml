# ── 提示词内部编号（PG-）与全局硬约束（HC-）的映射 ────────────
#
# 两套编号不共用命名空间：`PG-` 是「这一节在提示词里怎么操作」，`HC-` 是 SOUL 的全局义务。
# 历史上提示词也用 HC- 编内部规则，导致同一个 HC-1 在 SOUL 与提示词里指两件事。
# 2026-11-02 起提示词内部规则用 PG-，旧编号保留为别名（各提示词文件顶部有对照表）。
prompt_numbering:
  scope: ["Prompt版本/*.md", ".dsh/skills/*/SKILL.md"]
  mapping:
    PG-00: {was: HC-0, note: "意图回显/仅执行结构化指令"}
    PG-01: {was: HC-1, note: "语义随 Agent 不同（MedGen 题型极性 / MedFix Precondition）"}
    PG-02: {was: HC-2, note: "Schema 化元数据"}
    PG-03: {was: HC-3, note: "知识溯源"}
    PG-03a: {was: HC-3a, note: "溯源补充条款"}
    PG-04: {was: HC-4, note: "选项互斥与唯一性"}
    PG-05b: {was: HC-5b, note: "学习价值层补丁"}
    PG-09: {was: HC-9, note: "提示词内部规则"}
    PG-10: {was: HC-10, note: "提示词内部规则"}
    PG-11: {was: HC-11, note: "提示词内部规则"}
  not_migrated:
