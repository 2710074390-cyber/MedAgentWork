  # ── 概念标注（HC-27）────────────────────────────────────────
  - id: R-CONCEPT-SOURCE
    aliases: [HC-27]
    title: 生成期概念多标签（concepts[] 必填，恰好 1 条 primary）
    kind: item
    severity: hard
