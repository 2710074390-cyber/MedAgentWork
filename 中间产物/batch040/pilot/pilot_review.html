<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#152522;--muted:#65756f;--line:#dbe6e1;--accent:#0b6e5f;--accent2:#c2711a;--ok:#2f7d5b;--risk:#a23b3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.65}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 48px}
header{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:18px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px}
.stats{font-size:12px;color:var(--muted);text-align:right}
.bar{height:8px;background:#e3ece8;border-radius:99px;overflow:hidden;margin:12px 0 18px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;min-height:300px;display:flex;flex-direction:column}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#e7f2ef;color:var(--accent)}
.front{font-size:20px;font-weight:700;line-height:1.55;margin:4px 0 16px}
.back{display:none;border-top:1px dashed var(--line);padding-top:14px;color:var(--ink);font-size:16px;line-height:1.8;white-space:pre-wrap}
.back.show{display:block}
mark{background:#fbe7c8;color:#7a4c16;padding:0 2px;border-radius:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:18px}
button{font:inherit;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;background:var(--accent);color:#fff}
button.secondary{background:#e7f2ef;color:var(--accent)}
button.warn{background:#fbf1e3;color:#7a4c16}
button.risk{background:#f7e8e8;color:var(--risk)}
button:disabled{opacity:.45;cursor:not-allowed}
.rate{display:none;gap:8px;flex-wrap:wrap;margin-top:10px}
.rate.show{display:flex}
.rate button{flex:1;min-width:110px}
footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
footer button{background:#fff;color:var(--muted);border:1px solid var(--line);font-size:12px;padding:7px 10px}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
@media(max-width:480px){.wrap{padding:16px 12px 36px}h1{font-size:19px}header{align-items:flex-start;flex-direction:column}.front{font-size:18px}.card{padding:16px;min-height:280px}.rate button{min-width:44%}}
</style>

<script>
const ITEMS = [{"item_id": "ENT-RECALL-M01-001", "kc_id": "ENT:K-M01-001", "module": "M01", "type": "recall", "front": "外耳、中耳、内耳各由哪些结构组成？听骨链的排列顺序是什么？", "back": "内耳由耳蜗、前庭、半规管组成；耳蜗负责听觉，前庭与半规管负责平衡。", "source_quote": "内耳由耳蜗、前庭、半规管组成；耳蜗负责听觉，前庭与半规管负责平衡。", "source_page": "", "tags": ["ENT", "M01", "ENT:K-M01-001", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M01-002", "kc_id": "ENT:K-M01-002", "module": "M01", "type": "recall", "front": "空气传导的完整路径是什么？为什么骨导正常而气导下降提示传导性聋？", "back": "气导经外耳道→鼓膜→听骨链→卵圆窗→外淋巴→毛细胞；骨导经颅骨振动直接传至内耳。骨导正常说明内耳与听神经完好，气导下降即定位于外耳/中耳。", "source_quote": "气导经外耳道→鼓膜→听骨链→卵圆窗→外淋巴→毛细胞；骨导经颅骨振动直接传至内耳。骨导正常说明内耳与听神经完好，气导下降即定位于外耳/中耳。", "source_page": "", "tags": ["ENT", "M01", "ENT:K-M01-002", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M01-003", "kc_id": "ENT:K-M01-003", "module": "M01", "type": "recall", "front": "高频声波主要使基底膜哪一端振动？毛细胞如何把机械振动转成电信号？", "back": "高频在基底部（近卵圆窗），低频在蜗顶；毛细胞静纤毛弯曲打开机械门控离子通道，去极化产生电信号。", "source_quote": "高频在基底部（近卵圆窗），低频在蜗顶；毛细胞静纤毛弯曲打开机械门控离子通道，去极化产生电信号。", "source_page": "", "tags": ["ENT", "M01", "ENT:K-M01-003", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M01-004", "kc_id": "ENT:K-M01-004", "module": "M01", "type": "recall", "front": "面神经有哪三类纤维？五个终末支自上而下如何排列？", "back": "第Ⅶ对脑神经；含运动、感觉（味觉）、副交感三类纤维。", "source_quote": "第Ⅶ对脑神经；含运动、感觉（味觉）、副交感三类纤维。", "source_page": "", "tags": ["ENT", "M01", "ENT:K-M01-004", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M01-005", "kc_id": "ENT:K-M01-005", "module": "M01", "type": "recall", "front": "如何用额纹区分周围性与中枢性面瘫？为什么不能只凭额纹判断？", "back": "周围性面瘫同侧额纹消失；中枢性面瘫额纹多保留、仅对侧下半面无力。不能只凭额纹，需结合完整神经查体。", "source_quote": "周围性面瘫同侧额纹消失；中枢性面瘫额纹多保留、仅对侧下半面无力。不能只凭额纹，需结合完整神经查体。", "source_page": "", "tags": ["ENT", "M01", "ENT:K-M01-005", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M01-006", "kc_id": "ENT:K-M01-006", "module": "M01", "type": "recall", "front": "椭圆囊斑、球囊斑、壶腹嵴各感受什么？", "back": "椭圆囊斑、球囊斑感受直线加速度与重力；半规管壶腹嵴感受角加速度。", "source_quote": "椭圆囊斑、球囊斑感受直线加速度与重力；半规管壶腹嵴感受角加速度。", "source_page": "", "tags": ["ENT", "M01", "ENT:K-M01-006", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M01-007", "kc_id": "ENT:K-M01-007", "module": "M01", "type": "recall", "front": "儿童为什么易患中耳炎？内毛细胞与外毛细胞分工有何不同？", "back": "儿童咽鼓管短、宽、平直，鼻咽感染易逆行入中耳；加之免疫未成熟、常仰卧喂奶。", "source_quote": "儿童咽鼓管短、宽、平直，鼻咽感染易逆行入中耳；加之免疫未成熟、常仰卧喂奶。", "source_page": "", "tags": ["ENT", "M01", "ENT:K-M01-007", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-001", "kc_id": "ENT:K-M02-002", "module": "M02", "type": "recall", "front": "耳郭化脓性软骨膜炎最常见的致病菌是什么？为什么耳垂常不受累？", "back": "铜绿假单胞菌、金黄色葡萄球菌；耳垂不含软骨，故相对不受累。", "source_quote": "铜绿假单胞菌、金黄色葡萄球菌；耳垂不含软骨，故相对不受累。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-002", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-002", "kc_id": "ENT:K-M02-004", "module": "M02", "type": "recall", "front": "耵聍栓塞为什么表现为气导下降而骨导正常？耵聍栓塞与外耳道胆脂瘤最关键的区别是什么？", "back": "耵聍只占位、不侵蚀骨质；胆脂瘤由角化上皮堆积并造成进行性骨质侵蚀，伴耳痛、流脓、恶臭。", "source_quote": "耵聍只占位、不侵蚀骨质；胆脂瘤由角化上皮堆积并造成进行性骨质侵蚀，伴耳痛、流脓、恶臭。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-004", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-003", "kc_id": "ENT:K-M02-007", "module": "M02", "type": "recall", "front": "外耳道胆脂瘤为什么不能只靠病理确诊？还需要哪些检查？", "back": "外耳道胆脂瘤不能只靠病理：需结合耳镜/耳内镜观察与颞骨 CT 评估骨质破坏，病理用于鉴别。", "source_quote": "外耳道胆脂瘤不能只靠病理：需结合耳镜/耳内镜观察与颞骨 CT 评估骨质破坏，病理用于鉴别。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-007", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-004", "kc_id": "ENT:K-M02-008", "module": "M02", "type": "recall", "front": "大疱性鼓膜炎需要与哪四类鼓膜病变鉴别？关键鉴别点是什么？", "back": "与一般急性鼓膜炎、急性化脓性中耳炎早期、特发性血鼓室及蓝鼓膜鉴别；关键看鼓膜形态（血性大疱 vs 充血膨隆 vs 蓝黑色）。", "source_quote": "与一般急性鼓膜炎、急性化脓性中耳炎早期、特发性血鼓室及蓝鼓膜鉴别；关键看鼓膜形态（血性大疱 vs 充血膨隆 vs 蓝黑色）。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-008", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-005", "kc_id": "ENT:K-M02-009", "module": "M02", "type": "recall", "front": "分泌性中耳炎的声导抗典型曲线是什么？鼓膜置管的常见适应证有哪些？", "back": "声导抗呈 B 型平坦曲线；置管考虑持续约 3 个月或更久的中耳积液伴听力困难，或言语、学习、平衡、生活质量受影响。", "source_quote": "声导抗呈 B 型平坦曲线；置管考虑持续约 3 个月或更久的中耳积液伴听力困难，或言语、学习、平衡、生活质量受影响。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-009", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-006", "kc_id": "ENT:K-M02-010", "module": "M02", "type": "recall", "front": "婴幼儿为什么容易发生化脓性中耳炎？请说出至少三条原因。", "back": "咽鼓管短、宽、平直；免疫未成熟；仰卧喂奶；腺样体肥大与上感反复。", "source_quote": "咽鼓管短、宽、平直；免疫未成熟；仰卧喂奶；腺样体肥大与上感反复。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-010", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-007", "kc_id": "ENT:K-M02-011", "module": "M02", "type": "recall", "front": "急性化脓性中耳炎为什么在鼓膜穿孔后疼痛减轻？穿孔后为什么禁用粉剂？", "back": "鼓室积脓压力升高致鼓膜穿孔，脓液引流后压力下降，疼痛缓解；穿孔后禁用粉剂，以免结块堵塞妨碍引流。", "source_quote": "鼓室积脓压力升高致鼓膜穿孔，脓液引流后压力下降，疼痛缓解；穿孔后禁用粉剂，以免结块堵塞妨碍引流。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-011", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-008", "kc_id": "ENT:K-M02-012", "module": "M02", "type": "recall", "front": "慢性化脓性中耳炎局部用药的三条禁忌是什么？为什么唯一听力耳手术要谨慎？", "back": "忌氨基糖苷类等耳毒性滴耳液、忌粉剂、忌含酚类/砷类腐蚀剂（尽量不用有色药物）。", "source_quote": "忌氨基糖苷类等耳毒性滴耳液、忌粉剂、忌含酚类/砷类腐蚀剂（尽量不用有色药物）。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-012", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-009", "kc_id": "ENT:K-M02-013", "module": "M02", "type": "recall", "front": "诊断中耳胆脂瘤最有价值的检查是什么？它能评估哪些结构？", "back": "颞骨 CT 最有价值；可评估乳突气化、病变范围、听小骨破坏、面神经管、迷路瘘孔、颈静脉球高度。", "source_quote": "颞骨 CT 最有价值；可评估乳突气化、病变范围、听小骨破坏、面神经管、迷路瘘孔、颈静脉球高度。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-013", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-010", "kc_id": "ENT:K-M02-016", "module": "M02", "type": "recall", "front": "周围性与中枢性眩晕各有什么特征？前庭周围性眩晕如何按部位分类？", "back": "周围性：旋转性眩晕剧烈、自主神经症状明显、水平/水平旋转眼震、可伴耳鸣耳闷；中枢性：眩晕不典型、伴复视/构音障碍/共济失调、垂直或方向改变性眼震。", "source_quote": "周围性：旋转性眩晕剧烈、自主神经症状明显、水平/水平旋转眼震、可伴耳鸣耳闷；中枢性：眩晕不典型、伴复视/构音障碍/共济失调、垂直或方向改变性眼震。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-016", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-011", "kc_id": "ENT:K-M02-018", "module": "M02", "type": "recall", "front": "梅尼埃病的四联征是什么？眩晕通常持续多久？", "back": "四联征：发作性眩晕、波动性渐进性听力下降、耳鸣、耳胀满感；持续 20 分钟至数小时（附录口径 20 分钟至 12 小时）。", "source_quote": "四联征：发作性眩晕、波动性渐进性听力下降、耳鸣、耳胀满感；持续 20 分钟至数小时（附录口径 20 分钟至 12 小时）。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-018", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-012", "kc_id": "ENT:K-M02-019", "module": "M02", "type": "recall", "front": "BPPV 的诊断标准三条是什么？后半规管 BPPV 用哪个试验？首选处理是什么？", "back": "①头位改变后反复短暂眩晕（通常不超过 1 分钟）；②位置试验出现眩晕及特征性位置性眼震；③排除其他疾病。首选手法复位。", "source_quote": "①头位改变后反复短暂眩晕（通常不超过 1 分钟）；②位置试验出现眩晕及特征性位置性眼震；③排除其他疾病。首选手法复位。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-019", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M02-013", "kc_id": "ENT:K-M02-020", "module": "M02", "type": "recall", "front": "突发性聋激素初始治疗与挽救治疗的时间窗分别是多少？为什么越早越好？", "back": "初始治疗在发病 2 周内；挽救治疗在发病 2～6 周评估。越早恢复内耳灌注，毛细胞不可逆损伤越少。", "source_quote": "初始治疗在发病 2 周内；挽救治疗在发病 2～6 周评估。越早恢复内耳灌注，毛细胞不可逆损伤越少。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-020", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-001", "kc_id": "ENT:K-M03-001", "module": "M03", "type": "recall", "front": "鼻阈由哪些结构构成？后鼻孔由哪四块骨围成？", "back": "鼻阈：外侧鼻软骨外侧脚上缘 + 鼻中隔 + 鼻腔底；梨状孔：鼻骨下缘 + 上颌骨额突内侧缘 + 腭骨突起；后鼻孔：蝶骨体、蝶骨翼突内侧板、腭骨水平部后缘、犁骨后缘。", "source_quote": "鼻阈：外侧鼻软骨外侧脚上缘 + 鼻中隔 + 鼻腔底；梨状孔：鼻骨下缘 + 上颌骨额突内侧缘 + 腭骨突起；后鼻孔：蝶骨体、蝶骨翼突内侧板、腭骨水平部后缘、犁骨后缘。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-001", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-002", "kc_id": "ENT:K-M03-002", "module": "M03", "type": "recall", "front": "三个鼻甲的大小与位置有什么规律？为什么手术要保持在中鼻甲外侧？", "back": "三个鼻甲自上而下依次缩小约 1/3、前端后移约 1/3；中鼻甲属筛骨。", "source_quote": "三个鼻甲自上而下依次缩小约 1/3、前端后移约 1/3；中鼻甲属筛骨。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-002", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-003", "kc_id": "ENT:K-M03-003", "module": "M03", "type": "recall", "front": "利特尔区由哪五条动脉吻合而成？前、后鼻孔填塞的取出时限分别是多少？", "back": "鼻腭动脉、筛前动脉、筛后动脉、上唇动脉、腭大动脉；前鼻孔填塞 3～5 天，后鼻孔填塞最多 5～6 天。", "source_quote": "鼻腭动脉、筛前动脉、筛后动脉、上唇动脉、腭大动脉；前鼻孔填塞 3～5 天，后鼻孔填塞最多 5～6 天。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-003", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-004", "kc_id": "ENT:K-M03-004", "module": "M03", "type": "recall", "front": "鼻周期多长时间一个循环？纤毛的摆动方向和频率是什么？", "back": "2~7 小时一个周期；纤毛朝鼻咽部摆动，频率 1000 次/分。", "source_quote": "2~7 小时一个周期；纤毛朝鼻咽部摆动，频率 1000 次/分。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-004", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-005", "kc_id": "ENT:K-M03-005", "module": "M03", "type": "recall", "front": "嗅区黏膜分布在哪三个区域？它的上皮类型是什么？", "back": "鼻腔顶中部、鼻中隔上部、鼻腔外侧壁上部（嗅裂）；假复层无纤毛柱状上皮。", "source_quote": "鼻腔顶中部、鼻中隔上部、鼻腔外侧壁上部（嗅裂）；假复层无纤毛柱状上皮。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-005", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-006", "kc_id": "ENT:K-M03-006", "module": "M03", "type": "recall", "front": "为什么鼻疖不能挤压？鼻腔上部静脉回流到哪里？", "back": "面部静脉无瓣膜，内眦静脉经眼上/眼下静脉通海绵窦，挤压可致海绵窦血栓性静脉炎；鼻腔上部静脉经眼静脉入海绵窦。", "source_quote": "面部静脉无瓣膜，内眦静脉经眼上/眼下静脉通海绵窦，挤压可致海绵窦血栓性静脉炎；鼻腔上部静脉经眼静脉入海绵窦。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-006", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-007", "kc_id": "ENT:K-M03-007", "module": "M03", "type": "recall", "front": "翼管神经由哪两条神经组成？筛前神经分布于哪些区域？", "back": "岩深神经（交感）+ 岩浅大神经（副交感）；筛前神经内侧支分布鼻中隔上部，外侧支分布鼻腔外侧壁上部及鼻外皮肤。", "source_quote": "岩深神经（交感）+ 岩浅大神经（副交感）；筛前神经内侧支分布鼻中隔上部，外侧支分布鼻腔外侧壁上部及鼻外皮肤。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-007", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-008", "kc_id": "ENT:K-M03-008", "module": "M03", "type": "recall", "front": "OMC 包括哪些鼻窦的引流通道？蝶窦开口在哪里？", "back": "上颌窦、前组筛窦、额窦；蝶窦开口于蝶筛隐窝。", "source_quote": "上颌窦、前组筛窦、额窦；蝶窦开口于蝶筛隐窝。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-008", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-009", "kc_id": "ENT:K-M03-009", "module": "M03", "type": "recall", "front": "为什么筛窦炎容易引起眶内并发症？眶上裂有哪些结构通过？", "back": "眶内壁即纸样板，与筛窦仅隔薄骨板，筛窦炎症易突破入眶；眶上裂通过动眼、滑车、展神经，三叉神经第一支及眼上静脉。", "source_quote": "眶内壁即纸样板，与筛窦仅隔薄骨板，筛窦炎症易突破入眶；眶上裂通过动眼、滑车、展神经，三叉神经第一支及眼上静脉。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-009", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-010", "kc_id": "ENT:K-M03-010", "module": "M03", "type": "recall", "front": "鼻肺反射的反射弧如何构成？它的临床意义是什么？", "back": "传入为鼻腔黏膜三叉神经末梢，中枢为三叉神经及迷走神经核，传出引起同侧支气管收缩、肺通气量下降。", "source_quote": "传入为鼻腔黏膜三叉神经末梢，中枢为三叉神经及迷走神经核，传出引起同侧支气管收缩、肺通气量下降。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-010", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-011", "kc_id": "ENT:K-M03-011", "module": "M03", "type": "recall", "front": "鼻窦有哪五个解剖特点？", "back": "窦口小、鼻道狭窄易阻塞；鼻腔炎症易累及鼻窦；各窦互相累及；各有自身引流特点；儿童亦可患病。", "source_quote": "窦口小、鼻道狭窄易阻塞；鼻腔炎症易累及鼻窦；各窦互相累及；各有自身引流特点；儿童亦可患病。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-011", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-012", "kc_id": "ENT:K-M03-012", "module": "M03", "type": "recall", "front": "急性鼻炎的首要病因是什么？需要与哪些疾病鉴别？", "back": "病毒感染是首要因素；需与流感、变应性鼻炎、血管运动性鼻炎、急性传染病鉴别。", "source_quote": "病毒感染是首要因素；需与流感、变应性鼻炎、血管运动性鼻炎、急性传染病鉴别。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-012", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-013", "kc_id": "ENT:K-M03-013", "module": "M03", "type": "recall", "front": "急性额窦炎为什么晨起加重、午后缓解？急性鼻窦炎的治疗原则有哪三条？", "back": "晨起分泌物堵塞鼻额管，窦内负压甚至真空形成真空性头痛；中午后分泌物排空，疼痛缓解。治疗原则：根除病因、解除引流与通气障碍、控制感染预防并发症。", "source_quote": "晨起分泌物堵塞鼻额管，窦内负压甚至真空形成真空性头痛；中午后分泌物排空，疼痛缓解。治疗原则：根除病因、解除引流与通气障碍、控制感染预防并发症。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-013", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-014", "kc_id": "ENT:K-M03-014", "module": "M03", "type": "recall", "front": "上颌窦穿刺冲洗的两个作用是什么？", "back": "了解上颌窦内有无脓性分泌物；冲洗并注入抗生素治疗。", "source_quote": "了解上颌窦内有无脓性分泌物；冲洗并注入抗生素治疗。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-014", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-015", "kc_id": "ENT:K-M03-015", "module": "M03", "type": "recall", "front": "变应性鼻炎的临床四联征是什么？色甘酸钠为什么只用于轻症或预防？", "back": "鼻痒、阵发性连续喷嚏、大量水样鼻涕、鼻塞；IgE 介导Ⅰ型变态反应，早发相在接触后数分钟内。色甘酸钠起效多在 1 周以后，故仅用于轻症或预防。", "source_quote": "鼻痒、阵发性连续喷嚏、大量水样鼻涕、鼻塞；IgE 介导Ⅰ型变态反应，早发相在接触后数分钟内。色甘酸钠起效多在 1 周以后，故仅用于轻症或预防。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-015", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-016", "kc_id": "ENT:K-M03-016", "module": "M03", "type": "recall", "front": "血管运动性鼻炎的机制是什么？长期用血管收缩剂会有什么后果？", "back": "副交感递质释放过多或组胺非特异性释放，血管扩张、腺体分泌增多；长期用血管收缩剂可致药物性鼻炎。", "source_quote": "副交感递质释放过多或组胺非特异性释放，血管扩张、腺体分泌增多；长期用血管收缩剂可致药物性鼻炎。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-016", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M03-017", "kc_id": "ENT:K-M03-017", "module": "M03", "type": "recall", "front": "萎缩性鼻炎的医源性原因是什么？为什么禁用麻黄碱？", "back": "下鼻甲切除过多（鼻腔过宽、通气过度）；麻黄碱为血管收缩剂，萎缩性鼻炎禁用。", "source_quote": "下鼻甲切除过多（鼻腔过宽、通气过度）；麻黄碱为血管收缩剂，萎缩性鼻炎禁用。", "source_page": "", "tags": ["ENT", "M03", "ENT:K-M03-017", "appendix5"], "origin": "appendix5", "statu x5", "status": "active"}, {"item_id": "ENT-RECALL-M05-001", "kc_id": "ENT:K-M05-001", "module": "M05", "type": "recall", "front": "为什么环状软骨损伤容易导致喉气管狭窄？喉返神经支配哪些喉内肌？哪块例外？", "back": "环状软骨是喉气管唯一完整环形软骨，损伤后支架塌陷、瘢痕愈合，易致喉气管狭窄。", "source_quote": "环状软骨是喉气管唯一完整环形软骨，损伤后支架塌陷、瘢痕愈合，易致喉气管狭窄。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-001", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-002", "kc_id": "ENT:K-M05-002", "module": "M05", "type": "recall", "front": "喉腔分哪三部分？最狭窄的部位是哪里？", "back": "声门上区、声门区、声门下区；声门裂最狭窄。", "source_quote": "声门上区、声门区、声门下区；声门裂最狭窄。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-002", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-003", "kc_id": "ENT:K-M05-003", "module": "M05", "type": "recall", "front": "哪块肌肉是唯一的声带外展肌？双侧喉返神经损伤为什么危险？", "back": "环杓后肌是唯一外展肌；双侧喉返神经损伤时外展功能丧失，声带居中间位，可致严重呼吸困难甚至窒息。", "source_quote": "环杓后肌是唯一外展肌；双侧喉返神经损伤时外展功能丧失，声带居中间位，可致严重呼吸困难甚至窒息。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-003", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-004", "kc_id": "ENT:K-M05-004", "module": "M05", "type": "recall", "front": "会厌哪一面组织疏松？为什么急性会厌炎容易窒息？", "back": "会厌舌面组织疏松；急性会厌炎时肿胀迅速，直接阻塞喉入口。", "source_quote": "会厌舌面组织疏松；急性会厌炎时肿胀迅速，直接阻塞喉入口。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-004", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-005", "kc_id": "ENT:K-M05-005", "module": "M05", "type": "recall", "front": "喉的淋巴以什么为界分区？哪个区淋巴最丰富？这对喉癌转移有什么意义？", "back": "以声门区为界；声门上区淋巴最丰富，故声门上癌易早期颈淋巴结转移。", "source_quote": "以声门区为界；声门上区淋巴最丰富，故声门上癌易早期颈淋巴结转移。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-005", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-006", "kc_id": "ENT:K-M05-006", "module": "M05", "type": "recall", "front": "喉上神经内支、外支与喉返神经各支配什么？损伤后各有什么表现？", "back": "喉上神经内支司声门上感觉，外支支配环甲肌，喉返神经支配其余喉内肌及声门下感觉。", "source_quote": "喉上神经内支司声门上感觉，外支支配环甲肌，喉返神经支配其余喉内肌及声门下感觉。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-006", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-007", "kc_id": "ENT:K-M05-007", "module": "M05", "type": "recall", "front": "喉阻塞四度各有什么表现？哪一度需立即气管切开？", "back": "Ⅰ度活动后、Ⅱ度安静时、Ⅲ度缺氧体征（三凹征）、Ⅳ度衰竭；Ⅲ度立即气管切开，Ⅳ度紧急开放气道。", "source_quote": "Ⅰ度活动后、Ⅱ度安静时、Ⅲ度缺氧体征（三凹征）、Ⅳ度衰竭；Ⅲ度立即气管切开，Ⅳ度紧急开放气道。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-007", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-008", "kc_id": "ENT:K-M05-008", "module": "M05", "type": "recall", "front": "气管切开的常规部位在哪？术后三大护理重点是什么？拔管前要做什么？", "back": "常规在第 3-4 气管软骨环之间（常在第 2～4 附近）；适应证为Ⅱ–Ⅳ度喉阻塞、下呼吸道分泌物潴留、头颈手术术前准备、长期机械通气；护理重点湿化、吸痰、保持套管通畅。", "source_quote": "常规在第 3-4 气管软骨环之间（常在第 2～4 附近）；适应证为Ⅱ–Ⅳ度喉阻塞、下呼吸道分泌物潴留、头颈手术术前准备、长期机械通气；护理重点湿化、吸痰、保持套管通畅。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-008", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-009", "kc_id": "ENT:K-M05-009", "module": "M05", "type": "recall", "front": "急性会厌炎为什么\"剧烈咽痛但不声嘶\"？最危险的情况是什么？", "back": "剧烈咽痛、吞咽困难、多不声嘶；最危险的是会厌肿胀导致气道梗阻。", "source_quote": "剧烈咽痛、吞咽困难、多不声嘶；最危险的是会厌肿胀导致气道梗阻。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-009", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-010", "kc_id": "ENT:K-M05-010", "module": "M05", "type": "recall", "front": "小儿急性喉炎易引起喉阻塞的五条原因是什么？典型三联征是什么？", "back": "喉腔狭小、炎症易肿胀、黏膜下组织疏松、咳嗽力量不够、下呼吸道分泌物不易咳出；典型三联征为声嘶、犬吠样咳、吸气性呼吸困难。", "source_quote": "喉腔狭小、炎症易肿胀、黏膜下组织疏松、咳嗽力量不够、下呼吸道分泌物不易咳出；典型三联征为声嘶、犬吠样咳、吸气性呼吸困难。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-010", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-011", "kc_id": "ENT:K-M05-011", "module": "M05", "type": "recall", "front": "慢性喉炎最主要的症状是什么？治疗的第一条是什么？", "back": "声音嘶哑；治疗第一条是去除病因。", "source_quote": "声音嘶哑；治疗第一条是去除病因。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-011", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-012", "kc_id": "ENT:K-M05-012", "module": "M05", "type": "recall", "front": "声带小结的典型位置与外观演变是什么？如何与声带息肉鉴别？", "back": "双侧声带前中 1/3 交界处对称结节；早期粉红色息肉状，晚期苍白；息肉多单侧、不对称。", "source_quote": "双侧声带前中 1/3 交界处对称结节；早期粉红色息肉状，晚期苍白；息肉多单侧、不对称。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-012", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-013", "kc_id": "ENT:K-M05-013", "module": "M05", "type": "recall", "front": "任克间隙位于哪里？它有什么临床意义？", "back": "位于声带黏膜下、与声带长轴平行；是声带息肉/水肿的蓄积层与手术分离层。", "source_quote": "位于声带黏膜下、与声带长轴平行；是声带息肉/水肿的蓄积层与手术分离层。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-013", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-014", "kc_id": "ENT:K-M05-014", "module": "M05", "type": "recall", "front": "环杓关节炎与环甲关节炎的喉镜表现各是什么？杓间区溃疡要想到什么病？", "back": "环杓关节炎：杓区黏膜肿胀充血、触痛、声带运动受限；环甲关节炎：声带肌松弛、声门偏斜、双侧者闭合呈梭形裂隙；杓间区溃疡要想到喉结核。", "source_quote": "环杓关节炎：杓区黏膜肿胀充血、触痛、声带运动受限；环甲关节炎：声带肌松弛、声门偏斜、双侧者闭合呈梭形裂隙；杓间区溃疡要想到喉结核。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-014", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M05-015", "kc_id": "ENT:K-M05-015", "module": "M05", "type": "recall", "front": "喉癌最常见的类型与病理是什么？声门型癌出现声带固定属于哪一期？", "back": "声门型约占 60%，病理以鳞状细胞癌为主；肿瘤局限喉内伴声带固定为 T3 期。", "source_quote": "声门型约占 60%，病理以鳞状细胞癌为主；肿瘤局限喉内伴声带固定为 T3 期。", "source_page": "", "tags": ["ENT", "M05", "ENT:K-M05-015", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M06-001", "kc_id": "ENT:K-M06-001", "module": "M06", "type": "recall", "front": "为什么异物更容易进入右侧主支气管？单向活瓣会导致什么后果？", "back": "右主支气管短、粗、走向垂直，与气管夹角小。", "source_quote": "右主支气管短、粗、走向垂直，与气管夹角小。", "source_page": "", "tags": ["ENT", "M06", "ENT:K-M06-001", "appendix5"], "origin": "appendix5", "status": "active"}, {"item_id": "ENT-RECALL-M06-002", "kc_id": "ENT:K-M06-002", "module": "M06", "type": "recall", "front": "食管三处生理性狭窄距中切牙分别约多少 ", "kc_id": "ENT:K-M02-013", "module": "M02", "type": "keypoint_recall", "front": "教师重点第21条（M02）：请复述本条核心要点（提示：中耳胆脂瘤病因及临床表现及治疗，诊断中耳胆脂瘤最…）", "back": "中耳胆脂瘤病因及临床表现及治疗，诊断中耳胆脂瘤最有价值的检查是颞骨CT扫描可发现上鼓室、鼓窦和乳突区有骨质破坏，边缘浓密整齐。可评价乳突气化程度、病变范围、听小骨破坏程度、面神经管状况、有无迷路瘘孔、颈静脉球高度等，为手术提供参考。（P91）", "source_quote": "中耳胆脂瘤病因及临床表现及治疗，诊断中耳胆脂瘤最有价值的检查是颞骨CT扫描可发现上鼓室、鼓窦和乳突区有骨质破坏，边缘浓密整齐。可评价乳突气化程度、病变范围、听小骨破坏程度、面神经管状况、有无迷路瘘孔、颈静脉球高度等，为手术提供参考。（P91）", "source_page": "P91", "tags": ["ENT", "M02", "ENT:K-M02-013", "教师重点第21条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-022", "kc_id": "ENT:K-M02-014", "module": "M02", "type": "keypoint_recall", "front": "教师重点第22条（M02）：请复述本条核心要点（提示：中耳胆固醇肉芽肿的发病原因不明，病理改变是中耳腔…）", "back": "中耳胆固醇肉芽肿的发病原因不明，病理改变是中耳腔出现胆固醇结晶和继发的反应性肉芽组织。主要临床症状是较分泌性中耳炎略重的传导性耳聋。体征是蓝鼓膜或深褐色鼓膜，鼓膜被肉芽组织累及出现穿孔，可有褐色分泌物流出。追问病史多有自幼或常年中耳炎病史。胆固醇肉芽肿可局限于乳突或中耳的某些气房，也可侵犯整个中耳。颞骨CT扫描可见鼓室及乳突内软组织影，少数有骨质破坏。（P93）", "source_quote": "中耳胆固醇肉芽肿的发病原因不明，病理改变是中耳腔出现胆固醇结晶和继发的反应性肉芽组织。主要临床症状是较分泌性中耳炎略重的传导性耳聋。体征是蓝鼓膜或深褐色鼓膜，鼓膜被肉芽组织累及出现穿孔，可有褐色分泌物流出。追问病史多有自幼或常年中耳炎病史。胆固醇肉芽肿可局限于乳突或中耳的某些气房，也可侵犯整个中耳。颞骨CT扫描可见鼓室及乳突内软组织影，少数有骨质破坏。（P93）", "source_page": "P93", "tags": ["ENT", "M02", "ENT:K-M02-014", "教师重点第22条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-023", "kc_id": "ENT:K-M02-016", "module": "M02", "type": "keypoint_recall", "front": "教师重点第23条（M02）：请复述本条核心要点（提示：眩晕的诊断应做到定位、定性、定因。病史的采集与分…）", "back": "眩晕的诊断应做到定位、定性、定因。病史的采集与分析是首要任务。（P111）", "source_quote": "眩晕的诊断应做到定位、定性、定因。病史的采集与分析是首要任务。（P111）", "source_page": "P110", "tags": ["ENT", "M02", "ENT:K-M02-016", "教师重点第23条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-024", "kc_id": "ENT:K-M02-016", "module": "M02", "type": "keypoint_recall", "front": "教师重点第24条（M02）：请复述本条核心要点（提示：周围性眩晕与中枢性眩晕的一般特征（P112）…）", "back": "周围性眩晕与中枢性眩晕的一般特征（P112）", "source_quote": "周围性眩晕与中枢性眩晕的一般特征（P112）", "source_page": "P110", "tags": ["ENT", "M02", "ENT:K-M02-016", "教师重点第24条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-025", "kc_id": "ENT:K-M02-016", "module": "M02", "type": "keypoint_recall", "front": "教师重点第25条（M02）：请复述本条核心要点（提示：前庭周围性眩晕分为：（1）耳蜗前庭疾患，包括：①…）", "back": "前庭周围性眩晕分为：（1）耳蜗前庭疾患，包括：①迷路内，如梅尼埃病等；②迷路内外，如氨基苷类耳中毒。（2）前庭疾患，包括：①迷路内，如良性阵发性位置性眩晕；②迷路外，如前庭神经炎。（P110）", "source_quote": "前庭周围性眩晕分为：（1）耳蜗前庭疾患，包括：①迷路内，如梅尼埃病等；②迷路内外，如氨基苷类耳中毒。（2）前庭疾患，包括：①迷路内，如良性阵发性位置性眩晕；②迷路外，如前庭神经炎。（P110）", "source_page": "P110", "tags": ["ENT", "M02", "ENT:K-M02-016", "教师重点第25条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-026", "kc_id": "ENT:K-M02-017", "module": "M02", "type": "keypoint_recall", "front": "教师重点第26条（M02）：请复述本条核心要点（提示：梅尼埃病的病因、梅尼埃病的主要病理改变、及临床表…）", "back": "梅尼埃病的病因、梅尼埃病的主要病理改变、及临床表现、诊断标准，眩晕的特点，诊断主要依靠翔实的病史、全面的检查和仔细的鉴别诊断，甘油试验阳性有助于对本病的诊断。（P114）", "source_quote": "梅尼埃病的病因、梅尼埃病的主要病理改变、及临床表现、诊断标准，眩晕的特点，诊断主要依靠翔实的病史、全面的检查和仔细的鉴别诊断，甘油试验阳性有助于对本病的诊断。（P114）", "source_page": "P112", "tags": ["ENT", "M02", "ENT:K-M02-017", "教师重点第26条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-027", "kc_id": "ENT:K-M02-019", "module": "M02", "type": "keypoint_recall", "front": "教师重点第27条（M02）：请复述本条核心要点（提示：良性阵发性位置性眩晕的病因、典型症状、检查、诊断…）", "back": "良性阵发性位置性眩晕的病因、典型症状、检查、诊断依据，。", "source_quote": "良性阵发性位置性眩晕的病因、典型症状、检查、诊断依据，。", "source_page": "P116", "tags": ["ENT", "M02", "ENT:K-M02-019", "教师重点第27条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-028", "kc_id": "ENT:K-M02-017", "module": "M02", "type": "keypoint_recall", "front": "教师重点第28条（M02）：请复述本条核心要点（提示：梅尼埃病发生机制主要是内淋巴产生和吸收失衡，具体…）", "back": "梅尼埃病发生机制主要是内淋巴产生和吸收失衡，具体机制不明。主要学说有：内淋巴管机械阻塞与内淋巴吸收障碍、免疫反应学说、内耳缺血学说和其他学说，如内淋巴囊功能紊乱学说、病毒感染学说、遗传学说等。（P112）", "source_quote": "梅尼埃病发生机制主要是内淋巴产生和吸收失衡，具体机制不明。主要学说有：内淋巴管机械阻塞与内淋巴吸收障碍、免疫反应学说、内耳缺血学说和其他学说，如内淋巴囊功能紊乱学说、病毒感染学说、遗传学说等。（P112）", "source_page": "P112", "tags": ["ENT", "M02", "ENT:K-M02-017", "教师重点第28条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-029", "kc_id": "ENT:K-M02-018", "module": "M02", "type": "cloze", "front": "梅尼埃病的典型症状表现包括发作性眩晕，波动性、渐进性听力下降，耳鸣以及耳胀满感。患者神志清醒，眩晕持续短暂，多{{c1::20分}}钟至数小时，通常2∼3小时转入缓解期，眩晕持续超过24小时者较少见。（P112）", "back": "梅尼埃病的典型症状表现包括发作性眩晕，波动性、渐进性听力下降，耳鸣以及耳胀满感。患者神志清醒，眩晕持续短暂，多20分钟至数小时，通常2∼3小时转入缓解期，眩晕持续超过24小时者较少见。（P112）", "source_quote": "梅尼埃病的典型症状表现包括发作性眩晕，波动性、渐进性听力下降，耳鸣以及耳胀满感。患者神志清醒，眩晕持续短暂，多20分钟至数小时，通常2∼3小时转入缓解期，眩晕持续超过24小时者较少见。（P112）", "source_page": "P112", "tags": ["ENT", "M02", "ENT:K-M02-018", "教师重点第29条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-030", "kc_id": "ENT:K-M02-018", "module": "M02", "type": "cloze", "front": "梅尼埃病的眩晕多呈突发旋转性，患者感到自身或周围物体沿一定的方向与平面旋转，或感摇晃、升降或漂浮。眩晕均伴有恶心、呕吐、面色苍白、出冷汗、脉搏迟缓、血压下降等自主神经反射症状。上述症状在睁眼转头时加剧，闭目静卧时减轻。患者神志清醒，眩晕持续短暂，多{{c1::20分}}钟至数小时，通常2∼3小时转入缓解期，眩晕持续超过24小时者较少见。在缓解期可有不平衡或不稳感，可持续数天。眩晕常反复发作，复发次数越多，持续越长，间歇越短。（P112）", "back": "梅尼埃病的眩晕多呈突发旋转性，患者感到自身或周围物体沿一定的方向与平面旋转，或感摇晃、升降或漂浮。眩晕均伴有恶心、呕吐、面色苍白、出冷汗、脉搏迟缓、血压下降等自主神经反射症状。上述症状在睁眼转头时加剧，闭目静卧时减轻。患者神志清醒，眩晕持续短暂，多20分钟至数小时，通常2∼3小时转入缓解期，眩晕持续超过24小时者较少见。在缓解期可有不平衡或不稳感，可持续数天。眩晕常反复发作，复发次数越多，持续越长，间歇越短。（P112）", "source_quote": "梅尼埃病的眩晕多呈突发旋转性，患者感到自身或周围物体沿一定的方向与平面旋转，或感摇晃、升降或漂浮。眩晕均伴有恶心、呕吐、面色苍白、出冷汗、脉搏迟缓、血压下降等自主神经反射症状。上述症状在睁眼转头时加剧，闭目静卧时减轻。患者神志清醒，眩晕持续短暂，多20分钟至数小时，通常2∼3小时转入缓解期，眩晕持续超过24小时者较少见。在缓解期可有不平衡或不稳感，可持续数天。眩晕常反复发作，复发次数越多，持续越长，间歇越短。（P112）", "source_page": "P112", "tags": ["ENT", "M02", "ENT:K-M02-018", "教师重点第30条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-031", "kc_id": "ENT:K-M02-017", "module": "M02", "type": "keypoint_recall", "front": "教师重点第31条（M02）：请复述本条核心要点（提示：梅尼埃病的基本病理表现为膜迷路积水膨大，膜蜗管和…）", "back": "梅尼埃病的基本病理表现为膜迷路积水膨大，膜蜗管和球囊较椭圆囊和壶腹明显。膜半规管与内淋巴囊不膨大（P112）。", "source_quote": "梅尼埃病的基本病理表现为膜迷路积水膨大，膜蜗管和球囊较椭圆囊和壶腹明显。膜半规管与内淋巴囊不膨大（P112）。", "source_page": "P112", "tags": ["ENT", "M02", "ENT:K-M02-017", "教师重点第31条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-032", "kc_id": "ENT:K-M02-019", "module": "M02", "type": "cloze", "front": "手术中发现及颞骨组织病理学研究证实，BPPV患者半规管中或其壶腹嵴上存在游离的碳酸钙结晶或嗜碱性染色的沉着物（耳石碎屑）。但类似组织学改变在包括儿童在内的普通颞骨标本中也有发现，后半规管及外半规管的检出率高于前半规管。按受累的半规管不同，分为4种亚型：后半规管BPPV、外半规管BPPV、前半规管BPPV和混合型BPPV。后半规管BPPV最常见，约占{{c1::90%}}，外半规管BPPV次之，前半规管BPPV极少。（P116）", "back": "手术中发现及颞骨组织病理学研究证实，BPPV患者半规管中或其壶腹嵴上存在游离的碳酸钙结晶或嗜碱性染色的沉着物（耳石碎屑）。但类似组织学改变在包括儿童在内的普通颞骨标本中也有发现，后半规管及外半规管的检出率高于前半规管。按受累的半规管不同，分为4种亚型：后半规管BPPV、外半规管BPPV、前半规管BPPV和混合型BPPV。后半规管BPPV最常见，约占90%，外半规管BPPV次之，前半规管BPPV极少。（P116）", "source_quote": "手术中发现及颞骨组织病理学研究证实，BPPV患者半规管中或其壶腹嵴上存在游离的碳酸钙结晶或嗜碱性染色的沉着物（耳石碎屑）。但类似组织学改变在包括儿童在内的普通颞骨标本中也有发现，后半规管及外半规管的检出率高于前半规管。按受累的半规管不同，分为4种亚型：后半规管BPPV、外半规管BPPV、前半规管BPPV和混合型BPPV。后半规管BPPV最常见，约占90%，外半规管BPPV次之，前半规管BPPV极少。（P116）", "source_page": "P116", "tags": ["ENT", "M02", "ENT:K-M02-019", "教师重点第32条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-033", "kc_id": "ENT:K-M02-019", "module": "M02", "type": "cloze", "front": "BPPV的诊断标准：（1）相对于重力方向改变头位后出现反复发作的、短暂的眩晕或头晕（通常持续不超过{{c1::1分}}钟）。（2）位置试验中出现眩晕及特征性位置性眼震。（3）排除其他疾病，如前庭性偏头痛、前庭阵发症、中枢性位置性眩晕、梅尼埃病、前庭神经炎、迷路炎、前半规管裂综合征、后循环缺血、直立性低血压、心理精神源性眩晕等。（P116）", "back": "BPPV的诊断标准：（1）相对于重力方向改变头位后出现反复发作的、短暂的眩晕或头晕（通常持续不超过1分钟）。（2）位置试验中出现眩晕及特征性位置性眼震。（3）排除其他疾病，如前庭性偏头痛、前庭阵发症、中枢性位置性眩晕、梅尼埃病、前庭神经炎、迷路炎、前半规管裂综合征、后循环缺血、直立性低血压、心理精神源性眩晕等。（P116）", "source_quote": "BPPV的诊断标准：（1）相对于重力方向改变头位后出现反复发作的、短暂的眩晕或头晕（通常持续不超过1分钟）。（2）位置试验中出现眩晕及特征性位置性眼震。（3）排除其他疾病，如前庭性偏头痛、前庭阵发症、中枢性位置性眩晕、梅尼埃病、前庭神经炎、迷路炎、前半规管裂综合征、后循环缺血、直立性低血压、心理精神源性眩晕等。（P116）", "source_page": "P116", "tags": ["ENT", "M02", "ENT:K-M02-019", "教师重点第33条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-034", "kc_id": "ENT:K-M02-019", "module": "M02", "type": "keypoint_recall", "front": "教师重点第34条（M02）：请复述本条核心要点（提示：约半数患者病因不明，属特发性BPPV。多见于老年…）", "back": "约半数患者病因不明，属特发性BPPV。多见于老年人及女性，可能与年龄增长所致的耳石退化加速、吸收能力下降及耳石的稳定性降低等有关，激素水平改变、钙代谢紊乱及骨质疏松等也可能是易患因素。继发性BPPV继发于其他耳科或全身系统疾病。最常见的原因是头部外伤和前庭神经炎，其他有：梅尼埃病，突发性聋，中耳或内耳的感染和手术，长期卧床等。（P116）", "source_quote": "约半数患者病因不明，属特发性BPPV。多见于老年人及女性，可能与年龄增长所致的耳石退化加速、吸收能力下降及耳石的稳定性降低等有关，激素水平改变、钙代谢紊乱及骨质疏松等也可能是易患因素。继发性BPPV继发于其他耳科或全身系统疾病。最常见的原因是头部外伤和前庭神经炎，其他有：梅尼埃病，突发性聋，中耳或内耳的感染和手术，长期卧床等。（P116）", "source_page": "P116", "tags": ["ENT", "M02", "ENT:K-M02-019", "教师重点第34条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-035", "kc_id": "ENT:K-M03-004", "module": "M03", "type": "cloze", "front": "正常人的鼻阻力呈昼夜及左右规律和交替变化，这种变化主要受双侧下鼻甲充血状态影响间隔2~7小时出现一个周期，称之为生理性的鼻周期。由于鼻周期的作用，一侧鼻腔病变引起持续性阻塞时，患者会主诉双侧间歇性鼻塞症状，且卧位时此种症状加重；故鼻病患者大多于夜间睡眠时鼻塞程度更加明显（P161）。37.鼻腔鼻窦黏膜大部分为假复层纤毛柱状上皮，表面约有250～300根纤毛，长度为5～10µm，直径0.3µm，每根纤毛朝鼻咽部摆动的频率是{{c1::1000次}}/分。（P162）", "back": "正常人的鼻阻力呈昼夜及左右规律和交替变化，这种变化主要受双侧下鼻甲充血状态影响间隔2~7小时出现一个周期，称之为生理性的鼻周期。由于鼻周期的作用，一侧鼻腔病变引起持续性阻塞时，患者会主诉双侧间歇性鼻塞症状，且卧位时此种症状加重；故鼻病患者大多于夜间睡眠时鼻塞程度更加明显（P161）。37.鼻腔鼻窦黏膜大部分为假复层纤毛柱状上皮，表面约有250～300根纤毛，长度为5～10µm，直径0.3µm，每根纤毛朝鼻咽部摆动的频率是1000次/分。（P162）", "source_quote": "正常人的鼻阻力呈昼夜及左右规律和交替变化，这种变化主要受双侧下鼻甲充血状态影响间隔2~7小时出现一个周期，称之为生理性的鼻周期。由于鼻周期的作用，一侧鼻腔病变引起持续性阻塞时，患者会主诉双侧间歇性鼻塞症状，且卧位时此种症状加重；故鼻病患者大多于夜间睡眠时鼻塞程度更加明显（P161）。37.鼻腔鼻窦黏膜大部分为假复层纤毛柱状上皮，表面约有250～300根纤毛，长度为5～10µm，直径0.3µm，每根纤毛朝鼻咽部摆动的频率是1000次/分。（P162）", "source_page": "P161", "tags": ["ENT", "M03", "ENT:K-M03-004", "教师重点第35条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-036", "kc_id": "ENT:K-M03-002", "module": "M03", "type": "keypoint_recall", "front": "教师重点第36条（M03）：请复述本条核心要点（提示：鼻腔外侧壁从下向上有三个呈阶梯状排列的长条骨片，…）", "back": "鼻腔外侧壁从下向上有三个呈阶梯状排列的长条骨片，分别称为下、中、上鼻甲，其大小依次缩小约1/3，其前端的位置则依次后移约1/3。每一个鼻甲的下方与鼻腔外侧壁均形成一个裂隙状空间，分别称为下、中、上鼻道。（P158）", "source_quote": "鼻腔外侧壁从下向上有三个呈阶梯状排列的长条骨片，分别称为下、中、上鼻甲，其大小依次缩小约1/3，其前端的位置则依次后移约1/3。每一个鼻甲的下方与鼻腔外侧壁均形成一个裂隙状空间，分别称为下、中、上鼻道。（P158）", "source_page": "P158", "tags": ["ENT", "M03", "ENT:K-M03-002", "教师重点第36条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-037", "kc_id": "ENT:K-M03-006", "module": "M03", "type": "keypoint_recall", "front": "教师重点第37条（M03）：请复述本条核心要点（提示：鼻腔后2/3的淋巴汇入咽后淋巴结及颈深淋巴结上群…）", "back": "鼻腔后2/3的淋巴汇入咽后淋巴结及颈深淋巴结上群。鼻部恶性肿瘤可循上述途径发生淋巴结转移。（P157）", "source_quote": "鼻腔后2/3的淋巴汇入咽后淋巴结及颈深淋巴结上群。鼻部恶性肿瘤可循上述途径发生淋巴结转移。（P157）", "source_page": "P151", "tags": ["ENT", "M03", "ENT:K-M03-006", "教师重点第37条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-038", "kc_id": "ENT:K-M03-001", "module": "M03", "type": "keypoint_recall", "front": "教师重点第38条（M03）：请复述本条核心要点（提示：在鼻前庭的皮肤和固有鼻腔黏膜交界处的外侧部分，相…）", "back": "在鼻前庭的皮肤和固有鼻腔黏膜交界处的外侧部分，相当于外侧鼻软骨外侧脚上缘有一弧形隆起，称为鼻阈。与鼻阈相对应的内侧鼻中隔和外下方的鼻腔底部也呈皱襞样隆起，共同构成鼻内孔，该区域为鼻前庭的内界和最狭窄处，对鼻的呼吸功能有重要影响。（P152）", "source_quote": "在鼻前庭的皮肤和固有鼻腔黏膜交界处的外侧部分，相当于外侧鼻软骨外侧脚上缘有一弧形隆起，称为鼻阈。与鼻阈相对应的内侧鼻中隔和外下方的鼻腔底部也呈皱襞样隆起，共同构成鼻内孔，该区域为鼻前庭的内界和最狭窄处，对鼻的呼吸功能有重要影响。（P152）", "source_page": "P150", "tags": ["ENT", "M03", "ENT:K-M03-001", "教师重点第38条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-039", "kc_id": "ENT:K-M03-006", "module": "M03", "type": "keypoint_recall", "front": "教师重点第39条（M03）：请复述本条核心要点（提示：鼻腔前部、后部和下部的静脉，最后汇入颈内、外静脉…）", "back": "鼻腔前部、后部和下部的静脉，最后汇入颈内、外静脉。鼻腔上部静脉经眼静脉汇入海绵窦，也可经筛静脉汇入颅内的静脉和硬脑膜窦。（P151）", "source_quote": "鼻腔前部、后部和下部的静脉，最后汇入颈内、外静脉。鼻腔上部静脉经眼静脉汇入海绵窦，也可经筛静脉汇入颅内的静脉和硬脑膜窦。（P151）", "source_page": "P151", "tags": ["ENT", "M03", "ENT:K-M03-006", "教师重点第39条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-040", "kc_id": "ENT:K-M03-007", "module": "M03", "type": "keypoint_recall", "front": "教师重点第40条（M03）：请复述本条核心要点（提示：交感神经来自颈内动脉交感神经丛组成的岩深神经，副…）", "back": "交感神经来自颈内动脉交感神经丛组成的岩深神经，副交感神经来自面神经分出的岩浅大神经，两者在翼管组成翼管神经。分布于鼻腔，支配腺体分泌和血管舒缩。（P158）", "source_quote": "交感神经来自颈内动脉交感神经丛组成的岩深神经，副交感神经来自面神经分出的岩浅大神经，两者在翼管组成翼管神经。分布于鼻腔，支配腺体分泌和血管舒缩。（P158）", "source_page": "P158", "tags": ["ENT", "M03", "ENT:K-M03-007", "教师重点第40条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-041", "kc_id": "ENT:K-M03-007", "module": "M03", "type": "keypoint_recall", "front": "教师重点第41条（M03）：请复述本条核心要点（提示：鼻腔的感觉神经来自三叉神经第一支 (眼神经)和三…）", "back": "鼻腔的感觉神经来自三叉神经第一支 (眼神经)和三叉神经第二支(上颌神经)的分支。（P158）", "source_quote": "鼻腔的感觉神经来自三叉神经第一支 (眼神经)和三叉神经第二支(上颌神经)的分支。（P158）", "source_page": "P158", "tags": ["ENT", "M03", "ENT:K-M03-007", "教师重点第41条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-042", "kc_id": "ENT:K-M03-003", "module": "M03", "type": "keypoint_recall", "front": "教师重点第42条（M03）：请复述本条核心要点（提示：鼻腭动脉、筛前动脉、筛后动脉、上唇动脉和腭大动脉…）", "back": "鼻腭动脉、筛前动脉、筛后动脉、上唇动脉和腭大动脉，在鼻中隔前下部的黏膜下交互吻合，形成动脉丛，称之为利特尔动脉丛，此区称为利特尔区（Little’s area），是临床上鼻出血最常见的部位。（P156）", "source_quote": "鼻腭动脉、筛前动脉、筛后动脉、上唇动脉和腭大动脉，在鼻中隔前下部的黏膜下交互吻合，形成动脉丛，称之为利特尔动脉丛，此区称为利特尔区（Little’s area），是临床上鼻出血最常见的部位。（P156）", "source_page": "P156", "tags": ["ENT", "M03", "ENT:K-M03-003", "教师重点第42条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-043", "kc_id": "ENT:K-M03-002", "module": "M03", "type": "keypoint_recall", "front": "教师重点第43条（M03）：请复述本条核心要点（提示：中鼻甲属于筛骨结构，前段垂直向下，后段的游离缘逐…）", "back": "中鼻甲属于筛骨结构，前段垂直向下，后段的游离缘逐渐外卷，几乎与鼻腔底平行。手术操作中应严格保持在中鼻甲外侧进行，可防止损伤筛板。（P160）", "source_quote": "中鼻甲属于筛骨结构，前段垂直向下，后段的游离缘逐渐外卷，几乎与鼻腔底平行。手术操作中应严格保持在中鼻甲外侧进行，可防止损伤筛板。（P160）", "source_page": "P158", "tags": ["ENT", "M03", "ENT:K-M03-002", "教师重点第43条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-044", "kc_id": "ENT:K-M03-007", "module": "M03", "type": "keypoint_recall", "front": "教师重点第44条（M03）：请复述本条核心要点（提示：筛前神经和筛后神经是由三叉神经第一支眼神经的分支…）", "back": "筛前神经和筛后神经是由三叉神经第一支眼神经的分支鼻睫神经发出的，与同名动脉伴行，筛前神经进入鼻腔后分为内侧支和外侧支，内侧支分布于鼻中隔上部，外侧支分布于鼻腔外侧壁上部及鼻外皮肤，筛后神经分布于鼻中隔和嗅区。（P158）", "source_quote": "筛前神经和筛后神经是由三叉神经第一支眼神经的分支鼻睫神经发出的，与同名动脉伴行，筛前神经进入鼻腔后分为内侧支和外侧支，内侧支分布于鼻中隔上部，外侧支分布于鼻腔外侧壁上部及鼻外皮肤，筛后神经分布于鼻中隔和嗅区。（P158）", "source_page": "P158", "tags": ["ENT", "M03", "ENT:K-M03-007", "教师重点第44条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-045", "kc_id": "ENT:K-M03-009", "module": "M03", "type": "cloze", "front": "眼眶有上下内外四壁，除外壁其余三壁均为鼻窦环绕，后组筛窦的炎症可波及眼眶，引起眶内炎性并发症，严重可出现眶尖并发症。眶下壁前内缘近鼻泪管处有一浅凹，为下斜肌的起始部位，切忌损伤；{{c1::7岁}}后鼻窦与眼眶关系基本发育成熟；眶内壁前方有泪囊窝，其前后界分别为泪前嵴及泪后嵴。（P159）", "back": "眼眶有上下内外四壁，除外壁其余三壁均为鼻窦环绕，后组筛窦的炎症可波及眼眶，引起眶内炎性并发症，严重可出现眶尖并发症。眶下壁前内缘近鼻泪管处有一浅凹，为下斜肌的起始部位，切忌损伤；7岁后鼻窦与眼眶关系基本发育成熟；眶内壁前方有泪囊窝，其前后界分别为泪前嵴及泪后嵴。（P159）", "source_quote": "眼眶有上下内外四壁，除外壁其余三壁均为鼻窦环绕，后组筛窦的炎症可波及眼眶，引起眶内炎性并发症，严重可出现眶尖并发症。眶下壁前内缘近鼻泪管处有一浅凹，为下斜肌的起始部位，切忌损伤；7岁后鼻窦与眼眶关系基本发育成熟；眶内壁前方有泪囊窝，其前后界分别为泪前嵴及泪后嵴。（P159）", "source_page": "P157", "tags": ["ENT", "M03", "ENT:K-M03-009", "教师重点第45条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-046", "kc_id": "ENT:K-M03-001", "module": "M03", "type": "keypoint_recall", "front": "教师重点第46条（M03）：请复述本条核心要点（提示：鼻骨下缘与上颌骨额突内侧缘及腭骨突起共同形成梨状…）", "back": "鼻骨下缘与上颌骨额突内侧缘及腭骨突起共同形成梨状孔。（P159）", "source_quote": "鼻骨下缘与上颌骨额突内侧缘及腭骨突起共同形成梨状孔。（P159）", "source_page": "P150", "tags": ["ENT", "M03", "ENT:K-M03-001", "教师重点第46条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-047", "kc_id": "ENT:K-M03-001", "module": "M03", "type": "keypoint_recall", "front": "教师重点第47条（M03）：请复述本条核心要点（提示：后鼻孔主要由蝶骨体（上）、蝶骨翼突内侧板（外）、…）", "back": "后鼻孔主要由蝶骨体（上）、蝶骨翼突内侧板（外）、腭骨水平部后缘（底）、犁骨的后缘（内）共同围成。（P159）", "source_quote": "后鼻孔主要由蝶骨体（上）、蝶骨翼突内侧板（外）、腭骨水平部后缘（底）、犁骨的后缘（内）共同围成。（P159）", "source_page": "P150", "tags": ["ENT", "M03", "ENT:K-M03-001", "教师重点第47条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-048", "kc_id": "ENT:K-M03-004", "module": "M03", "type": "keypoint_recall", "front": "教师重点第48条（M03）：请复述本条核心要点（提示：鼻前庭的鼻毛对空气中较大的粉尘颗粒及细菌有阻挡和…）", "back": "鼻前庭的鼻毛对空气中较大的粉尘颗粒及细菌有阻挡和过滤的作用。喷嚏反射可清除侵入鼻腔的粉尘和微小异物，鼻腔的清洁作用主要由鼻腔黏膜表面的黏液纤毛系统完成的。（P161）", "source_quote": "鼻前庭的鼻毛对空气中较大的粉尘颗粒及细菌有阻挡和过滤的作用。喷嚏反射可清除侵入鼻腔的粉尘和微小异物，鼻腔的清洁作用主要由鼻腔黏膜表面的黏液纤毛系统完成的。（P161）", "source_page": "P161", "tags": ["ENT", "M03", "ENT:K-M03-004", "教师重点第48条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-049", "kc_id": "ENT:K-M03-005", "module": "M03", "type": "keypoint_recall", "front": "教师重点第49条（M03）：请复述本条核心要点（提示：嗅区黏膜主要感受嗅觉功能，嗅觉上皮主要由嗅细胞、…）", "back": "嗅区黏膜主要感受嗅觉功能，嗅觉上皮主要由嗅细胞、支持细胞和基底细胞组成。（P162）", "source_quote": "嗅区黏膜主要感受嗅觉功能，嗅觉上皮主要由嗅细胞、支持细胞和基底细胞组成。（P162）", "source_page": "P162", "tags": ["ENT", "M03", "ENT:K-M03-005", "教师重点第49条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-050", "kc_id": "ENT:K-M03-009", "module": "M03", "type": "keypoint_recall", "front": "教师重点第50条（M03）：请复述本条核心要点（提示：眶上壁深处为视神经孔所在处，该孔的内侧以薄骨板与…）", "back": "眶上壁深处为视神经孔所在处，该孔的内侧以薄骨板与后组筛窦及蝶窦相隔；外侧即眶上壁与外壁交界处为眶上裂，有动眼神经，滑车神经、展神经、三叉神经第一支及眼上静脉通过。（P157）", "source_quote": "眶上壁深处为视神经孔所在处，该孔的内侧以薄骨板与后组筛窦及蝶窦相隔；外侧即眶上壁与外壁交界处为眶上裂，有动眼神经，滑车神经、展神经、三叉神经第一支及眼上静脉通过。（P157）", "source_page": "P157", "tags": ["ENT", "M03", "ENT:K-M03-009", "教师重点第50条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-051", "kc_id": "ENT:K-M03-005", "module": "M03", "type": "keypoint_recall", "front": "教师重点第51条（M03）：请复述本条核心要点（提示：嗅区黏膜分布在鼻腔顶中部、向下至鼻中隔上部及鼻腔…）", "back": "嗅区黏膜分布在鼻腔顶中部、向下至鼻中隔上部及鼻腔外侧壁上部的嗅裂区域。（P163）", "source_quote": "嗅区黏膜分布在鼻腔顶中部、向下至鼻中隔上部及鼻腔外侧壁上部的嗅裂区域。（P163）", "source_page": "P162", "tags": ["ENT", "M03", "ENT:K-M03-005", "教师重点第51条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-052", "kc_id": "ENT:K-M03-005", "module": "M03", "type": "keypoint_recall", "front": "教师重点第52条（M03）：请复述本条核心要点（提示：嗅区黏膜为假复层无纤毛柱状上皮，由支持细胞，嗅细…）", "back": "嗅区黏膜为假复层无纤毛柱状上皮，由支持细胞，嗅细胞及嗅细胞组成。（P163）", "source_quote": "嗅区黏膜为假复层无纤毛柱状上皮，由支持细胞，嗅细胞及嗅细胞组成。（P163）", "source_page": "P162", "tags": ["ENT", "M03", "ENT:K-M03-005", "教师重点第52条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-053", "kc_id": "ENT:K-M03-010", "module": "M03", "type": "keypoint_recall", "front": "教师重点第53条（M03）：请复述本条核心要点（提示：鼻肺反射是以鼻腔黏膜三叉神经末梢为传出支，以三叉…）", "back": "鼻肺反射是以鼻腔黏膜三叉神经末梢为传出支，以三叉神经及迷走神经核为其中枢核团，形成的反射弧。鼻部受到各种非特异性刺激后反射性地引起同侧支气管收缩，进而减少肺通气量。鼻肺反射是鼻腔局部刺激和病变引起支气管病变的原因之一。（P164）", "source_quote": "鼻肺反射是以鼻腔黏膜三叉神经末梢为传出支，以三叉神经及迷走神经核为其中枢核团，形成的反射弧。鼻部受到各种非特异性刺激后反射性地引起同侧支气管收缩，进而减少肺通气量。鼻肺反射是鼻腔局部刺激和病变引起支气管病变的原因之一。（P164）", "source_page": "P164", "tags": ["ENT", "M03", "ENT:K-M03-010", "教师重点第53条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-054", "kc_id": "ENT:K-M03-006", "module": "M03", "type": "keypoint_recall", "front": "教师重点第54条（M03）：请复述本条核心要点（提示：外鼻的静脉可经内眦静脉和面静脉汇入颈内静脉。内眦…）", "back": "外鼻的静脉可经内眦静脉和面静脉汇入颈内静脉。内眦静脉可经眼上、眼下静脉而与海绵窦相通，静脉管内无瓣膜使血液可双向流动，故当鼻、面部感染和疖肿时，若治疗不当或用力挤压可能引发海绵窦栓塞或其他颅内并发症。（P157）", "source_quote": "外鼻的静脉可经内眦静脉和面静脉汇入颈内静脉。内眦静脉可经眼上、眼下静脉而与海绵窦相通，静脉管内无瓣膜使血液可双向流动，故当鼻、面部感染和疖肿时，若治疗不当或用力挤压可能引发海绵窦栓塞或其他颅内并发症。（P157）", "source_page": "P151", "tags": ["ENT", "M03", "ENT:K-M03-006", "教师重点第54条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-055", "kc_id": "ENT:K-M03-011", "module": "M03", "type": "keypoint_recall", "front": "教师重点第55条（M03）：请复述本条核心要点（提示：鼻腔鼻窦的炎症，一般先发生在鼻腔，炎症扩散可伴发…）", "back": "鼻腔鼻窦的炎症，一般先发生在鼻腔，炎症扩散可伴发鼻窦炎症；可一侧发生，也可双侧；其中上颌窦炎症最为常见；鼻窦炎也可以单独孤立存在。（P189）", "source_quote": "鼻腔鼻窦的炎症，一般先发生在鼻腔，炎症扩散可伴发鼻窦炎症；可一侧发生，也可双侧；其中上颌窦炎症最为常见；鼻窦炎也可以单独孤立存在。（P189）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-011", "教师重点第55条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-056", "kc_id": "ENT:K-M03-012", "module": "M03", "type": "keypoint_recall", "front": "教师重点第56条（M03）：请复述本条核心要点（提示：病毒感染是急性鼻炎发生的首要因素，可继发细菌感染…）", "back": "病毒感染是急性鼻炎发生的首要因素，可继发细菌感染；急性鼻炎多通过呼吸道吸入病毒引起，全身性因素及局部因素等均可诱发。（P189）", "source_quote": "病毒感染是急性鼻炎发生的首要因素，可继发细菌感染；急性鼻炎多通过呼吸道吸入病毒引起，全身性因素及局部因素等均可诱发。（P189）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-012", "教师重点第56条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-057", "kc_id": "ENT:K-M03-013", "module": "M03", "type": "keypoint_recall", "front": "教师重点第57条（M03）：请复述本条核心要点（提示：急性鼻窦炎初期表现为鼻部症状，可伴有耳部症状，症…）", "back": "急性鼻窦炎初期表现为鼻部症状，可伴有耳部症状，症状严重者可出现全身症状；检查可提示鼻黏膜充血肿胀，鼻腔可见分泌物，初期为水样，逐渐可变为黏性、黏脓性或脓性。（P189）", "source_quote": "急性鼻窦炎初期表现为鼻部症状，可伴有耳部症状，症状严重者可出现全身症状；检查可提示鼻黏膜充血肿胀，鼻腔可见分泌物，初期为水样，逐渐可变为黏性、黏脓性或脓性。（P189）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-013", "教师重点第57条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-058", "kc_id": "ENT:K-M03-012", "module": "M03", "type": "keypoint_recall", "front": "教师重点第58条（M03）：请复述本条核心要点（提示：急性鼻炎向邻近组织扩散，可伴发急性鼻窦炎、急性中…）", "back": "急性鼻炎向邻近组织扩散，可伴发急性鼻窦炎、急性中耳炎、急性咽炎、喉炎、急性气管、支气管炎等。（P189）", "source_quote": "急性鼻炎向邻近组织扩散，可伴发急性鼻窦炎、急性中耳炎、急性咽炎、喉炎、急性气管、支气管炎等。（P189）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-012", "教师重点第58条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-059", "kc_id": "ENT:K-M03-012", "module": "M03", "type": "keypoint_recall", "front": "教师重点第59条（M03）：请复述本条核心要点（提示：需要和急性鼻炎相鉴别的疾病有流感、变应性鼻炎、血…）", "back": "需要和急性鼻炎相鉴别的疾病有流感、变应性鼻炎、血管运动性鼻炎、急性传染病等。（P189）", "source_quote": "需要和急性鼻炎相鉴别的疾病有流感、变应性鼻炎、血管运动性鼻炎、急性传染病等。（P189）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-012", "教师重点第59条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-060", "kc_id": "ENT:K-M03-012", "module": "M03", "type": "keypoint_recall", "front": "教师重点第60条（M03）：请复述本条核心要点（提示：对于急性鼻炎，对症支持治疗为主，预防并发症；可使…）", "back": "对于急性鼻炎，对症支持治疗为主，预防并发症；可使用鼻用减充血剂、鼻用糖皮质激素；合并细菌感染时，可应用抗生素治疗。急性鼻炎亦可采用中医中药辅助治疗。（P189）", "source_quote": "对于急性鼻炎，对症支持治疗为主，预防并发症；可使用鼻用减充血剂、鼻用糖皮质激素；合并细菌感染时，可应用抗生素治疗。急性鼻炎亦可采用中医中药辅助治疗。（P189）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-012", "教师重点第60条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-061", "kc_id": "ENT:K-M03-011", "module": "M03", "type": "keypoint_recall", "front": "教师重点第61条（M03）：请复述本条核心要点（提示：鼻窦的特点有：窦口小，鼻道狭窄，易于阻塞；鼻腔黏…）", "back": "鼻窦的特点有：窦口小，鼻道狭窄，易于阻塞；鼻腔黏膜炎症容易影响鼻窦黏膜；各鼻窦会互相累及；各鼻窦有自身引流特点；儿童亦可患有鼻窦炎。（P191）", "source_quote": "鼻窦的特点有：窦口小，鼻道狭窄，易于阻塞；鼻腔黏膜炎症容易影响鼻窦黏膜；各鼻窦会互相累及；各鼻窦有自身引流特点；儿童亦可患有鼻窦炎。（P191）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-011", "教师重点第61条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-062", "kc_id": "ENT:K-M03-013", "module": "M03", "type": "keypoint_recall", "front": "教师重点第62条（M03）：请复述本条核心要点（提示：急性鼻窦炎可能的局部因素是鼻腔疾病、邻近器官的感…）", "back": "急性鼻窦炎可能的局部因素是鼻腔疾病、邻近器官的感染、鼻窦外伤或异物、医源性感染以及气压改变。（P191）", "source_quote": "急性鼻窦炎可能的局部因素是鼻腔疾病、邻近器官的感染、鼻窦外伤或异物、医源性感染以及气压改变。（P191）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-013", "教师重点第62条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-063", "kc_id": "ENT:K-M03-013", "module": "M03", "type": "keypoint_recall", "front": "教师重点第63条（M03）：请复述本条核心要点（提示：急性鼻窦炎多见于化脓性球菌、杆菌、厌氧菌等。（P…）", "back": "急性鼻窦炎多见于化脓性球菌、杆菌、厌氧菌等。（P191）", "source_quote": "急性鼻窦炎多见于化脓性球菌、杆菌、厌氧菌等。（P191）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-013", "教师重点第63条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-064", "kc_id": "ENT:K-M03-013", "module": "M03", "type": "keypoint_recall", "front": "教师重点第64条（M03）：请复述本条核心要点（提示：急性鼻窦炎的临床表现可表现为局部症状，如鼻塞、脓…）", "back": "急性鼻窦炎的临床表现可表现为局部症状，如鼻塞、脓性分泌物、头痛或局部疼痛、嗅觉减退；也可以表现为全身症状，如畏寒发热、恶心呕吐及消化道症状。（P191）", "source_quote": "急性鼻窦炎的临床表现可表现为局部症状，如鼻塞、脓性分泌物、头痛或局部疼痛、嗅觉减退；也可以表现为全身症状，如畏寒发热、恶心呕吐及消化道症状。（P191）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-013", "教师重点第64条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-065", "kc_id": "ENT:K-M03-013", "module": "M03", "type": "keypoint_recall", "front": "教师重点第65条（M03）：请复述本条核心要点（提示：急性后组筛窦炎的位置，与急性蝶窦炎相似，可表现为…）", "back": "急性后组筛窦炎的位置，与急性蝶窦炎相似，可表现为颅底或眼球深部钝痛。（P191）", "source_quote": "急性后组筛窦炎的位置，与急性蝶窦炎相似，可表现为颅底或眼球深部钝痛。（P191）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-013", "教师重点第65条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-066", "kc_id": "ENT:K-M03-013", "module": "M03", "type": "keypoint_recall", "front": "教师重点第66条（M03）：请复述本条核心要点（提示：急性额窦炎，晨起后鼻腔分泌物流出，堵塞鼻额管，额…）", "back": "急性额窦炎，晨起后鼻腔分泌物流出，堵塞鼻额管，额窦腔内产生负压甚至真空，发生真空性头痛；中午以后，额窦内分泌物排空，疼痛逐渐缓解。（P191）", "source_quote": "急性额窦炎，晨起后鼻腔分泌物流出，堵塞鼻额管，额窦腔内产生负压甚至真空，发生真空性头痛；中午以后，额窦内分泌物排空，疼痛逐渐缓解。（P191）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-013", "教师重点第66条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-067", "kc_id": "ENT:K-M03-014", "module": "M03", "type": "keypoint_recall", "front": "教师重点第67条（M03）：请复述本条核心要点（提示：诊断性上颌窦穿刺冲洗有利于了解上颌窦内有无脓性分…）", "back": "诊断性上颌窦穿刺冲洗有利于了解上颌窦内有无脓性分泌物，穿刺冲洗并注入抗生素，是鼻窦炎治疗的有效手段之一。（P201）", "source_quote": "诊断性上颌窦穿刺冲洗有利于了解上颌窦内有无脓性分泌物，穿刺冲洗并注入抗生素，是鼻窦炎治疗的有效手段之一。（P201）", "source_page": "P201", "tags": ["ENT", "M03", "ENT:K-M03-014", "教师重点第67条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-068", "kc_id": "ENT:K-M03-013", "module": "M03", "type": "keypoint_recall", "front": "教师重点第68条（M03）：请复述本条核心要点（提示：急性鼻窦炎治疗原则：根除病因；解除鼻腔鼻窦引流和…）", "back": "急性鼻窦炎治疗原则：根除病因；解除鼻腔鼻窦引流和通气障碍；控制感染和预防并发症。（P191）", "source_quote": "急性鼻窦炎治疗原则：根除病因；解除鼻腔鼻窦引流和通气障碍；控制感染和预防并发症。（P191）", "source_page": "P189", "tags": ["ENT", "M03", "ENT:K-M03-013", "教师重点第68条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-069", "kc_id": "ENT:K-M03-015", "module": "M03", "type": "keypoint_recall", "front": "教师重点第69条（M03）：请复述本条核心要点（提示：变应性鼻炎属IgE介导的Ⅰ型变态反应。（P196…）", "back": "变应性鼻炎属IgE介导的Ⅰ型变态反应。（P196）", "source_quote": "变应性鼻炎属IgE介导的Ⅰ型变态反应。（P196）", "source_page": "P196", "tags": ["ENT", "M03", "ENT:K-M03-015", "教师重点第69条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-070", "kc_id": "ENT:K-M03-015", "module": "M03", "type": "keypoint_recall", "front": "教师重点第70条（M03）：请复述本条核心要点（提示：变应性鼻炎早发相症状发生于与变应原接触的数分钟内…）", "back": "变应性鼻炎早发相症状发生于与变应原接触的数分钟内，主要由肥大细胞/嗜碱粒细胞脱颗粒释放的炎性介质引起。季节性变应原主要指木本类、禾本和草本类的风媒花粉。变应性鼻炎以鼻痒、阵发性连续喷嚏、大量水样鼻涕和鼻塞为临床主要特征，由于鼻黏膜水肿明显，部分患者尚有嗅觉减退。变应性鼻炎诊断主要依靠病史、典型的临床症状和体征以及特异性变应原检查。病史对于诊断非常重要，通过详尽地病史调查，如发病季节、时间、诱因、程度，生活和工作环境，家族及个人过敏史，有否哮喘、皮炎等，就可大致判定鼻炎症状是否为变应性。最后确诊病史须与特异性变应原检测结果相符。预防和治疗花粉症最有效的治疗方法是避免接触变应原（P196）", "source_quote": "变应性鼻炎早发相症状发生于与变应原接触的数分钟内，主要由肥大细胞/嗜碱粒细胞脱颗粒释放的炎性介质引起。季节性变应原主要指木本类、禾本和草本类的风媒花粉。变应性鼻炎以鼻痒、阵发性连续喷嚏、大量水样鼻涕和鼻塞为临床主要特征，由于鼻黏膜水肿明显，部分患者尚有嗅觉减退。变应性鼻炎诊断主要依靠病史、典型的临床症状和体征以及特异性变应原检查。病史对于诊断非常重要，通过详尽地病史调查，如发病季节、时间、诱因、程度，生活和工作环境，家族及个人过敏史，有否哮喘、皮炎等，就可大致判定鼻炎症状是否为变应性。最后确诊病史须与特异性变应原检测结果相符。预防和治疗花粉症最有效的治疗方法是避免接触变应原（P196）", "source_page": "P196", "tags": ["ENT", "M03", "ENT:K-M03-015", "教师重点第70条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-071", "kc_id": "ENT:K-M03-015", "module": "M03", "type": "cloze", "front": "色甘酸钠是色酮类药物，有稳定肥大细胞膜的作用，可阻止该细胞脱颗粒和释放介质，但起效时间多在{{c1::1周}}以后，故仅适用于轻症变应性鼻炎患者或预防用药。（P196）", "back": "色甘酸钠是色酮类药物，有稳定肥大细胞膜的作用，可阻止该细胞脱颗粒和释放介质，但起效时间多在1周以后，故仅适用于轻症变应性鼻炎患者或预防用药。（P196）", "source_quote": "色甘酸钠是色酮类药物，有稳定肥大细胞膜的作用，可阻止该细胞脱颗粒和释放介质，但起效时间多在1周以后，故仅适用于轻症变应性鼻炎患者或预防用药。（P196）", "source_page": "P196", "tags": ["ENT", "M03", "ENT:K-M03-015", "教师重点第71条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-072", "kc_id": "ENT:K-M03-016", "module": "M03", "type": "keypoint_recall", "front": "教师重点第72条（M03）：请复述本条核心要点（提示：血管运动性鼻炎病因不明，精神紧张、焦虑，环境温度…）", "back": "血管运动性鼻炎病因不明，精神紧张、焦虑，环境温度突然变化，内分泌功能紊乱，均可引起副交感神经递质释放过多，或者引起组胺的非特异性释放，血管扩张，腺体分泌增多，导致相应临床症状。长期使用血管收缩剂可引起药物性鼻炎。（P196）", "source_quote": "血管运动性鼻炎病因不明，精神紧张、焦虑，环境温度突然变化，内分泌功能紊乱，均可引起副交感神经递质释放过多，或者引起组胺的非特异性释放，血管扩张，腺体分泌增多，导致相应临床症状。长期使用血管收缩剂可引起药物性鼻炎。（P196）", "source_page": "P196", "tags": ["ENT", "M03", "ENT:K-M03-016", "教师重点第72条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-073", "kc_id": "ENT:K-M03-017", "module": "M03", "type": "keypoint_recall", "front": "教师重点第73条（M03）：请复述本条核心要点（提示：萎缩性鼻炎的医源性原因是鼻腔组织特别是下鼻甲切除…）", "back": "萎缩性鼻炎的医源性原因是鼻腔组织特别是下鼻甲切除过多，导致鼻腔过分宽大，通气过度，下鼻甲黏膜下低温等离子射频消融术不会引起萎缩性鼻炎。萎缩性鼻炎的临床表现有①鼻及鼻咽部干燥感：鼻黏膜腺体萎缩，分泌减少，鼻内常有结痂，有时带血，甚至鼻出血。②鼻塞和嗅觉减退或失嗅：因鼻腔痂皮阻塞或因鼻黏膜萎缩，神经感觉迟钝，不能察觉气流通过，嗅区黏膜萎缩或被痂皮堵塞导致嗅觉减退甚至消失。③头痛、头昏：头痛多位于前额、颞侧或后枕部。④恶臭：多见于病情严重和晚期患者。呼气有特殊臭味，但由于嗅觉减退或丧失，患者自己不能闻到。⑤耳鸣、听力下降：病变波及咽鼓管引起咽鼓管功能障碍，出现分泌性中耳炎症状。⑥咽干、声嘶以及刺激性干咳，病变累及咽喉所致。", "source_quote": "萎缩性鼻炎的医源性原因是鼻腔组织特别是下鼻甲切除过多，导致鼻腔过分宽大，通气过度，下鼻甲黏膜下低温等离子射频消融术不会引起萎缩性鼻炎。萎缩性鼻炎的临床表现有①鼻及鼻咽部干燥感：鼻黏膜腺体萎缩，分泌减少，鼻内常有结痂，有时带血，甚至鼻出血。②鼻塞和嗅觉减退或失嗅：因鼻腔痂皮阻塞或因鼻黏膜萎缩，神经感觉迟钝，不能察觉气流通过，嗅区黏膜萎缩或被痂皮堵塞导致嗅觉减退甚至消失。③头痛、头昏：头痛多位于前额、颞侧或后枕部。④恶臭：多见于病情严重和晚期患者。呼气有特殊臭味，但由于嗅觉减退或丧失，患者自己不能闻到。⑤耳鸣、听力下降：病变波及咽鼓管引起咽鼓管功能障碍，出现分泌性中耳炎症状。⑥咽干、声嘶以及刺激性干咳，病变累及咽喉所致。", "source_page": "P199", "tags": ["ENT", "M03", "ENT:K-M03-017", "教师重点第73条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-074", "kc_id": "ENT:K-M03-017", "module": "M03", "type": "cloze", "front": "萎缩性鼻炎鼻腔局部治疗可选择：生理盐水鼻腔冲洗；复方薄荷滴鼻剂、{{c1::1%}}～3%链霉素液滴鼻、50%葡萄糖滴鼻等滴鼻，可润滑黏膜，软化干痂、抑制细菌生长和促进黏膜腺体分泌等作用。麻黄碱属血管收缩剂，萎缩性鼻炎应禁用。（P199）", "back": "萎缩性鼻炎鼻腔局部治疗可选择：生理盐水鼻腔冲洗；复方薄荷滴鼻剂、1%～3%链霉素液滴鼻、50%葡萄糖滴鼻等滴鼻，可润滑黏膜，软化干痂、抑制细菌生长和促进黏膜腺体分泌等作用。麻黄碱属血管收缩剂，萎缩性鼻炎应禁用。（P199）", "source_quote": "萎缩性鼻炎鼻腔局部治疗可选择：生理盐水鼻腔冲洗；复方薄荷滴鼻剂、1%～3%链霉素液滴鼻、50%葡萄糖滴鼻等滴鼻，可润滑黏膜，软化干痂、抑制细菌生长和促进黏膜腺体分泌等作用。麻黄碱属血管收缩剂，萎缩性鼻炎应禁用。（P199）", "source_page": "P199", "tags": ["ENT", "M03", "ENT:K-M03-017", "教师重点第74条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-075", "kc_id": "ENT:K-M03-018", "module": "M03", "type": "cloze", "front": "根据《中国慢性鼻窦炎诊断和治疗指南（2018）》，慢性鼻窦炎的定义是鼻窦黏膜的慢性炎性疾病，病程超过{{c1::12周}}；根据《中国慢性鼻窦炎诊断和治疗指南（2018）》，推荐鼻用糖皮质激素作为慢性鼻窦炎的一线首选治疗药物，疗程不少于12周。鼻内镜手术已被临床实践证明为治疗鼻窦炎的有效方法；儿童慢性鼻窦炎患者的手术指征需严格把握，12岁以下原则不宜手术。（P201）", "back": "根据《中国慢性鼻窦炎诊断和治疗指南（2018）》，慢性鼻窦炎的定义是鼻窦黏膜的慢性炎性疾病，病程超过12周；根据《中国慢性鼻窦炎诊断和治疗指南（2018）》，推荐鼻用糖皮质激素作为慢性鼻窦炎的一线首选治疗药物，疗程不少于12周。鼻内镜手术已被临床实践证明为治疗鼻窦炎的有效方法；儿童慢性鼻窦炎患者的手术指征需严格把握，12岁以下原则不宜手术。（P201）", "source_quote": "根据《中国慢性鼻窦炎诊断和治疗指南（2018）》，慢性鼻窦炎的定义是鼻窦黏膜的慢性炎性疾病，病程超过12周；根据《中国慢性鼻窦炎诊断和治疗指南（2018）》，推荐鼻用糖皮质激素作为慢性鼻窦炎的一线首选治疗药物，疗程不少于12周。鼻内镜手术已被临床实践证明为治疗鼻窦炎的有效方法；儿童慢性鼻窦炎患者的手术指征需严格把握，12岁以下原则不宜手术。（P201）", "source_page": "P201", "tags": ["ENT", "M03", "ENT:K-M03-018", "教师重点第75条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-076", "kc_id": "ENT:K-M03-019", "module": "M03", "type": "keypoint_recall", "front": "教师重点第76条（M03）：请复述本条核心要点（提示：以嗜酸性粒细胞浸润为主的鼻息肉由2型炎症反应介导…）", "back": "以嗜酸性粒细胞浸润为主的鼻息肉由2型炎症反应介导，哮喘合并率高。 （P201）", "source_quote": "以嗜酸性粒细胞浸润为主的鼻息肉由2型炎症反应介导，哮喘合并率高。 （P201）", "source_page": "P201", "tags": ["ENT", "M03", "ENT:K-M03-019", "教师重点第76条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-077", "kc_id": "ENT:K-M03-020", "module": "M03", "type": "keypoint_recall", "front": "教师重点第77条（M03）：请复述本条核心要点（提示：功能性鼻内镜鼻窦手术（functional en…）", "back": "功能性鼻内镜鼻窦手术（functional endoscopic sinus surgery，FESS），在鼻内镜和电视监视下，切除鼻息肉，开放鼻窦，纠正鼻中隔偏曲和泡状中鼻甲等鼻腔解剖学异常，尽可能保留鼻窦黏膜，重建鼻腔鼻窦通气引流，为鼻腔鼻窦黏膜炎症的良性转归创造条件。（P204）", "source_quote": "功能性鼻内镜鼻窦手术（functional endoscopic sinus surgery，FESS），在鼻内镜和电视监视下，切除鼻息肉，开放鼻窦，纠正鼻中隔偏曲和泡状中鼻甲等鼻腔解剖学异常，尽可能保留鼻窦黏膜，重建鼻腔鼻窦通气引流，为鼻腔鼻窦黏膜炎症的良性转归创造条件。（P204）", "source_page": "P204", "tags": ["ENT", "M03", "ENT:K-M03-020", "教师重点第77条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-078", "kc_id": "ENT:K-M03-019", "module": "M03", "type": "keypoint_recall", "front": "教师重点第78条（M03）：请复述本条核心要点（提示：已有多个全球多中心随机对照临床研究证实使用针对I…）", "back": "已有多个全球多中心随机对照临床研究证实使用针对IgE、IL-5和IL-4受体的单克隆抗体肌内注射可以显著缩小鼻息肉体积，缓解鼻塞、流涕等症状，改善嗅觉，提高生活质量。目前部分生物制剂已在欧美获得治疗难治性重度CRSwNP的适应证，使这部分患者免于承受反复手术或长期使用口服糖皮质激素的风险。（P204）", "source_quote": "已有多个全球多中心随机对照临床研究证实使用针对IgE、IL-5和IL-4受体的单克隆抗体肌内注射可以显著缩小鼻息肉体积，缓解鼻塞、流涕等症状，改善嗅觉，提高生活质量。目前部分生物制剂已在欧美获得治疗难治性重度CRSwNP的适应证，使这部分患者免于承受反复手术或长期使用口服糖皮质激素的风险。（P204）", "source_page": "P201", "tags": ["ENT", "M03", "ENT:K-M03-019", "教师重点第78条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-079", "kc_id": "ENT:K-M03-018", "module": "M03", "type": "keypoint_recall", "front": "教师重点第79条（M03）：请复述本条核心要点（提示：鼻塞，黏性或黏脓性鼻涕为慢性鼻窦炎的主要症状；头…）", "back": "鼻塞，黏性或黏脓性鼻涕为慢性鼻窦炎的主要症状；头面部胀痛，嗅觉减退或丧失为慢性鼻窦炎的次要症状；鼻痒，喷嚏，水样涕为过敏性鼻炎的典型症状，慢性鼻窦炎患者可同时伴有过敏性鼻炎；慢性鼻窦炎的诊断主要依据症状、查体和/或鼻窦CT进行。（P204）", "source_quote": "鼻塞，黏性或黏脓性鼻涕为慢性鼻窦炎的主要症状；头面部胀痛，嗅觉减退或丧失为慢性鼻窦炎的次要症状；鼻痒，喷嚏，水样涕为过敏性鼻炎的典型症状，慢性鼻窦炎患者可同时伴有过敏性鼻炎；慢性鼻窦炎的诊断主要依据症状、查体和/或鼻窦CT进行。（P204）", "source_page": "P201", "tags": ["ENT", "M03", "ENT:K-M03-018", "教师重点第79条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-080", "kc_id": "ENT:K-M03-003", "module": "M03", "type": "keypoint_recall", "front": "教师重点第80条（M03）：请复述本条核心要点（提示：营养素或维生素C、K、P或Ca缺乏，均可能导致鼻…）", "back": "营养素或维生素C、K、P或Ca缺乏，均可能导致鼻出血；DSA或CTA、前鼻镜检查、鼻内镜检查、血常规等可以进行鼻出血评估的检查；长期、反复、少量出血的情况，应积极寻找病因；大量出血者，应先止血，再找病因；鼻腔后部的出血多源于动脉、出血较大，难以控制；情绪紧张者，可予以安慰、镇静；条件允许，可采用鼻内镜检查并止血；对于鼻出血的局部治疗，烧灼法、填塞法、血管结扎法及血管栓塞法均可能控制鼻出血；前鼻孔填塞是较常用的有效止血方法；适用于出血量大、出血位置不明确的患者；填塞时多采用口袋状进行填塞纱条；前鼻孔填塞后，可酌情使用抗生素；前鼻孔填塞纱条，一般不超过3～5天取出；后鼻孔填塞治疗，一般先行后鼻孔填塞，再联合前鼻孔填塞；多用于鼻腔后段、出血量较多的患者；后鼻孔填塞后，可酌情使用抗生素；老年患者行后鼻孔填塞，应评估心肺功能；后鼻孔填塞，最多5～6天取出。（P222）", "source_quote": "营养素或维生素C、K、P或Ca缺乏，均可能导致鼻出血；DSA或CTA、前鼻镜检查、鼻内镜检查、血常规等可以进行鼻出血评估的检查；长期、反复、少量出血的情况，应积极寻找病因；大量出血者，应先止血，再找病因；鼻腔后部的出血多源于动脉、出血较大，难以控制；情绪紧张者，可予以安慰、镇静；条件允许，可采用鼻内镜检查并止血；对于鼻出血的局部治疗，烧灼法、填塞法、血管结扎法及血管栓塞法均可能控制鼻出血；前鼻孔填塞是较常用的有效止血方法；适用于出血量大、出血位置不明确的患者；填塞时多采用口袋状进行填塞纱条；前鼻孔填塞后，可酌情使用抗生素；前鼻孔填塞纱条，一般不超过3～5天取出；后鼻孔填塞治疗，一般先行后鼻孔填塞，再联合前鼻孔填塞；多用于鼻腔后段、出血量较多的患者；后鼻孔填塞后，可酌情使用抗生素；老年患者行后鼻孔填塞，应评估心肺功能；后鼻孔填塞，最多5～6天取出。（P222）", "source_page": "P156", "tags": ["ENT", "M03", "ENT:K-M03-003", "教师重点第80条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-081", "kc_id": "ENT:K-M04-001", "module": "M04", "type": "cloze", "front": "咽的底部约平第6颈椎；喉咽（laryngopharynx）的位置，喉咽又称下咽（hypopharynx），位于喉的后方。上界：舌骨上缘（约第3颈椎水平）。下界：环状软骨下缘、食管入口（约第6颈椎水平）。因此，其后壁平对第3～6颈椎；咽的肌层按其功能的不同分为{{c1::3组}},包括3对横行的咽缩肌、3对纵行的咽提肌和5组腭帆肌；梨状窝（piriform recess）是喉咽部的重要结构，位于喉咽的两侧。它是由喉入口（喉口）外侧的杓会厌襞和甲状软骨内面之间形成的一个浅窝。（P248）", "back": "咽的底部约平第6颈椎；喉咽（laryngopharynx）的位置，喉咽又称下咽（hypopharynx），位于喉的后方。上界：舌骨上缘（约第3颈椎水平）。下界：环状软骨下缘、食管入口（约第6颈椎水平）。因此，其后壁平对第3～6颈椎；咽的肌层按其功能的不同分为3组,包括3对横行的咽缩肌、3对纵行的咽提肌和5组腭帆肌；梨状窝（piriform recess）是喉咽部的重要结构，位于喉咽的两侧。它是由喉入口（喉口）外侧的杓会厌襞和甲状软骨内面之间形成的一个浅窝。（P248）", "source_quote": "咽的底部约平第6颈椎；喉咽（laryngopharynx）的位置，喉咽又称下咽（hypopharynx），位于喉的后方。上界：舌骨上缘（约第3颈椎水平）。下界：环状软骨下缘、食管入口（约第6颈椎水平）。因此，其后壁平对第3～6颈椎；咽的肌层按其功能的不同分为3组,包括3对横行的咽缩肌、3对纵行的咽提肌和5组腭帆肌；梨状窝（piriform recess）是喉咽部的重要结构，位于喉咽的两侧。它是由喉入口（喉口）外侧的杓会厌襞和甲状软骨内面之间形成的一个浅窝。（P248）", "source_page": "P248", "tags": ["ENT", "M04", "ENT:K-M04-001", "教师重点第81条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-082", "kc_id": "ENT:K-M04-003", "module": "M04", "type": "keypoint_recall", "front": "教师重点第82条（M04）：请复述本条核心要点（提示：咽旁间隙四大神经”口诀: “舌舌副迷走”即：舌咽…）", "back": "咽旁间隙四大神经”口诀: “舌舌副迷走”即：舌咽神经、舌下神经、副神经、迷走神经。 临床提示：咽旁脓肿或肿瘤压迫该间隙，可能出现吞咽困难、发音障碍、舌偏斜、肩耸力减弱等神经症状。（P251）", "source_quote": "咽旁间隙四大神经”口诀: “舌舌副迷走”即：舌咽神经、舌下神经、副神经、迷走神经。 临床提示：咽旁脓肿或肿瘤压迫该间隙，可能出现吞咽困难、发音障碍、舌偏斜、肩耸力减弱等神经症状。（P251）", "source_page": "P251", "tags": ["ENT", "M04", "ENT:K-M04-003", "教师重点第82条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-083", "kc_id": "ENT:K-M04-004", "module": "M04", "type": "keypoint_recall", "front": "教师重点第83条（M04）：请复述本条核心要点（提示：咽淋巴环是上呼吸道免疫防线，参与病原体识别与免疫…）", "back": "咽淋巴环是上呼吸道免疫防线，参与病原体识别与免疫应答;“上咽鼓，两侧腭，下舌旁”（上：咽扁桃体；咽鼓管旁：咽鼓管扁桃体；两侧：腭扁桃体；下：舌扁桃体；旁：咽侧索）（P251）", "source_quote": "咽淋巴环是上呼吸道免疫防线，参与病原体识别与免疫应答;“上咽鼓，两侧腭，下舌旁”（上：咽扁桃体；咽鼓管旁：咽鼓管扁桃体；两侧：腭扁桃体；下：舌扁桃体；旁：咽侧索）（P251）", "source_page": "P251", "tags": ["ENT", "M04", "ENT:K-M04-004", "教师重点第83条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-084", "kc_id": "ENT:K-M04-005", "module": "M04", "type": "keypoint_recall", "front": "教师重点第84条（M04）：请复述本条核心要点（提示：咽为呼吸与消化的共同通道,具有下列生理功能：呼吸…）", "back": "咽为呼吸与消化的共同通道,具有下列生理功能：呼吸功能、言语形成、吞咽功能、防御保护功能、调节中耳气压功能、扁桃体的免疫功能。（P253）", "source_quote": "咽为呼吸与消化的共同通道,具有下列生理功能：呼吸功能、言语形成、吞咽功能、防御保护功能、调节中耳气压功能、扁桃体的免疫功能。（P253）", "source_page": "P253", "tags": ["ENT", "M04", "ENT:K-M04-005", "教师重点第84条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-085", "kc_id": "ENT:K-M04-006", "module": "M04", "type": "keypoint_recall", "front": "教师重点第85条（M04）：请复述本条核心要点（提示：乙型溶血性链球菌为急性扁桃体炎的主要致病菌，非溶…）", "back": "乙型溶血性链球菌为急性扁桃体炎的主要致病菌，非溶血性链球菌、葡萄球菌、肺炎链球菌、流感嗜血杆菌或腺病毒、鼻病毒、单纯性疱疹病毒等也可引起本病；抗生素应用为急性扁桃体炎主要治疗方法，首选青霉素。（P260）", "source_quote": "乙型溶血性链球菌为急性扁桃体炎的主要致病菌，非溶血性链球菌、葡萄球菌、肺炎链球菌、流感嗜血杆菌或腺病毒、鼻病毒、单纯性疱疹病毒等也可引起本病；抗生素应用为急性扁桃体炎主要治疗方法，首选青霉素。（P260）", "source_page": "P260", "tags": ["ENT", "M04", "ENT:K-M04-006", "教师重点第85条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-086", "kc_id": "ENT:K-M04-007", "module": "M04", "type": "keypoint_recall", "front": "教师重点第86条（M04）：请复述本条核心要点（提示：慢性扁桃体炎多由急性扁桃体炎反复发作或因扁桃体隐…）", "back": "慢性扁桃体炎多由急性扁桃体炎反复发作或因扁桃体隐窝引流不畅，窝内细菌、病毒滋生感染而演变为慢性炎症。链球菌和葡萄球菌为本病的主要致病菌；扁桃体切除术后并发症包括出血、伤口感染和肺部并发症。（P262）", "source_quote": "慢性扁桃体炎多由急性扁桃体炎反复发作或因扁桃体隐窝引流不畅，窝内细菌、病毒滋生感染而演变为慢性炎症。链球菌和葡萄球菌为本病的主要致病菌；扁桃体切除术后并发症包括出血、伤口感染和肺部并发症。（P262）", "source_page": "P262", "tags": ["ENT", "M04", "ENT:K-M04-007", "教师重点第86条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-087", "kc_id": "ENT:K-M04-008", "module": "M04", "type": "cloze", "front": "腺样体位于鼻咽部的后壁和顶部，为咽淋巴环的内环组成部分。出生时即存在，2～{{c1::6岁}}是增生旺盛时期，为腺样体的生理性肥大期，10岁以后逐渐萎缩，成人则大部分消失。腺样体肥大导致长期张口呼吸，可影响面容颌骨发育，形成“腺样体面容”；腺样体出生时即存在，2～6岁是增生旺盛时期，为腺样体的生理性肥大期，10岁以后逐渐萎缩;腺样体肥大常并发鼻炎、鼻窦炎，有鼻塞及流鼻涕等症状。说话时呈闭塞性鼻音，睡眠时发出鼾声、张口呼吸。严重者可引起阻塞性睡眠呼吸暂停低通气综合征;分为四度：Ⅰ度：腺样体阻塞鼻后孔≤25%；Ⅱ度：腺样体阻塞鼻后孔26%～50%；Ⅲ度：腺样体阻塞鼻后孔51%～75%；Ⅳ度：腺样体阻塞鼻后孔>75%；若保守治疗无效，应尽早经口或鼻内镜行腺样体切除术。手术前应仔细检查，排除禁忌证。手术常同扁桃体切除术一并施行，若扁桃体无明确的手术适应证，可单独切除腺样体。（P266）", "back": "腺样体位于鼻咽部的后壁和顶部，为咽淋巴环的内环组成部分。出生时即存在，2～6岁是增生旺盛时期，为腺样体的生理性肥大期，10岁以后逐渐萎缩，成人则大部分消失。腺样体肥大导致长期张口呼吸，可影响面容颌骨发育，形成“腺样体面容”；腺样体出生时即存在，2～6岁是增生旺盛时期，为腺样体的生理性肥大期，10岁以后逐渐萎缩;腺样体肥大常并发鼻炎、鼻窦炎，有鼻塞及流鼻涕等症状。说话时呈闭塞性鼻音，睡眠时发出鼾声、张口呼吸。严重者可引起阻塞性睡眠呼吸暂停低通气综合征;分为四度：Ⅰ度：腺样体阻塞鼻后孔≤25%；Ⅱ度：腺样体阻塞鼻后孔26%～50%；Ⅲ度：腺样体阻塞鼻后孔51%～75%；Ⅳ度：腺样体阻塞鼻后孔>75%；若保守治疗无效，应尽早经口或鼻内镜行腺样体切除术。手术前应仔细检查，排除禁忌证。手术常同扁桃体切除术一并施行，若扁桃体无明确的手术适应证，可单独切除腺样体。（P266）", "source_quote": "腺样体位于鼻咽部的后壁和顶部，为咽淋巴环的内环组成部分。出生时即存在，2～6岁是增生旺盛时期，为腺样体的生理性肥大期，10岁以后逐渐萎缩，成人则大部分消失。腺样体肥大导致长期张口呼吸，可影响面容颌骨发育，形成“腺样体面容”；腺样体出生时即存在，2～6岁是增生旺盛时期，为腺样体的生理性肥大期，10岁以后逐渐萎缩;腺样体肥大常并发鼻炎、鼻窦炎，有鼻塞及流鼻涕等症状。说话时呈闭塞性鼻音，睡眠时发出鼾声、张口呼吸。严重者可引起阻塞性睡眠呼吸暂停低通气综合征;分为四度：Ⅰ度：腺样体阻塞鼻后孔≤25%；Ⅱ度：腺样体阻塞鼻后孔26%～50%；Ⅲ度：腺样体阻塞鼻后孔51%～75%；Ⅳ度：腺样体阻塞鼻后孔>75%；若保守治疗无效，应尽早经口或鼻内镜行腺样体切除术。手术前应仔细检查，排除禁忌证。手术常同扁桃体切除术一并施行，若扁桃体无明确的手术适应证，可单独切除腺样体。（P266）", "source_page": "P266", "tags": ["ENT", "M04", "ENT:K-M04-008", "教师重点第87条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-088", "kc_id": "ENT:K-M04-009", "module": "M04", "type": "cloze", "front": "急性腺样体炎为儿童常见的疾病，以3～{{c1::10岁}}为多见，男女无差别。成年人的腺样体多已退化、消失，极少患此病。（P266）", "back": "急性腺样体炎为儿童常见的疾病，以3～10岁为多见，男女无差别。成年人的腺样体多已退化、消失，极少患此病。（P266）", "source_quote": "急性腺样体炎为儿童常见的疾病，以3～10岁为多见，男女无差别。成年人的腺样体多已退化、消失，极少患此病。（P266）", "source_page": "P266", "tags": ["ENT", "M04", "ENT:K-M04-009", "教师重点第88条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-089", "kc_id": "ENT:K-M04-010", "module": "M04", "type": "cloze", "front": "鼻咽纤维血管瘤是一种血管丰富、纤维成分多的良性肿瘤，但生长迅速，局部有侵袭性。典型人群：青少年男性（10～{{c1::25岁}}）主要症状：鼻出血、鼻塞;治疗：手术切除，必要时术前血管栓塞;生长特点：良性但局部侵袭性，易累及蝶骨、鼻腔和颅底。主要血供来自颈外动脉系统，尤其是上颌动脉（maxillary artery）及其分支。 肿瘤生长迅速，周围还可能有来自面动脉、蝶腭动脉、腭大动脉、枕动脉等的辅助血供，但上颌动脉是最主要来源。（P277）", "back": "鼻咽纤维血管瘤是一种血管丰富、纤维成分多的良性肿瘤，但生长迅速，局部有侵袭性。典型人群：青少年男性（10～25岁）主要症状：鼻出血、鼻塞;治疗：手术切除，必要时术前血管栓塞;生长特点：良性但局部侵袭性，易累及蝶骨、鼻腔和颅底。主要血供来自颈外动脉系统，尤其是上颌动脉（maxillary artery）及其分支。 肿瘤生长迅速，周围还可能有来自面动脉、蝶腭动脉、腭大动脉、枕动脉等的辅助血供，但上颌动脉是最主要来源。（P277）", "source_quote": "鼻咽纤维血管瘤是一种血管丰富、纤维成分多的良性肿瘤，但生长迅速，局部有侵袭性。典型人群：青少年男性（10～25岁）主要症状：鼻出血、鼻塞;治疗：手术切除，必要时术前血管栓塞;生长特点：良性但局部侵袭性，易累及蝶骨、鼻腔和颅底。主要血供来自颈外动脉系统，尤其是上颌动脉（maxillary artery）及其分支。 肿瘤生长迅速，周围还可能有来自面动脉、蝶腭动脉、腭大动脉、枕动脉等的辅助血供，但上颌动脉是最主要来源。（P277）", "source_page": "P277", "tags": ["ENT", "M04", "ENT:K-M04-010", "教师重点第89条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-090", "kc_id": "ENT:K-M04-011", "module": "M04", "type": "keypoint_recall", "front": "教师重点第90条（M04）：请复述本条核心要点（提示：扁桃体位于口咽腭弓之间，属于淋巴组织丰富的口咽结…）", "back": "扁桃体位于口咽腭弓之间，属于淋巴组织丰富的口咽结构。口咽区的扁桃体上皮覆盖为复层鳞状上皮，因此容易发生鳞状上皮恶变.扁桃体恶性肿瘤首选手术或放化疗方案，鳞状细胞癌是最常见类型，因此在口咽肿瘤评估中应优先考虑。（P281）", "source_quote": "扁桃体位于口咽腭弓之间，属于淋巴组织丰富的口咽结构。口咽区的扁桃体上皮覆盖为复层鳞状上皮，因此容易发生鳞状上皮恶变.扁桃体恶性肿瘤首选手术或放化疗方案，鳞状细胞癌是最常见类型，因此在口咽肿瘤评估中应优先考虑。（P281）", "source_page": "P281", "tags": ["ENT", "M04", "ENT:K-M04-011", "教师重点第90条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-091", "kc_id": "ENT:K-M04-012", "module": "M04", "type": "cloze", "front": "喉咽恶性肿瘤（hypopharyngeal carcinoma）是喉咽部的恶性肿瘤，约占咽喉恶性肿瘤的{{c1::5%}}-10%。病理类型：以鳞状细胞癌为主。部位分类：梨状窝型（piriform recess type）；环状软骨后区型（postcricoid type）；喉咽后壁型（posterior wall type） 早期症状特点：喉咽肿瘤早期常无明显症状，容易被忽视，导致就诊时多为中晚期。常见晚期症状：吞咽困难（单侧或双侧），颈部淋巴结肿大，声音嘶哑（部分病例），咽痛较轻或不明显。（P282）", "back": "喉咽恶性肿瘤（hypopharyngeal carcinoma）是喉咽部的恶性肿瘤，约占咽喉恶性肿瘤的5%-10%。病理类型：以鳞状细胞癌为主。部位分类：梨状窝型（piriform recess type）；环状软骨后区型（postcricoid type）；喉咽后壁型（posterior wall type） 早期症状特点：喉咽肿瘤早期常无明显症状，容易被忽视，导致就诊时多为中晚期。常见晚期症状：吞咽困难（单侧或双侧），颈部淋巴结肿大，声音嘶哑（部分病例），咽痛较轻或不明显。（P282）", "source_quote": "喉咽恶性肿瘤（hypopharyngeal carcinoma）是喉咽部的恶性肿瘤，约占咽喉恶性肿瘤的5%-10%。病理类型：以鳞状细胞癌为主。部位分类：梨状窝型（piriform recess type）；环状软骨后区型（postcricoid type）；喉咽后壁型（posterior wall type） 早期症状特点：喉咽肿瘤早期常无明显症状，容易被忽视，导致就诊时多为中晚期。常见晚期症状：吞咽困难（单侧或双侧），颈部淋巴结肿大，声音嘶哑（部分病例），咽痛较轻或不明显。（P282）", "source_page": "P282", "tags": ["ENT", "M04", "ENT:K-M04-012", "教师重点第91条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-092", "kc_id": "ENT:K-M05-001", "module": "M05", "type": "keypoint_recall", "front": "教师重点第92条（M05）：请复述本条核心要点（提示：环状软骨是喉气管中唯一完整的环形软骨，对保持喉气…）", "back": "环状软骨是喉气管中唯一完整的环形软骨，对保持喉气管的通畅至关重要。如果外伤或疾病引起环状软骨损伤，常可引起喉及气管狭窄，两侧声带之间的区域称为声门区，为喉腔中最狭窄的部位。（P290）", "source_quote": "环状软骨是喉气管中唯一完整的环形软骨，对保持喉气管的通畅至关重要。如果外伤或疾病引起环状软骨损伤，常可引起喉及气管狭窄，两侧声带之间的区域称为声门区，为喉腔中最狭窄的部位。（P290）", "source_page": "P290", "tags": ["ENT", "M05", "ENT:K-M05-001", "教师重点第92条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-093", "kc_id": "ENT:K-M05-003", "module": "M05", "type": "keypoint_recall", "front": "教师重点第93条（M05）：请复述本条核心要点（提示：环杓后肌是声带外展肌，环杓侧肌和杓肌是声带内收肌…）", "back": "环杓后肌是声带外展肌，环杓侧肌和杓肌是声带内收肌，环甲肌和甲杓肌是声带张力肌，杓会厌肌使会厌活动；会厌可分为舌面和喉面，舌面组织疏松，感染时容易出现肿胀。（P290）", "source_quote": "环杓后肌是声带外展肌，环杓侧肌和杓肌是声带内收肌，环甲肌和甲杓肌是声带张力肌，杓会厌肌使会厌活动；会厌可分为舌面和喉面，舌面组织疏松，感染时容易出现肿胀。（P290）", "source_page": "P290", "tags": ["ENT", "M05", "ENT:K-M05-003", "教师重点第93条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-094", "kc_id": "ENT:K-M05-005", "module": "M05", "type": "keypoint_recall", "front": "教师重点第94条（M05）：请复述本条核心要点（提示：喉的淋巴以声门区为界，分为声门上区组和声门下区组…）", "back": "喉的淋巴以声门区为界，分为声门上区组和声门下区组，声门上区的淋巴管最为丰富。（P295）", "source_quote": "喉的淋巴以声门区为界，分为声门上区组和声门下区组，声门上区的淋巴管最为丰富。（P295）", "source_page": "P295", "tags": ["ENT", "M05", "ENT:K-M05-005", "教师重点第94条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-095", "kc_id": "ENT:K-M05-007", "module": "M05", "type": "keypoint_recall", "front": "教师重点第95条（M05）：请复述本条核心要点（提示：喉阻塞根据患儿呼吸困难程度不同分为四度。（P33…）", "back": "喉阻塞根据患儿呼吸困难程度不同分为四度。（P339）", "source_quote": "喉阻塞根据患儿呼吸困难程度不同分为四度。（P339）", "source_page": "P339", "tags": ["ENT", "M05", "ENT:K-M05-007", "教师重点第95条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-096", "kc_id": "ENT:K-M05-009", "module": "M05", "type": "keypoint_recall", "front": "教师重点第96条（M05）：请复述本条核心要点（提示：急性会厌炎主要表现为剧烈咽痛，吞咽困难等，多不伴…）", "back": "急性会厌炎主要表现为剧烈咽痛，吞咽困难等，多不伴声嘶症状；咽部剧痛为急性会厌炎的最典型表现；急性会厌炎分急性卡他型、急性水肿型、急性溃疡型三种类型；急性会厌炎的最常见症状为剧烈咽痛，但是最严重的情况是由于会厌肿胀导致气道梗阻引起的吸气性呼吸困难，可能危及生命。（P309）", "source_quote": "急性会厌炎主要表现为剧烈咽痛，吞咽困难等，多不伴声嘶症状；咽部剧痛为急性会厌炎的最典型表现；急性会厌炎分急性卡他型、急性水肿型、急性溃疡型三种类型；急性会厌炎的最常见症状为剧烈咽痛，但是最严重的情况是由于会厌肿胀导致气道梗阻引起的吸气性呼吸困难，可能危及生命。（P309）", "source_page": "P309", "tags": ["ENT", "M05", "ENT:K-M05-009", "教师重点第96条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-097", "kc_id": "ENT:K-M05-010", "module": "M05", "type": "keypoint_recall", "front": "教师重点第97条（M05）：请复述本条核心要点（提示：儿童期易发生上呼吸道感染；小儿急性喉炎易引起喉阻…）", "back": "儿童期易发生上呼吸道感染；小儿急性喉炎易引起喉阻塞原因：喉腔狭小", "source_quote": "儿童期易发生上呼吸道感染；小儿急性喉炎易引起喉阻塞原因：喉腔狭小", "source_page": "P311", "tags": ["ENT", "M05", "ENT:K-M05-010", "教师重点第97条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-098", "kc_id": "ENT:K-M05-010", "module": "M05", "type": "keypoint_recall", "front": "教师重点第98条（M05）：请复述本条核心要点（提示：炎性时容易发生肿胀；喉黏膜下组织疏松；咳嗽力量不…）", "back": "炎性时容易发生肿胀；喉黏膜下组织疏松；咳嗽力量不够，下呼吸道分泌物不易咳出；声嘶、犬吠样咳及吸气性呼吸困难是小儿急性喉炎的典型表现；：急性喉炎通常先有病毒感染，之后可继发细菌感染。常见的致病病毒有流感病毒、副流感病毒、鼻病毒等，常见的致病细菌有溶血性链球菌、流感嗜血杆菌等。（P311）", "source_quote": "炎性时容易发生肿胀；喉黏膜下组织疏松；咳嗽力量不够，下呼吸道分泌物不易咳出；声嘶、犬吠样咳及吸气性呼吸困难是小儿急性喉炎的典型表现；：急性喉炎通常先有病毒感染，之后可继发细菌感染。常见的致病病毒有流感病毒、副流感病毒、鼻病毒等，常见的致病细菌有溶血性链球菌、流感嗜血杆菌等。（P311）", "source_page": "P311", "tags": ["ENT", "M05", "ENT:K-M05-010", "教师重点第98条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-099", "kc_id": "ENT:K-M05-011", "module": "M05", "type": "keypoint_recall", "front": "教师重点第99条（M05）：请复述本条核心要点（提示：慢性喉炎的症状包括：①声音嘶哑：是慢性喉炎最主要…）", "back": "慢性喉炎的症状包括：①声音嘶哑：是慢性喉炎最主要症状，程度可轻重不等，可呈持续性或间歇性；②喉部干燥感、异物感、喉痛；③喉部分泌物增多，讲话费力，咳出后可缓解；慢性喉炎治疗包括：①去除病因：避免长时间用声过度、戒除烟酒、改善工作环境；在粉尘环境中作业者应加强防护；积极治疗鼻腔、鼻窦的慢性炎症，解除鼻塞、流涕，控制咽部及下呼吸道的感染，治疗反流性食管炎等疾病；②雾化吸入；③中成药治疗。（P314）", "source_quote": "慢性喉炎的症状包括：①声音嘶哑：是慢性喉炎最主要症状，程度可轻重不等，可呈持续性或间歇性；②喉部干燥感、异物感、喉痛；③喉部分泌物增多，讲话费力，咳出后可缓解；慢性喉炎治疗包括：①去除病因：避免长时间用声过度、戒除烟酒、改善工作环境；在粉尘环境中作业者应加强防护；积极治疗鼻腔、鼻窦的慢性炎症，解除鼻塞、流涕，控制咽部及下呼吸道的感染，治疗反流性食管炎等疾病；②雾化吸入；③中成药治疗。（P314）", "source_page": "P314", "tags": ["ENT", "M05", "ENT:K-M05-011", "教师重点第99条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-100", "kc_id": "ENT:K-M05-012", "module": "M05", "type": "keypoint_recall", "front": "教师重点第100条（M05）：请复述本条核心要点（提示：声带小结：喉镜检查见双侧声带前、中1/3交界处有…）", "back": "声带小结：喉镜检查见双侧声带前、中1/3交界处有对称性结节状隆起。病程短的早期小结是粉红色息肉状；病程长者，则呈白色结节状小的隆起，表面光滑。发声时两侧的小结互相靠在一起使声门不能完全闭合；声带小结按发展过程可分为三个阶段。早期基质水肿，可有血管增生及扩张为正常的鳞状上皮，外观似小息肉，其病理改变和息肉相似；中期基质有纤维化及透明变性，表面仍为正常鳞状上皮，此时小结的外观较坚实；晚期小结基质和中期相似，但表面上皮有增厚及角化，也可有棘细胞层增厚和角化不全，故外观色苍白。（P315）", "source_quote": "声带小结：喉镜检查见双侧声带前、中1/3交界处有对称性结节状隆起。病程短的早期小结是粉红色息肉状；病程长者，则呈白色结节状小的隆起，表面光滑。发声时两侧的小结互相靠在一起使声门不能完全闭合；声带小结按发展过程可分为三个阶段。早期基质水肿，可有血管增生及扩张为正常的鳞状上皮，外观似小息肉，其病理改变和息肉相似；中期基质有纤维化及透明变性，表面仍为正常鳞状上皮，此时小结的外观较坚实；晚期小结基质和中期相似，但表面上皮有增厚及角化，也可有棘细胞层增厚和角化不全，故外观色苍白。（P315）", "source_page": "P315", "tags": ["ENT", "M05", "ENT:K-M05-012", "教师重点第100条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-101", "kc_id": "ENT:K-M05-013", "module": "M05", "type": "keypoint_recall", "front": "教师重点第101条（M05）：请复述本条核心要点（提示：喉任克间隙位于与声带长轴平行的黏膜下（P290）…）", "back": "喉任克间隙位于与声带长轴平行的黏膜下（P290）", "source_quote": "喉任克间隙位于与声带长轴平行的黏膜下（P290）", "source_page": "P290", "tags": ["ENT", "M05", "ENT:K-M05-013", "教师重点第101条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-102", "kc_id": "ENT:K-M05-014", "module": "M05", "type": "keypoint_recall", "front": "教师重点第102条（M05）：请复述本条核心要点（提示：环杓关节炎喉镜下可见患侧的杓区黏膜肿胀、充血。间…）", "back": "环杓关节炎喉镜下可见患侧的杓区黏膜肿胀、充血。间接喉镜下喉钳行杓区触诊时，患侧杓区会有明显触痛。患侧声带运动可受限，严重者因环杓关节固定可导致患侧声带固定。环甲关节炎喉镜下可见患侧声带肌松弛。如为一侧病变可出现声门偏斜，双侧环甲关节炎可引起关节活动障碍，则双侧声带肌松弛，声门闭合时有梭形裂隙。杓间区溃疡病变可见于喉结核；因风湿或类风湿引起的喉关节炎，可用糖皮质激素治疗；合并细菌感染应用抗生素治疗；喉痛者可用水杨酸制剂，或解热镇痛类药物。环杓关节固定者可在喉镜下行杓状软骨拨动术，环甲关节炎可行环甲关节推拿治疗。（P317）", "source_quote": "环杓关节炎喉镜下可见患侧的杓区黏膜肿胀、充血。间接喉镜下喉钳行杓区触诊时，患侧杓区会有明显触痛。患侧声带运动可受限，严重者因环杓关节固定可导致患侧声带固定。环甲关节炎喉镜下可见患侧声带肌松弛。如为一侧病变可出现声门偏斜，双侧环甲关节炎可引起关节活动障碍，则双侧声带肌松弛，声门闭合时有梭形裂隙。杓间区溃疡病变可见于喉结核；因风湿或类风湿引起的喉关节炎，可用糖皮质激素治疗；合并细菌感染应用抗生素治疗；喉痛者可用水杨酸制剂，或解热镇痛类药物。环杓关节固定者可在喉镜下行杓状软骨拨动术，环甲关节炎可行环甲关节推拿治疗。（P317）", "source_page": "P317", "tags": ["ENT", "M05", "ENT:K-M05-014", "教师重点第102条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-103", "kc_id": "ENT:K-M05-015", "module": "M05", "type": "cloze", "front": "喉癌最常见的类型是声门型，约占{{c1::60%}}；声门上癌早期症状不明显，或仅表现为咽异物感、吞咽不适、口臭、咽痛、咯血或呛咳等非特异症状；喉癌治疗的主要措施包括手术、放疗、化疗、靶向、免疫以及中医药治疗；早期喉癌可选择单一的治疗方案，而中晚期喉癌则需采取综合治疗；垂直喉部分切除术适用于肿瘤主要位于半侧喉的声门癌；或声门上癌累及喉室、声带，但不累及会厌和会厌前间隙、声门旁间隙为佳；若累及杓会厌壁，至少声带不完全固定，声门下累及不超过5mm;声门型喉癌，肿瘤局限在喉内，伴有声带固定为T3期。（P325）", "back": "喉癌最常见的类型是声门型，约占60%；声门上癌早期症状不明显，或仅表现为咽异物感、吞咽不适、口臭、咽痛、咯血或呛咳等非特异症状；喉癌治疗的主要措施包括手术、放疗、化疗、靶向、免疫以及中医药治疗；早期喉癌可选择单一的治疗方案，而中晚期喉癌则需采取综合治疗；垂直喉部分切除术适用于肿瘤主要位于半侧喉的声门癌；或声门上癌累及喉室、声带，但不累及会厌和会厌前间隙、声门旁间隙为佳；若累及杓会厌壁，至少声带不完全固定，声门下累及不超过5mm;声门型喉癌，肿瘤局限在喉内，伴有声带固定为T3期。（P325）", "source_quote": "喉癌最常见的类型是声门型，约占60%；声门上癌早期症状不明显，或仅表现为咽异物感、吞咽不适、口臭、咽痛、咯血或呛咳等非特异症状；喉癌治疗的主要措施包括手术、放疗、化疗、靶向、免疫以及中医药治疗；早期喉癌可选择单一的治疗方案，而中晚期喉癌则需采取综合治疗；垂直喉部分切除术适用于肿瘤主要位于半侧喉的声门癌；或声门上癌累及喉室、声带，但不累及会厌和会厌前间隙、声门旁间隙为佳；若累及杓会厌壁，至少声带不完全固定，声门下累及不超过5mm;声门型喉癌，肿瘤局限在喉内，伴有声带固定为T3期。（P325）", "source_page": "P325", "tags": ["ENT", "M05", "ENT:K-M05-015", "教师重点第103条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-104", "kc_id": "ENT:K-M02-004", "module": "M02", "type": "keypoint_recall", "front": "教师重点第104条（M02）：请复述本条核心要点（提示：耵聍堵塞导致的传导性耳聋及鼓膜内陷、纯音测听和声…）", "back": "耵聍堵塞导致的传导性耳聋及鼓膜内陷、纯音测听和声导抗检查的作用、外耳道在空气传导中的重要性以及耵聍取出和鼓膜、咽鼓管处理的基本原则：硬耵聍团块堵塞外耳道是传导性听力下降的核心病因，表现为气导下降而骨导正常；长期堵塞可导致鼓膜内陷，形成鼓室负压，间接影响声音传导。听骨链固定多需慢性中耳炎或外伤史，而耳蜗功能减退则表现为感音神经性耳聋。声音空气传导的起始环节是外耳道，耵聍完全堵塞直接阻碍声音进入，鼓膜内陷进一步降低振动幅度。诊断上，耳内镜可观察鼓膜及耵聍情况，纯音测听复查可判断取出耵聍后听力恢复，声导抗测试评估鼓室压力，颞骨CT可排除中耳结构异常，前庭功能检查在无眩晕、平衡障碍时可省略。治疗核心是先软化硬耵聍再用专业器械取出，辅以鼓膜按摩改善内陷或咽鼓管吹张恢复鼓室压力。患者无外耳道红肿、流脓等感染迹象时无需口服抗生素。（P37）", "source_quote": "耵聍堵塞导致的传导性耳聋及鼓膜内陷、纯音测听和声导抗检查的作用、外耳道在空气传导中的重要性以及耵聍取出和鼓膜、咽鼓管处理的基本原则：硬耵聍团块堵塞外耳道是传导性听力下降的核心病因，表现为气导下降而骨导正常；长期堵塞可导致鼓膜内陷，形成鼓室负压，间接影响声音传导。听骨链固定多需慢性中耳炎或外伤史，而耳蜗功能减退则表现为感音神经性耳聋。声音空气传导的起始环节是外耳道，耵聍完全堵塞直接阻碍声音进入，鼓膜内陷进一步降低振动幅度。诊断上，耳内镜可观察鼓膜及耵聍情况，纯音测听复查可判断取出耵聍后听力恢复，声导抗测试评估鼓室压力，颞骨CT可排除中耳结构异常，前庭功能检查在无眩晕、平衡障碍时可省略。治疗核心是先软化硬耵聍再用专业器械取出，辅以鼓膜按摩改善内陷或咽鼓管吹张恢复鼓室压力。患者无外耳道红肿、流脓等感染迹象时无需口服抗生素。（P37）", "source_page": "P37", "tags": ["ENT", "M02", "ENT:K-M02-004", "教师重点第104条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-105", "kc_id": "ENT:K-M07-001", "module": "M07", "type": "cloze", "front": "鼻咽癌典型症状与鉴别诊断、病理活检为金标准、MRI及EB病毒检测作用、Ki-67与预后关系、远处转移筛查及随访监测方法、放疗为首选治疗原则：患者如有吸烟史、耳部症状（耳鸣、听力下降）、颈部淋巴结无痛、质硬、活动差，合并回吸性涕血和鼻咽溃疡型肿物，符合鼻咽癌伴颈淋巴结转移的典型临床表现，但需与颈部淋巴瘤（多部位淋巴结肿大、可伴发热）、甲状腺癌（颈侧区淋巴结转移）、急性化脓性淋巴结炎（伴红肿热痛）、鼻咽纤维血管瘤（青年男性、鼻塞、反复鼻出血、无淋巴结转移）、鼻窦癌侵犯鼻咽及鼻咽结核鉴别，慢性鼻咽炎多为黏膜充血，无溃疡及易出血肿物。鼻咽癌诊断金标准为病理活检，应先行鼻咽镜+活检，颈部淋巴结细针穿刺可确认转移，MRI用于评估肿瘤 现、咽鼓管功能障碍及过敏性鼻炎的病因、鼓室负压与积液对传导性听力的影响、诊断检查方法及治疗原则：感冒后出现耳闷和传导性听力下降，鼓膜内陷，声导抗呈B型曲线，符合分泌性中耳炎诊断，其主要病因是咽鼓管功能障碍，常由过敏性鼻炎导致咽鼓管咽口黏膜肿胀所诱发，而急性化脓性中耳炎则多伴耳痛、发热、鼓膜充血膨隆及穿孔流脓。发病机制为咽鼓管功能障碍导致鼓室通气不足，形成鼓室负压或积液，直接阻碍声音传导，同时鼓膜内陷降低振动幅度，加重传导性听力下降；听骨链正常，无慢性中耳炎病史，耳蜗功能正常（骨导正常）。诊断可结合鼻内镜观察咽口阻塞、鼓室穿刺确认积液、咽鼓管功能测试量化通气能力，过敏原检测可指导预防，颞骨MRI主要用于排查内耳或听神经病变，对分泌性中耳炎诊断非必需。治疗以恢复咽鼓管通气和促进积液排出为主：鼻腔糖皮质激素减轻黏膜肿胀，黏液促排剂帮助排出积液，鼓膜穿刺可快速改善听力，咽鼓管吹张促进通气和积液吸收，患者无感染迹象时无需口服抗生素。（P83）", "source_quote": "分泌性中耳炎的典型临床表现、咽鼓管功能障碍及过敏性鼻炎的病因、鼓室负压与积液对传导性听力的影响、诊断检查方法及治疗原则：感冒后出现耳闷和传导性听力下降，鼓膜内陷，声导抗呈B型曲线，符合分泌性中耳炎诊断，其主要病因是咽鼓管功能障碍，常由过敏性鼻炎导致咽鼓管咽口黏膜肿胀所诱发，而急性化脓性中耳炎则多伴耳痛、发热、鼓膜充血膨隆及穿孔流脓。发病机制为咽鼓管功能障碍导致鼓室通气不足，形成鼓室负压或积液，直接阻碍声音传导，同时鼓膜内陷降低振动幅度，加重传导性听力下降；听骨链正常，无慢性中耳炎病史，耳蜗功能正常（骨导正常）。诊断可结合鼻内镜观察咽口阻塞、鼓室穿刺确认积液、咽鼓管功能测试量化通气能力，过敏原检测可指导预防，颞骨MRI主要用于排查内耳或听神经病变，对分泌性中耳炎诊断非必需。治疗以恢复咽鼓管通气和促进积液排出为主：鼻腔糖皮质激素减轻黏膜肿胀，黏液促排剂帮助排出积液，鼓膜穿刺可快速改善听力，咽鼓管吹张促进通气和积液吸收，患者无感染迹象时无需口服抗生素。（P83）", "source_page": "P83", "tags": ["ENT", "M02", "ENT:K-M02-009", "教师重点第106条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-107", "kc_id": "ENT:K-M01-007", "module": "M01", "type": "keypoint_recall", "front": "教师重点第107条（M01）：请复述本条核心要点（提示：耳部的解剖与生理功能。鼓膜明确分为上方的松弛部与…）", "back": "耳部的解剖与生理功能。鼓膜明确分为上方的松弛部与下方占比较大的紧张部，后者是主要功能区。鼓室以鼓膜为界分为上、中、下三部，容纳听骨链。儿童因咽鼓管具有短、宽、平直的解剖特点，故易患中耳炎。在内耳，三个互相垂直的半规管（尤其是水平位的外半规管）负责感知旋转运动。听觉方面，内毛细胞是听觉信号的主要感受器，而外毛细胞起“放大”作用以增强敏感性；声音通过空气传导的完整途径实现。淋巴系统是高频考点：骨迷路与膜迷路之间为外淋巴，膜迷路内为内淋巴，两者循环独立；前庭阶与鼓阶的外淋巴通过蜗孔相通。此外，耳郭静脉回流并非单一途径，除颞浅静脉外，还经耳后静脉汇入颈外静脉，且存在与颅内相通的导血管，这是耳部感染可能引发颅内并发症的解剖基础。（P16）108.鼻腔的核心解剖结构与生理功能。鼻腔主要分为覆有皮肤的鼻前庭（含毛囊、皮脂腺）和覆有黏膜的固有鼻腔。鼻中隔在成人中大多存在不同程度的偏曲，完全居中者少见。鼻窦根据其开口位置分为前组（开口于中鼻道）和后组（开口于上鼻道及蝶筛隐窝）。嗅区黏膜分布局限，位于上鼻甲内侧面及对应鼻中隔区域，是嗅觉产生的关键。鼻泪管开口于下鼻道，这一结构使得鼻腔炎症可能逆行引发泪囊炎。在生理功能方面，鼻周期是指两侧鼻腔阻力呈交替性变化，具有促进睡眠时翻身的生理意义。鼻腔的血液供应来源丰富，主要来自颈内动脉系统（眼动脉分支）和颈外动脉系统（上颌动脉分支）。鼻腔的加温、加湿和过滤功能主要由鼻腔黏膜（而非咽喉）完成，其中纤毛朝向鼻咽部的统一运动是实现鼻腔自洁和保护的重要机制。（P150）", "source_quote": "耳部的解剖与生理功能。鼓膜明确分为上方的松弛部与下方占比较大的紧张部，后者是主要功能区。鼓室以鼓膜为界分为上、中、下三部，容纳听骨链。儿童因咽鼓管具有短、宽、平直的解剖特点，故易患中耳炎。在内耳，三个互相垂直的半规管（尤其是水平位的外半规管）负责感知旋转运动。听觉方面，内毛细胞是听觉信号的主要感受器，而外毛细胞起“放大”作用以增强敏感性；声音通过空气传导的完整途径实现。淋巴系统是高频考点：骨迷路与膜迷路之间为外淋巴，膜迷路内为内淋巴，两者循环独立；前庭阶与鼓阶的外淋巴通过蜗孔相通。此外，耳郭静脉回流并非单一途径，除颞浅静脉外，还经耳后静脉汇入颈外静脉，且存在与颅内相通的导血管，这是耳部感染可能引发颅内并发症的解剖基础。（P16）108.鼻腔的核心解剖结构与生理功能。鼻腔主要分为覆有皮肤的鼻前庭（含毛囊、皮脂腺）和覆有黏膜的固有鼻腔。鼻中隔在成人中大多存在不同程度的偏曲，完全居中者少见。鼻窦根据其开口位置分为前组（开口于中鼻道）和后组（开口于上鼻道及蝶筛隐窝）。嗅区黏膜分布局限，位于上鼻甲内侧面及对应鼻中隔区域，是嗅觉产生的关键。鼻泪管开口于下鼻道，这一结构使得鼻腔炎症可能逆行引发泪囊炎。在生理功能方面，鼻周期是指两侧鼻腔阻力呈交替性变化，具有促进睡眠时翻身的生理意义。鼻腔的血液供应来源丰富，主要来自颈内动脉系统（眼动脉分支）和颈外动脉系统（上颌动脉分支）。鼻腔的加温、加湿和过滤功能主要由鼻腔黏膜（而非咽喉）完成，其中纤毛朝向鼻咽部的统一运动是实现鼻腔自洁和保护的重要机制。（P150）", "source_page": "P16", "tags": ["ENT", "M01", "ENT:K-M01-007", "教师重点第107条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-108", "kc_id": "ENT:K-M03-001", "module": "M03", "type": "keypoint_recall", "front": "教师重点第108条（M03）：请复述本条核心要点（提示：咽部的解剖与生理功能。咽部是呼吸与消化的共同通道…）", "back": "咽部的解剖与生理功能。咽部是呼吸与消化的共同通道，以软腭游离缘和会厌上缘为界，明确分为鼻咽、口咽和喉咽三部分。其结构特点与功能紧密相关：咽鼓管咽口位于鼻咽侧壁，平下鼻甲后端，通过吞咽、打哈欠时开放以平衡中耳压力；腭扁桃体位于口咽的扁桃体窝，表面隐窝易藏病菌导致发炎；它与腺样体（咽扁桃体）等共同构成咽淋巴环，形成上呼吸道的重要免疫防线。咽部的肌肉均为横纹肌，包括缩小咽腔的咽缩肌和上提喉体的咽提肌，它们在吞咽时与软腭、会厌协同运动，确保食物顺利进入食管而防止误入气管或反流鼻腔。在临床方面，儿童腺样体增生是引起鼻塞、打鼾和分泌性中耳炎的常见原因；而喉咽部的梨状隐窝则是异物易滞留和肿瘤的好发部位。咽部的血液供应主要来自颈外动脉分支，静脉则回流至颈内静脉。（P248）", "source_quote": "咽部的解剖与生理功能。咽部是呼吸与消化的共同通道，以软腭游离缘和会厌上缘为界，明确分为鼻咽、口咽和喉咽三部分。其结构特点与功能紧密相关：咽鼓管咽口位于鼻咽侧壁，平下鼻甲后端，通过吞咽、打哈欠时开放以平衡中耳压力；腭扁桃体位于口咽的扁桃体窝，表面隐窝易藏病菌导致发炎；它与腺样体（咽扁桃体）等共同构成咽淋巴环，形成上呼吸道的重要免疫防线。咽部的肌肉均为横纹肌，包括缩小咽腔的咽缩肌和上提喉体的咽提肌，它们在吞咽时与软腭、会厌协同运动，确保食物顺利进入食管而防止误入气管或反流鼻腔。在临床方面，儿童腺样体增生是引起鼻塞、打鼾和分泌性中耳炎的常见原因；而喉咽部的梨状隐窝则是异物易滞留和肿瘤的好发部位。咽部的血液供应主要来自颈外动脉分支，静脉则回流至颈内静脉。（P248）", "source_page": "P150", "tags": ["ENT", "M03", "ENT:K-M03-001", "教师重点第108条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-109", "kc_id": "ENT:K-M04-001", "module": "M04", "type": "keypoint_recall", "front": "教师重点第109条（M04）：请复述本条核心要点（提示：喉部解剖与生理的解析内容。喉部是呼吸、发音和保护…）", "back": "喉部解剖与生理的解析内容。喉部是呼吸、发音和保护气道的核心器官。其软骨支架中，环状软骨是唯一完整的环形软骨，对维持喉腔通畅至关重要。喉腔分为声门上区、声门区和声门下区三部分，其中声门裂是喉腔最狭窄的部位。声带是发音的核心结构，由声韧带、声带肌和黏膜构成。其运动由喉内肌群精细调控（负责声带张弛、开合），而喉外肌群则负责喉体的整体运动。喉的呼吸保护功能通过声门的开放（呼吸时）与闭合（发音、吞咽时）来实现。在神经支配上，喉上神经内支司声门上区感觉，该区域感觉敏锐；喉返神经司声门下区感觉及喉内肌运动。血液供应主要来自甲状腺上动脉的喉上动脉和甲状腺下动脉的喉下动脉（喉返动脉）。最后，音调的高低主要由声带长度决定（男性长、声调低；女性短、声调高），并通过声带的张力与振动频率进行调节。（P290）", "source_quote": "喉部解剖与生理的解析内容。喉部是呼吸、发音和保护气道的核心器官。其软骨支架中，环状软骨是唯一完整的环形软骨，对维持喉腔通畅至关重要。喉腔分为声门上区、声门区和声门下区三部分，其中声门裂是喉腔最狭窄的部位。声带是发音的核心结构，由声韧带、声带肌和黏膜构成。其运动由喉内肌群精细调控（负责声带张弛、开合），而喉外肌群则负责喉体的整体运动。喉的呼吸保护功能通过声门的开放（呼吸时）与闭合（发音、吞咽时）来实现。在神经支配上，喉上神经内支司声门上区感觉，该区域感觉敏锐；喉返神经司声门下区感觉及喉内肌运动。血液供应主要来自甲状腺上动脉的喉上动脉和甲状腺下动脉的喉下动脉（喉返动脉）。最后，音调的高低主要由声带长度决定（男性长、声调低；女性短、声调高），并通过声带的张力与振动频率进行调节。（P290）", "source_page": "P248", "tags": ["ENT", "M04", "ENT:K-M04-001", "教师重点第109条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-110", "kc_id": "ENT:K-M05-007", "module": "M05", "type": "keypoint_recall", "front": "教师重点第110条（M05）：请复述本条核心要点（提示：喉阻塞与气管切开术。喉阻塞的常见病因包括急性喉炎…）", "back": "喉阻塞与气管切开术。喉阻塞的常见病因包括急性喉炎、喉异物、喉肿瘤及喉外伤等，其中儿童因喉腔狭小、黏膜下组织疏松，急性喉炎时更易发生喉阻塞。其典型表现为吸气性呼吸困难（吸气时间延长、费力，呼气正常），严重时出现“三凹征”（胸骨上窝、锁骨上窝、肋间隙凹陷），若进展为“四凹征”则提示病情危重（Ⅳ度）。喉阻塞的临床分度是指导治疗的关键：Ⅰ度于安静时无症状，仅活动后出现，以病因治疗为主；Ⅱ度在安静时即有症状，需严密观察并积极病因治疗；Ⅲ度则表现为安静时明显呼吸困难，伴烦躁、发绀，若病因无法迅速解除，需立即行气管切开术；而Ⅳ度患者已出现呼吸衰竭征象，必须紧急开放气道（如        异物。气管切开术的常规部位位于第3-4气管软骨环之间，其适应证涵盖Ⅱ-Ⅳ度喉阻塞、下呼吸道分泌物潴留、某些头颈手术的术前准备以及需长期机械通气的患者。术后需加强护理，包括定期吸痰、保持套管通畅等。术后并发症如皮下气肿通常可自行吸收，但需警惕气胸、纵隔气肿及大出血（如损伤无名动脉）等严重并发症。拔管前需遵循规范流程，通常需更换为带气囊的套管并逐步试行堵管，确认呼吸平稳后方可拔管。（P340）", "source_quote": "喉阻塞与气管切开术。喉阻塞的常见病因包括急性喉炎、喉异物、喉肿瘤及喉外伤等，其中儿童因喉腔狭小、黏膜下组织疏松，急性喉炎时更易发生喉阻塞。其典型表现为吸气性呼吸困难（吸气时间延长、费力，呼气正常），严重时出现“三凹征”（胸骨上窝、锁骨上窝、肋间隙凹陷），若进展为“四凹征”则提示病情危重（Ⅳ度）。喉阻塞的临床分度是指导治疗的关键：Ⅰ度于安静时无症状，仅活动后出现，以病因治疗为主；Ⅱ度在安静时即有症状，需严密观察并积极病因治疗；Ⅲ度则表现为安静时明显呼吸困难，伴烦躁、发绀，若病因无法迅速解除，需立即行气管切开术；而Ⅳ度患者已出现呼吸衰竭征象，必须紧急开放气道（如        异物。气管切开术的常规部位位于第3-4气管软骨环之间，其适应证涵盖Ⅱ-Ⅳ度喉阻塞、下呼吸道分泌物潴留、某些头颈手术的术前准备以及需长期机械通气的患者。术后需加强护理，包括定期吸痰、保持套管通畅等。术后并发症如皮下气肿通常可自行吸收，但需警惕气胸、纵隔气肿及大出血（如损伤无名动脉）等严重并发症。拔管前需遵循规范流程，通常需更换为带气囊的套管并逐步试行堵管，确认呼吸平稳后方可拔管。（P340）", "source_page": "P339", "tags": ["ENT", "M05", "ENT:K-M05-007", "教师重点第110条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-111", "kc_id": "ENT:K-M01-001", "module": "M01", "type": "keypoint_recall", "front": "教师重点第111条（M01）：请复述本条核心要点（提示：听骨链依次为锤骨、砧骨、镫骨；耵聍腺主要位于外耳…）", "back": "听骨链依次为锤骨、砧骨、镫骨；耵聍腺主要位于外耳道软骨部；前庭终末器包括椭圆囊斑、球囊斑和半规管壶腹嵴。", "source_quote": "听骨链依次为锤骨、砧骨、镫骨；耵聍腺主要位于外耳道软骨部；前庭终末器包括椭圆囊斑、球囊斑和半规管壶腹嵴。", "source_page": "P16", "tags": ["ENT", "M01", "ENT:K-M01-001", "教师重点第111条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-112", "kc_id": "ENT:K-M02-015", "module": "M02", "type": "keypoint_recall", "front": "教师重点第112条（M02）：请复述本条核心要点（提示：气导大于骨导为林纳试验阳性；林纳试验阴性典型提示…）", "back": "气导大于骨导为林纳试验阳性；林纳试验阴性典型提示传导性聋；韦伯试验中传导性聋偏患耳、单侧感音神经性聋偏健耳。", "source_quote": "气导大于骨导为林纳试验阳性；林纳试验阴性典型提示传导性聋；韦伯试验中传导性聋偏患耳、单侧感音神经性聋偏健耳。", "source_page": "", "tags": ["ENT", "M02", "ENT:K-M02-015", "教师重点第112条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-113", "kc_id": "ENT:K-M01-005", "module": "M01", "type": "keypoint_recall", "front": "教师重点第113条（M01）：请复述本条核心要点（提示：面神经出茎乳孔后进入腮腺并分为颞支、颧支、颊支、…）", "back": "面神经出茎乳孔后进入腮腺并分为颞支、颧支、颊支、下颌缘支和颈支；周围性面瘫常见同侧额纹消失、闭眼不全和口角歪斜。", "source_quote": "面神经出茎乳孔后进入腮腺并分为颞支、颧支、颊支、下颌缘支和颈支；周围性面瘫常见同侧额纹消失、闭眼不全和口角歪斜。", "source_page": "", "tags": ["ENT", "M01", "ENT:K-M01-005", "教师重点第113条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-114", "kc_id": "ENT:K-M03-003", "module": "M03", "type": "keypoint_recall", "front": "教师重点第114条（M03）：请复述本条核心要点（提示：鼻中隔主要由鼻中隔软骨、筛骨垂直板和犁骨构成；鼻…）", "back": "鼻中隔主要由鼻中隔软骨、筛骨垂直板和犁骨构成；鼻出血常见部位为利特尔区；鼻疖常见致病菌为金黄色葡萄球菌，严禁挤压。", "source_quote": "鼻中隔主要由鼻中隔软骨、筛骨垂直板和犁骨构成；鼻出血常见部位为利特尔区；鼻疖常见致病菌为金黄色葡萄球菌，严禁挤压。", "source_page": "P156", "tags": ["ENT", "M03", "ENT:K-M03-003", "教师重点第114条"], "origin": "keypoint", "status": "active"}, {"item_id": "ENT-KP-115", "kc_id": "ENT:K-M03-004", "module": "M03", "type": "keypoint_recall", "front": "教师重点第115条（M03）：请复述本条核心要点（提示：下鼻甲参与加温、加湿及调节鼻腔阻力；鼻腔黏液纤毛…）", "back": "下鼻甲参与加温、加湿及调节鼻腔阻力；鼻腔黏液纤毛系统向鼻咽方向清除分泌物；鼻周期是两侧鼻腔通气程度的生理性周期变化。", "source_quote": "下鼻甲参与加温、加湿及调节鼻腔阻力；鼻腔黏液纤毛系统向鼻咽方向清除分泌物；鼻周期是两侧鼻腔通气程度的生理性周期变化。", "source_page": "P161", "tags": ["ENT", "M03", "ENT:K-M03-004", "教师重点第115条"], "origin": "keypoint", "status": const KEY = "medagentwork_pilot_ent_v1";
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
let idx = 0;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const cloze = (s) => esc(s).replace(/\{\{c1::(.+?)\}\}/g, "<mark>$1</mark>");
function current() { return ITEMS[idx]; }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function seen() { return Object.keys(state).filter(k => state[k] && state[k].seen).length; }
function updateStats() {
  $("stats").textContent = `${seen()} / ${ITEMS.length} 已看`;
  $("bar").style.width = `${ITEMS.length ? (seen()/ITEMS.length*100) : 0}%`;
}
function render() {
  const it = current();
  if (!it) {
    $("front").textContent = "本轮完成。可导出进度，或重置后重来。";
    $("back").textContent = ""; $("tags").innerHTML = "";
    $("show").disabled = true; $("skip").disabled = true;
    $("rate").classList.remove("show"); updateStats(); return;
  }
  $("tags").innerHTML = (it.tags || []).slice(0,4).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  $("front").innerHTML = cloze(it.front);
  $("back").innerHTML = cloze(it.back);
  $("back").classList.remove("show");
  $("rate").classList.remove("show");
  $("show").disabled = false; $("skip").disabled = false;
  updateStats();
}
function reveal() { $("back").classList.add("show"); $("rate").classList.add("show"); $("show").disabled = true; }
function rate(r) {
  const it = current(); if (!it) return;
  state[it.item_id] = { seen:true, last_rating:r, updated_at:new Date().toISOString() };
  save(); idx++; render();
}
$("show").onclick = reveal;
$("skip").onclick = () => { idx++; render(); };
document.querySelectorAll("#rate button").forEach(b => b.onclick = () => rate(Number(b.dataset.r)));
$("export").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "medagentwork_pilot_ent_progress.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => { try { state = JSON.parse(reader.result); save(); render(); } catch (_) { alert("JSON 解析失败"); } };
  reader.readAsText(f);
};
$("reset").onclick = () => { if (confirm("清空本地进度？")) { state = {}; save(); idx = 0; render(); } };
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); if (!$("show").disabled) reveal(); }
  else if (e.key === "ArrowRight") { idx++; render(); }
  else if (/^[1-4]$/.test(e.key)) { if ($("rate").classList.contains("show")) rate(Number(e.key)-1); }
});
render();
</script>
