name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # --changed-only 需要 HEAD~1 基线；取不到时 gate_audit 会回退到
          # 「所有已有回执链的批次」并在输出标 FALLBACK。
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 与 ci.yml 的 batch-gate job 同一套脚本 + 同一套依赖（2026-11-07 统一）：
      # 缺 requirements.txt 时 `python -m scripts.validate` 会因缺 jsonschema/numpy
      # 走不同分支，导致同一份产物在 PR 门禁 PASS、在 deploy 复检 RECHECK_FAILED。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # P0 防跳过（2026-11-05）：发布前对「本次改动涉及的批次」复核门禁回执链，
      # 并用 --recheck 重跑确定性门禁。回执缺失 / 断链 / 产物字节不符 / 复检不过
      # → 拒绝部署（fail-closed）。只审改动批次，纯站点改动不受影响。
      # --require-tracked（P1-3）：batch048+ 的产物与回执链必须已入库，否则 CI 看不见
      # 这批证据，中央兜底形同虚设。
      # 与 ci.yml 的 batch-gate job 同一套脚本，这里是最后一道闸。
      - name: Batch gate audit (fail-closed)
        run: |
          python scripts/gate_audit.py --changed-only --recheck --require-tracked \
            --json-out reports/gate/audit_deploy.json

      - name: Quality policy gate (HC-25)
        run: python scripts/quality_policy.py --validate

      # 公开闸门（P8-S3）：检查白名单双通道一致 / 白名单内裸题面 / 线上真暴露。
      # 授权口径：2026-11-03 用户裁定「不用管授权」，license 仅清点，不再阻断部署
      # （G0/G3 恒 INFO）。仍会失败的是 G1/G4/G6 三类结构/暴露问题。
      - name: Public gate (structure/exposure fail-closed; license informational)
        run: python scripts/public_gate.py

      # 部署前门禁：把 index.html 里每个按钮的真实请求路径解析出来，
      # 逐个确认仓库内文件存在。断链即拒绝部署（fail-closed）。
      # 背景：2026-09-27 大四上分区因路径重复拼前缀导致 10 个下载按钮失效；
      #      坏链在 Pages 上返回的是 200 + 首页 HTML，只看状态码抓不到。
      - name: Link gate (fail-closed)
        run: node scripts/check_site_links.mjs index.html

      - name: Install wrangler
        run: npm i -g wrangler@4.121.0

      # 组装站点上传目录（白名单）：Cloudflare Pages 的 `wrangler pages deploy`
      # 不识别根目录 .assetsignore（该机制仅 Workers 静态资产支持），若直接以仓库根
      # 为输出，会把 scripts/ question_bank/ 中间产物/ 复习资料/ 等非站点文件一并
      # 上传公开。此处与本地脚本 scripts/deploy_site.ps1 使用同一白名单。
      - name: Stage site files (whitelist)
        run: |
          mkdir -p _stage
          for it in index.html _headers _redirects functions 大三下 大四上 assets sw.js manifest.webmanifest icon-192.png icon-512.png; do
            if [ -e "$it" ]; then cp -R "$it" _stage/; fi
          done
          ls -1 _stage

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy _stage --branch main
