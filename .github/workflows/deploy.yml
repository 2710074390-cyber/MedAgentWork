name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm i -g wrangler@4.121.0

      - name: Direct API test
        run: |
          echo "md5=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | md5sum | cut -c1-16)"
          echo "acct_tail=${CLOUDFLARE_ACCOUNT_ID:24:8}"
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/med-review-site" | tail -c 300

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name med-review-site
