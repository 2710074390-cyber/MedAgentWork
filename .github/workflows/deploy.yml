name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Quality policy gate (HC-25)
        run: python scripts/quality_policy.py --validate

      # 部署前门禁：把 index.html 里每个按钮的真实请求路径解析出来，
      # 逐个确认仓库内文件存在。断链即拒绝部署（fail-closed）。
      # 背景：2026-09-27 大四上分区因路径重复拼前缀导致 10 个下载按钮失效；
      #      坏链在 Pages 上返回的是 200 + 首页 HTML，只看状态码抓不到。
      - name: Link gate (fail-closed)
        run: node scripts/check_site_links.mjs index.html

      - name: Install wrangler
        run: npm i -g wrangler@4.121.0

      # 组装站点上传目录（白名单）：Cloudflare Pages 的 `wrangler pages deploy`
      # 不识别根目录 .assetsignore（该机制仅 Workers 静态资产支持），若直接以仓库根
      # 为输出，会把 scripts/ question_bank/ 中间产物/ 复习资料/ 等非站点文件一并
      # 上传公开。此处与本地脚本 scripts/deploy_site.ps1 使用同一白名单。
      - name: Stage site files (whitelist)
        run: |
          mkdir -p _stage
          for it in index.html _headers _redirects functions 大三下 大四上 assets sw.js manifest.webmanifest icon-192.png icon-512.png; do
            if [ -e "$it" ]; then cp -R "$it" _stage/; fi
          done
          ls -1 _stage

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy _stage --branch main
