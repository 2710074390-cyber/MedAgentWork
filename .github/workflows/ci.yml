name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy
      
      # 2026-10-16：降级为**非阻断**。实测 `ruff check scripts/` 现有 305 条、`ruff format
      # --check` 有 79 个文件需重排，而本 CI 是 `pip install ruff`（不锁版本）——ruff 的默认
      # 规则集会随版本漂移，这个 gate 从未绿过。更糟的是它排在 `Run tests` 之前：一挂就把
      # **真正有价值的测试**整步跳过（实测该步骤至今从未执行过）。
      # 故先让它只告警，把测试放出来；规则集锁定/清 305 条/重排 三条路另行决策。
      - name: Lint with ruff（告警，不阻断）
        continue-on-error: true
        run: |
          ruff check scripts/ --output-format=github
      
      - name: Type check with mypy
        run: |
          mypy scripts/ --ignore-missing-imports --no-error-summary || true
      
      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=scripts --cov-report=xml --cov-report=term-missing

      - name: Validate quality policy (HC-25)
        run: |
          python scripts/quality_policy.py --validate
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install ruff
        run: pip install ruff
      
      # 2026-10-16：同样降级为**非阻断**（原因见 test job 的 Lint 步骤注释）。本 job
      # 两步都是「告警」，不再阻断流水线；保留它是为了在 Actions 里能看到 ruff 的真实输出。
      - name: Check formatting（告警，不阻断）
        continue-on-error: true
        run: ruff format --check scripts/

      - name: Check imports（告警，不阻断）
        continue-on-error: true
        run: ruff check scripts/ --select I --output-format=github
