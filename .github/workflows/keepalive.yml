name: keepalive

# 每 5 分钟戳一次刷题应用，防止 WorkBuddy 沙箱空闲休眠（冷启动实测 3.9s、热 0.6s）。
# 跑在 GitHub 的机器上 —— 关电脑、断网都不影响。
# 注意：GitHub 公开仓的定时任务在「60 天无仓库活动」后会自动停用；
#       正常开发有提交就不会触发，若发现停了，手动 workflow_dispatch 一次即可。
# 定时任务的准点率不保证（高峰期可能延迟 5~15 分钟），所以一次跑里连打 4 次，
# 尽量把「无人访问的空窗」压在沙箱休眠阈值之下。
#
# ⚠️ 2026-11-08 修复：本文件曾把地址写死为 senior-quiz-app（带账号的 FastAPI 版）。
#    该应用已于 2026-10-29 退役，/drill 改为跳转 medkit-study-app（参赛版），
#    但保活地址没跟着改 → 每次定时任务都打到一个返回「链接已失效」的域名，
#    从 10-29 起连续 41 次失败，全是同一个原因。
#    现在地址不写死：运行时从 functions/drill/[[path]].js 的 ENTRY 解析 ——
#    那是 /drill 跳转的唯一真源，换应用只改那一处，本文件自动跟随。
#    另：200 不再等于健康（下线时宿主返回的是带「链接已失效」的占位页），
#    所以改成校验 /api/ping 的 {"ok":true} 响应体。

on:
  schedule:
    - cron: "*/5 * * * *"
  # 改本文件或 /drill 真源时顺带跑一次：既是自检入口，也能在调度器延迟时立刻验证。
  # 真源必须一起监听 —— 保活地址是从它解析的，换了应用要马上验证新地址是活的。
  # ⚠️ 用 functions/drill/** 而不是写死 "functions/drill/[[path]].js"：后者带方括号，
  #    GitHub 每次 push 都要编译该 glob 才能决定是否触发，方括号会被当成字符类，
  #    实测直接让整个工作流被判「workflow file issue」（run 0 秒失败、无 job）。
  push:
    paths:
      - ".github/workflows/keepalive.yml"
      - "functions/drill/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drill-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # 10×(30s 超时 + 15s 间隔) ≈ 7.5 分钟重试窗口；上限给到 15 分钟，别让 job 被杀在重试中途
    timeout-minutes: 15
    steps:
      # 只需要 /drill 真源这一个文件；锥形 sparse-checkout 省掉整仓几十 MB 的图片
      - uses: actions/checkout@v4
        with:
          sparse-checkout: functions/drill

      - name: Resolve drill entry from /drill 真源
        id: entry
        run: |
          ping=$(python3 - <<'PY'
          import re, pathlib, urllib.parse
          src = pathlib.Path("functions/drill/[[path]].js").read_text(encoding="utf-8")
          m = re.search(r'const\s+ENTRY\s*=\s*"([^"]+)"', src)
          if not m:
              raise SystemExit("未在 functions/drill/[[path]].js 找到 ENTRY 常量，"
                               "保活地址无法确定——请修该文件或更新本工作流的解析规则")
          u = urllib.parse.urlsplit(m.group(1))
          # 应用宿主对每个请求都校验 ?sharecode=（不带即 403），健康端点也不例外
          print(f"{u.scheme}://{u.netloc}/api/ping" + (f"?{u.query}" if u.query else ""))
          PY
          )
          echo "url=$ping" >> "$GITHUB_OUTPUT"
          echo "解析到保活地址: $ping"

      - name: Ping drill app
        env:
          URL: ${{ steps.entry.outputs.url }}
        run: |
          # 两种失败必须分开处置（2026-11-14 归因）：
          #   403 / body 含「链接已失效」 = 应用真下线或分享码变了，立刻失败，不必重试；
          #   000 且空 body             = 连接层就没建起来（沙箱唤醒窗口 / 跨境网络抖动），要等，不是故障。
          # 旧版只有 4×(30s+10s)≈2 分钟窗口，吃不住唤醒 → 偶发误报（run 43595372430，4 次全 000）。
          # 现改为 10×(30s+15s)≈7.5 分钟：单次超时保持 30s 不动（冷启动本身就要几秒，
          # 压到 15s 反而会自己制造 000 —— 本地实测 3s 超时时 body 已完整返回却仍判 000）。
          for i in $(seq 1 10); do
            # ⚠️ 必须先清空 /tmp/body：否则本轮请求失败时会读到上一轮的残留 body 造成假阳性
            : > /tmp/body
            metrics=$(curl -s -o /tmp/body \
              -w '%{http_code} dns=%{time_namelookup}s conn=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s' \
              --max-time 30 "$URL" 2>/dev/null || true)
            # curl 在 DNS/TCP 阶段就失败时可能一行都不输出，兜个底避免 code 变空串
            metrics=${metrics:-000 dns=n/a conn=n/a tls=n/a total=n/a}
            code=${metrics%% *}
            body=$(head -c 200 /tmp/body 2>/dev/null | tr -d '\r' | tr '\n' ' ')
            echo "attempt $i/10 -> ${metrics}  body=${body:0:120}"

            # 先判真故障：false 的 ok 值、失效占位页，不该浪费时间重试
            if [ "$code" = "403" ] || grep -q "链接已失效" /tmp/body 2>/dev/null; then
              echo "::error::刷题应用已下线或分享码失效（HTTP ${code:-000}）。地址取自 functions/drill/[[path]].js 的 ENTRY，当前为 $URL"
              echo "::error::请确认该应用仍在发布、分享码未变更；换应用后本工作流会自动跟随，无需改本文件"
              exit 1
            fi

            # 判活只看应用是否真的应答了 ok:true —— 不强制 200：
            # curl 因连接未干净收尾而报 000 时，body 里可能已经是完整的健康响应（本地实测过）。
            if grep -q '"ok":[[:space:]]*true' /tmp/body 2>/dev/null; then
              echo "健康端点正常（HTTP ${code:-000}，body 含 ok:true）"
              exit 0
            fi

            [ "$i" -lt 10 ] && sleep 15
          done

          # 10 次都没通：把「解析成什么 IP」打出来，一眼分清 DNS 问题还是连接被拦
          host=$(printf '%s' "$URL" | sed -E 's#^https?://([^/:?]+).*#\1#')
          echo "::group::诊断信息"
          echo "目标主机: $host"
          echo "--- getent hosts ---"
          # 不要用 `getent ... || echo "解析失败"`：命令本身不存在时也会走到那个分支，把「没工具」误报成「解析失败」
          if command -v getent >/dev/null 2>&1; then
            getent hosts "$host" || echo "（DNS 解析不到该域名）"
          else
            echo "（环境无 getent，跳过）"
          fi
          echo "--- 最后一次 curl 详情 ---"
          curl -sv --max-time 10 "$URL" 2>&1 | tail -20 || true
          echo "::endgroup::"
          echo "::error::刷题应用连不上（10 次尝试约 7.5 分钟内均未拿到 {\"ok\":true}，最后 HTTP ${code:-000}），请检查沙箱是否被回收"
          exit 1
