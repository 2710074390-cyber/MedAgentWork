# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-case-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^__pycache__/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-error-summary]
        exclude: ^tests/
        additional_dependencies: [types-requests]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-scripts-permissions
        files: ^scripts/.*\.py$

  # ── P2 防跳过（2026-11-05）─────────────────────────────────────────────
  # 提交前只审「暂存区涉及」的批次：回执链是否完整、batch048+ 的产物+回执
  # 是否都进了索引。不跑 --recheck（内容复检留给 CI，本地保持秒级）。
  # 只在批次产物路径变化时触发；纯脚本/文档提交不跑。
  # 启用：pre-commit install（一次性）。
  - repo: local
    hooks:
      - id: batch-gate-staged
        name: 批次门禁审计（暂存批次：回执链 + 入库）
        entry: python scripts/gate_audit.py --staged --require-tracked
        language: system
        pass_filenames: false
        files: ^(最终产物|中间产物|质检报告|复习资料)/
        stages: [pre-commit]
